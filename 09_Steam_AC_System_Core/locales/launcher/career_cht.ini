series24=成為BMW GT2車隊的車手!</br></br> 這對一位專業車手來說是一項偉大的成就。雖然這輛車目前有點老舊，但它依然充滿競爭力，車隊也非常期待你的優異表現。</br></br> 請為車隊收集至少<strong> 60點積分，</strong>這會是展現你價值的表現機會。
series24_event1=你或許略有所聞，我們的車款擁有輝煌的成功歷史和健全的基本設定，我們明白這些設定能車體完美運作。我們會先讓你在第一個賽道上熟悉一下基本設定值，接著再根據你的駕駛風格來做一些細部微調。前後定風翼設定為2-4、最終齒輪比設定為10/50、第6齒輪比設定為34/31、中等輪胎胎壓設定為21。
series24_event2=讓我們先以Nurburgring GP賽道的設定開始，不過為了符合Vallelunga賽道的狀況，我建議將前ARB調高1，且第6齒輪比也調高1。這台車在Vallelunga的慢速髮夾彎過彎狀態都在我們的掌控之中，雖然操控起來很有趣，但為了獲得更好的成績，你仍應該防止過度轉向的情況，並最大化車體牽引操控。
series24_event3=再次從Nurburgring GP賽道的設定開始吧。用稍微長一點的第6齒輪比，定為25/31。如果你需要更多的車胎咬合力，我會建議-3.8的前傾角和-3的後傾角。要注意避免在煞車時的鎖死狀態，以防止磨平你的車胎胎面，同時也避免這輛車在路緣時的不安定性。
series24_event4=Mugello賽道擁有大量的高速彎道，這會讓懸吊系統長時間撞擊在緩衝器上。我們將會使用Silverstone賽道的設定並著手調整緩衝彈簧的係數，來讓這輛車在駛經路緣時能更加平穩。將前緩衝器係數設定為130、後緩衝器係數設定為100。你可能會遭遇輪胎過熱的問題，減少一些負傾角並調整你的駕駛習慣來避免這個問題。如果這問題一直發生，試試看使用硬輪胎，不過請記住，這個設定並未經過此複合式賽道的嚴苛狀態測試。
series24_event5=我們只需要做一些微調，就能讓Mugello賽道的設定適用於Imola賽道，主要在調整阻尼器的設定。將前快速阻尼設定為60、後阻尼設定為40。前快速回彈阻尼器設定為140、後快速回彈阻尼器設定為85。後回彈阻尼器設定為20。後懸吊系統位移距離設定為80。讓這輛車保持些微的彈性，然後看看你能在路緣上發揮這輛車多少馬力吧。
series24_event6=我們需要最小化空氣阻力來面對Monza賽道。以默認設定為基礎，將前後定風翼調整為0-2、前後中等輪胎設定為28-21、後ARB為0。同樣地，請小心操作你的煞車以避免磨平胎面。如果你想要大膽一點，可以嘗試將後定風翼降為1，再將前ARB調高一些來平衡整體性能。
series24_event7=Spa Francorchamps是此賽季的最後一個賽道。我們建議以Nurbrugring GP的設定為基礎，並將前傾角設定為-3.8、後傾角設定為-3。使用大一點的第6齒輪比，可以調整為25/31。
series25=成為BMW GT2車隊的車手!</br></br> 這對一位專業車手來說是一項偉大的成就。雖然這輛車目前有點老舊，但它依然充滿競爭力，車隊也非常期待你的優異表現。</br></br> 請為車隊收集至少<strong> 60點積分，</strong>這會是展現你價值的表現機會。
series25_event1=相較於針對每一個賽道規劃出不同的設定，我們的工程師反而亟欲要在這賽季之中提昇車體的穩定性。像你這麼一位有經驗的車手，想必能克服車輛操控性的問題，也能在一場又一場的競賽後，針對車輛性能的提昇提出有效的意見回饋。我們會先從Nurburgring GP設定開始，搭配胎壓21的中等輪胎，減少一刻度的最終齒輪比，默認的定風翼設定，後ARB設定為2。記得，當引擎在超過7000轉速之後會失去真正的馬力，所以當看到燈號閃爍時，務必要換檔。
series25_event2=Nurburgring的設定還算不錯，不過缺少了一些牽引力的調整。我們會以同樣的設定來著手，並針對Vallelunga賽道做出牽引力的改進。載入Nurbrugring GP的設定，將後ARB降低為0，用-3.0的前負傾角來增加一些前端咬合力。前輪轉速設定為120，來幫助煞車咬合性。增加一刻度的第6齒輪比，採用25/24的係數。
series25_event3=Silverstone賽道的過彎速度特性非常適合我們的跑車。讓我們先從Vallelunga的設定開始，將第5齒輪比設定為23/26、後輪轉速設定為110、前高度設定為6、後高度設定為2、後壓縮阻尼設定為30、後快速回彈阻尼設定為97。這樣的設定能讓我們在駛經路緣時有較好的穩定性。如果此設定運作良好，我們也會將之用在Imola賽道。
series25_event4=這輛車的設定目前運作良好，為了適應Mugello賽道，照慣例，讓我們先以Silverstone的賽道設定開始。先增加一些前懸吊系統位移距離來幫助車體前端面對長彎道，將數值調整為40，後輪轉速率調整為105，這樣的設定應該就足夠了。中等輪胎在此賽道應該會有過熱情況，你應該能掌控車胎過熱的情況，但為了預防更糟的可能問題，選用硬胎應該是更好的決定。
series25_event5=到目前為止，我們針對Mugello賽道的設定已經足以對付Imola的跑道了。中等輪胎會是最好的選擇。如果車胎溫度低，在Tosa彎道時請多加留意。你可能會遭遇一些牽引力的問題，如果這個狀況持續發生，你可以試著把後胎胎壓降低1到2個刻度。坦白說，我們的基本設定已經非常的棒了。
series25_event6=Monza是一條特殊的賽道，我們會盡可能地將空氣阻力降到最低，同時不影響車輛整體的平衡性。將前後定風翼設定為0-2。如此一來這輛車的前部就會有較多的向下壓力，降低前車的位移並限制仰角靈敏度。前高度設定為15、前懸吊位移距離設定為30、前緩衝器係數設定為150、前ARB設定為10、中等輪胎設定為26-22、最終齒輪比設定為10/34，第6齒輪比設定為27/28。如果你在操控性上仍遭遇問題，試著將後定風翼設定為3。
series25_event7=面對此賽季最後的賽道Spa，我們將會採用在Imola開發的最新設定。我們要做的只有調整齒輪比來讓車輛更適應此賽道的長直線跑道。載入Imola的設定並將最終齒輪比設定為10/34，這樣就很完美了。車隊非常感謝你付出的努力，我們共同為這輛客製化車型創造出了非常棒的設定值，幹得好!
series26=Ferrari 458 GT2官方車手!</br></br> 抱持著耐心和奉獻一路參與Ferrari小型賽事的你，最後終於得到回報了。成為Ferrari車隊的職業車手就像是一場美夢成了真。</br></br> 車隊需要至少<strong> 60 點冠軍賽積分。</strong>
series26_event1=相較於針對每一個賽道規劃出不同的設定，我們的工程師反而亟欲要在這賽季之中提昇車體的穩定性。像你這麼一位有經驗的車手，想必能克服車輛操控性的問題，也能在一場又一場的競賽後，針對車輛性能的提昇提出有效的意見回饋。我們會先從Nurburgring GP設定開始，搭配胎壓21的中等輪胎，減少一刻度的最終齒輪比，默認的定風翼設定，後ARB設定為2。記得，當引擎在超過7000轉速之後會失去真正的馬力，所以當看到燈號閃爍時，務必要換檔。
series26_event2=Nurburgring的設定還算不錯，不過缺少了一些牽引力的調整。我們會以同樣的設定來著手，並針對Vallelunga賽道做出牽引力的改進。載入Nurbrugring GP的設定，將後ARB降低為0，用-3.0的前負傾角來增加一些前端咬合力。前輪轉速設定為120，來幫助煞車咬合性。增加一刻度的第6齒輪比，採用25/24的係數。
series26_event3=Silverstone賽道的過彎速度特性非常適合我們的跑車。讓我們先從Vallelunga的設定開始，將第5齒輪比設定為23/26、後輪轉速設定為110、前高度設定為6、後高度設定為2、後壓縮阻尼設定為30、後快速回彈阻尼設定為97。這樣的設定能讓我們在駛經路緣時有較好的穩定性。如果此設定運作良好，我們也會將之用在Mugello賽道。
series26_event4=這輛車的設定目前運作良好，為了適應Mugello賽道，照慣例，讓我們先以Silverstone的賽道設定開始。先增加一些前懸吊系統位移距離來幫助車體前端面對長彎道，將數值調整為40，後輪轉速率調整為105，這樣的設定應該就足夠了。中等輪胎在此賽道應該會有過熱情況，你應該能掌控車胎過熱的情況，但為了預防更糟的可能問題，選用硬胎應該是更好的決定。
series26_event5=到目前為止，我們針對Mugello賽道的設定已經足以對付Imola的跑道了。中等輪胎會是最好的選擇。如果車胎溫度低，在Tosa彎道時請多加留意。你可能會遭遇一些牽引力的問題，如果這個狀況持續發生，你可以試著把後胎胎壓降低1到2個刻度。坦白說，我們的基本設定已經非常的棒了。
series26_event6=Monza是一條特殊的賽道，我們會盡可能地將空氣阻力降到最低，同時不影響車輛整體的平衡性。將前後定風翼設定為0-2。如此一來這輛車的前部就會有較多的向下壓力，降低前車的位移並限制仰角靈敏度。前高度設定為15、前懸吊位移距離設定為30、前緩衝器係數設定為150、前ARB設定為10、中等輪胎設定為26-22、最終齒輪比設定為10/34，第6齒輪比設定為27/28。如果你在操控性上仍遭遇問題，試著將後定風翼設定為3。
series26_event7=面對此賽季最後的賽道Spa，我們將會採用在Imola開發的最新設定。我們要做的只有調整齒輪比來讓車輛更適應此賽道的長直線跑道。載入Imola的設定並將最終齒輪比設定為10/34，這樣就很完美了。車隊非常感謝你付出的努力，我們共同為這輛客製化車型創造出了非常棒的設定值，幹得好!
series27=Ferrari 458 GT2極限系列賽。</br></br> 抱持著耐心和奉獻一路參與Ferrari小型賽事的你，最後終於得到回報了。成為Ferrari車隊的職業車手就像是一場美夢成了真。</br></br> 車隊需要至少<strong> 60 點冠軍賽積分。</strong>
