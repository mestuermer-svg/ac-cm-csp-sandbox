series12_event4=著名的斯帕-弗朗科爾尚賽。嘗試在此賽道上通過鼎鼎大名名的愛羅格彎吧。此賽場上彎道雖是公認的困難，但也不是完全不可戰勝。
series12_event5=Imola是一個十分講究技術的賽道。請特別留意下坡路段的Rivazza彎。也許在進入下坡以前可以試著利用ABS制動系統穩定你的車輛。
