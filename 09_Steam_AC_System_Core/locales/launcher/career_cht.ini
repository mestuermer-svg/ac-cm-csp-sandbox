series21_event7=SPA是一個完整的賽道，忽快忽慢的彎道，非常像Silverstone賽道，但有著更驚人高低起伏，還有要求速度極高的上坡。開始將前後定風翼設定為0-4。前ARB 設定 7以增加穩定性。你會需要使用到硬輪胎，並降低3點胎壓.。第6齒輪比縮短1點。調整前煞車偏差值至72%
series22=做得好!你成為Mercedes SLS GT3車隊的車手了!</br></br>Mercedes SLS GT3是這個系列賽中最強大且令人驚豔的車款之一。和Mercedes的跑車競賽會是你未來生涯最美好的事蹟。</br></br> 請在冠軍賽中收集至少<strong> 60點積分。</strong>
series22_event1=Mercedes SLS GT3根據出廠設定就是一輛性能非常強大的跑車。我們只要做一些簡單的微調，讓它能在Nurburgring GP賽道上獲得更好的表現。使用中等輪胎，並降低2點第6齒輪比。空氣動力設定為1-6。 煞車偏差值設定為70%。前輪轉速設定為100。這款引擎的扭矩強大，建議你將牽引力控制設定在5或6，否則你很容易遇到牽引力控制的問題。
series22_event2=由於在低轉速的時候會有太大的扭矩，在Vallelunga賽道內的慢速彎道時，你必須專心在牽引力的操控上。定風翼設定為1-6。中等輪胎的前後胎壓設定為25-24。差速器設為35%，煞車偏差值設定為70%。前輪轉速設定為100，並將後輪轉速同樣設定為100，後ARB為0。你可能會覺得這樣的設定有些不夠，但牽引力表現將會非常優秀，你甚至不用擔心牽引力控制設定。
series22_event3=有鑑於我們車款的特性並不能在Silverstone賽道的快速彎道中發揮最好效果，我們將盡量讓車體在快速通過Maggots彎道區的時候保持安定性，並盡可能做出最小的妥協來面對賽道的其他彎道區。前後定風翼設定為1-7、前輪轉速設定為110、後ARB為0、煞車偏差值70%、第6齒輪比縮短1點。你需要微調牽引力控制以面對慢速彎道，建議設定為6或7。跑出個好成績吧。
series22_event4=Mugello也是一個擁有快速彎道區的賽道，不過它同時也有一條很長的直線爬坡道。我們將會在該直線道採取進攻策略，並在彎道處採防守姿態。前後定風翼設定為1-5、前ARB為6、後輪轉速設定為100、前高度設定為2、後高度設定為0、煞車偏差值設定為70%。在酷熱氣候下你絕對需要硬輪胎。在第一圈的時候放輕鬆，面對快速彎道的時候請平穩地駕駛。
series22_event5=只要你能順利駕駛過路緣，那Imola會是一條適合我們跑車的賽道。我們將會採用高下壓力的設定，藉此來發揮我們車款的馬力和扭矩，讓車體在路緣跳躍時能保持一定的貼地。前後定風翼設定為1-8、中等輪胎後胎壓設定為21、前輪轉速設定為110、後ARB設定為0、後阻尼設定為7、後快速阻尼設定為30、煞車偏差值設定為69%。面對路緣時大膽進攻，但在著地時請保持輪胎的操控性。
series22_event6=是時候來讓馬力全開了，Monza賽道代表著全力加速和最高速度的表現。我們需要用上硬輪胎，將前胎壓提高到29、前後定風翼設定為0-2、煞車偏差值設定為71%、前輪轉速設定為120、後輪則是105，後ARB為0。有了調校平衡並能超過270km/h的最高速度下，沒有多少其他車款能和我們相抗衡。
series22_event7=Spa賽道是我們奪冠的最後一個機會了! 我們可以先採用Mugello賽道的設定來檢視能否在成績上有所突破。前後定風翼設定為1-5、前ARB為6、後輪轉速設定為100、前高度設定為2、後高度為0、煞車偏差值為70%。氣候寒冷，我們可以冒險一試中等輪胎。在第一圈的時候放輕鬆，面對快速彎道的時候請平穩地駕駛。
series23=恭喜! 你解鎖了Mercedes SLS GT3 極限賽!</br></br>在你面前的將是一整季的考驗，包括了在賽季週末的練習和排位賽。Mercedes SLS GT3工作團隊需要你的全力付出。</br></br> 請在冠軍賽中收集至少<strong> 60點積分。</strong>
