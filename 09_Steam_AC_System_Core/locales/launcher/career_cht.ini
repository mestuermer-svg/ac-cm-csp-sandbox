series1_event1= 小型的Abarth 500 EsseEsse是一款入門型車輛。同時有良好的樂趣和安全的操控性。在Vallelunga俱樂部賽道上進行計時賽訓練，同也時為您的第一場比賽做好準備。
series1_event2=本地的Abarth俱樂部正在組織一個小型單人比賽。在這快節奏的3圈比賽展現你的車技。
series1_event3= 您贏得了其他汽車愛好者的信任。一個朋友提供他的Alfa Romeo Giulietta QV給您在Magione賽道進行計時賽，讓他知道您值得如此！
series1_event4= 你做得很好，所以你現在有機會把美麗的Alfa Romeo Giulietta QV開向本地的Magione賽道。注意此地的對手，他們似乎有準備一些Abarths賽車，而且擁有更好的輪胎，懸掉系統且升級了引擎。在這5圈比賽中向他們展現你的實力吧。
series1_event5= Magione賽道的特色之一是滿滿的沙塵。您現在有機會嘗試駕駛BMW M3 E30在這個充滿塵土且低抓地力的賽道上。注意剎車時機和過彎問題。
series2=成功解鎖初階系列賽2！ </br></br> 你在第一個系列賽中做得很好，所以現在是時候讓你畢業並駕駛一些正統的後輪驅動車了。這些BMW出品的頂尖超跑，不僅快速而且振奮人心，而且還可以幫助您提高駕駛技術。</br></br> 贏得 <strong> 2 枚銅牌1 枚銀牌</strong> 來完成此系列賽。
series20=歡迎來到McLaren GT3車隊!</br></br> McLaren GT3耐力車隊計劃在耐力賽冠軍賽賽季中提拔表現最佳的車手。</br></br> 車隊認為你需要在冠軍賽中收集到<strong> 60點積分 </strong>。
series20_event1=耐力冠軍系列賽開始於Nurbugring GP賽道。您的車隊工程師建議設定您的McLaren MP4 12C GT3進行第一場比賽。使用中等輪胎，並將其胎壓降低2左右。後定風翼設定為6，且最終齒輪比設定的較短。先嘗試安全地駕駛。賽程很長，我們可以在你一步步適應車輛後，再進行反攻。
series20_event2=Vallelunga賽道會有更多停停走走的狀況。讓我們在設定上的調整更加激進一些。 前定風翼設計為1、後定風翼設計為5、前輪胎壓降低2 、後輪胎壓降低1 、後ARB提高1、也許你也需要將煞車偏差設定提高1。最好一次調整一個部分，並同時觀察結果。 如果在通過慢速彎道時遇到問題，嘗試將牽引力控制設定在6或7看看。
series20_event3=Silverstone賽道有一些非常棘手的彎道和容易使輪胎過熱的路面。請將胎壓維持在預設的中等設定。由於最高速度在這裡不如高速抓地力那麼重要，建議您保留預設的空氣動力設定。也許將前ARB提高2會讓車輛更穩定。如果在彎道煞車時遇到問題, 也許你也需要將煞車偏差設定提高2。也建議再次嘗試將最終齒輪傳動比縮短一點。
series20_event4=Mugello賽道是對輪胎，駕駛技術和設定調整上的難關。如果輪胎溫度太高，可能需要在這裡使用硬質輪胎。使用0-4前後定風翼設定來強化長直線上的最高速度。將前輪轉速降低2點，後輪轉速降低4點，可以令差速器發揮更大作用。使用20% 動力差速器可以令車輛通過長彎道時更加迅速。煞車偏差直設定於73可令車輛在煞車時更加穩定。 6號齒輪也可再縮短1點。
series20_event5=Imola是個非常棘手的賽道。車輛的阻尼會為了能穩定越過賽道的路緣需要承受很大的工作量。中等胎壓降低2 ，設定前回傳阻尼12、前阻尼15、後阻尼5、後快速阻尼30、後位移距離70、後ARB 0、動力差速器40%。 最終齒輪比再縮短1點。
series20_event6=稱霸Monza賽道的關鍵是最高速度和應對慢速彎道上的敏捷性.。開始將前後定風翼設定為0-1。前後懸吊系統設定為24-21 。使用硬輪胎且前後胎壓設定在29-27。同時請注意過熱問題。前ARB 設定 7、後ARB 設定 0。提高前煞車偏差值至71可提高煞車穩定性。在比賽開始時要注意，在第一個彎道中，很容易發生事故。 
series20_event7=SPA是一個完整的賽道，忽快忽慢的彎道，非常像Silverstone賽道，但有著更驚人高低起伏，還有要求速度極高的上坡。開始將前後定風翼設定為0-4。前ARB 設定 7以增加穩定性。你會需要使用到硬輪胎，並降低3點胎壓.。第6齒輪比縮短1點。調整前煞車偏差值至72%
