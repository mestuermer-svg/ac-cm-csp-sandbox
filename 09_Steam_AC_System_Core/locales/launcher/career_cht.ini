series1=歡迎來到 Assetto Corsa 生涯模式.<br/><br/> 駕駛Ferrari 458 GT2將不再只是夢想!但是在成為一位專業車手之前，還是得先做好一些準備工作。先從小巧的Abarth 500 EsseEsse開始上手吧。小巧的Abarth也許直線的極速不高,但是應對狹小的彎道卻是十分靈敏.您能發揮它的極限，並善用前輪驅動系統的優勢嗎?<br/><br/> 贏得 <strong>3枚銅牌</strong>以上，即可晉級下個系列賽。
series10=歡迎來到Abarth方程式冠軍盃。</br></br> 這項單人乘坐車種的冠軍賽事是對車手最重要的考驗之一。在這項賽事中表現傑出的選手往往可以得到職業車隊的青睞。</br></br> 得到<strong>40個積分 </strong>讓職業車隊對你留下深刻的印象吧。.
series10_event1=CSAI Abarth方程式冠軍賽將從馬焦內開始。極為狹小的賽道是此賽場的特色，同時對單坐式賽車來說它的路面也是十分崎嶇。為了應對崎嶇的賽道和路障，您或許要調高您的車身，並設法讓懸吊系統更加柔軟。
series10_event2=Vallelunga 賽道很容易實現你來我往的超車場面。同時在賽場上也藏有一些"小秘密"，您可以嘗試一些不尋常的駕駛路線來發現它。 找出此秘密路線有機會使您每一圈的成績快上個半秒。
series10_event3=Mugello也許是難度最高的賽道之一。長而彎曲的賽道考驗車輛的下壓力,但同時具備極長的直線賽道而對最高速度有不低的要求。您必須從中取得平衡。盡可能避免碰撞路障，它會嚴重破壞你的駕駛速度。
series10_event4=紐柏林GP也是一個技術要求不低的賽道。無論是下坡的髮夾彎或是上坡路線的減速彎，五花八門的地形讓您從1檔狂飆至5檔。膽大心細就是制霸此賽場最好的訣竅。
series10_event5=人們常稱Imola賽道為小紐柏林。如果要征服此賽道，你會需要嘗試跳過這些路緣，但這並不是一件容易的事。如果要跑出完美的成績，你也許要冒一些風險，但你有可能整場比賽都這樣有驚無險嗎?
series10_event6=Silverstone可謂應有盡有。從低檔速的髮夾彎一路狂飆至6檔的減速彎! 如果想從容地面對這個瘋狂的賽道，駕駛技術、車輛調校、還有堅定的勇氣三者都缺一不可。
series10_event7=想在這個極速賽道上取得成功，必須得保持夠低的下壓力並制定優秀的滑流戰術。將車身調的較低可以讓分流器發揮更好的作用，但也請注意與路緣保持距離，並避免刮傷底盤。
series10_event8= CSAI Abarth方程式冠軍賽的最後一場賽事,也是在本賽季取勝的最後機會.。奧羅赫很可能這世上最刺激、最驚險、最引人入勝的賽道。您將面對足足長達七公里賽道的挑戰。
series11=Ferrari 599XX 錦標賽。</br></br> 599XX錦標賽是一項限定車種的系列賽,僅開放於. 擁有限定XX法拉利方程式車種的車手。一部分專業車手也會受邀並被仔細審視。其中表現最優秀的便有可能成為Ferrari GT車隊的一員。 </br></br> 收集<strong> 系列賽中36點積分</strong>取得成為法拉利車手的機會。
series11_event1=駕駛如此強勁的車種在彎道狹窄的Magione賽道可不是一件簡單的事。材質較軟的聚合輪胎和較低的胎壓將能起上大用。同時您也得控制好車輛的牽引力, 在消化過剩的馬力的同時增加牽引力。
series11_event2=Ferrari 599XX EVO在Vallelunga賽道將會迎来時速高達250km的下坡路段，就是這麼快!如果你一開始就打算全速衝刺，很可能馬上就會在過彎中失去控制，你要不是真的膽識過人就會顯得有些愚蠢。最好以良好的穩定性為目的去調整車輛的配置。
series11_event3=又快又長又彎，這就是Mugello。599XX EV是輛極為優秀的跑車,但前提先是必須對它的空氣動力設計十分了解且自信。在過彎時，當你發現車頭有些上傾，請嘗試再多打一下方向盤，電子系統會偵測到你需要更強的前抓地力。結果會讓你感到驚喜的。
series11_event4=Nurburgring GP可以說是將你以往所經歷過賽道中之難關集大成的賽道。慢速髮夾彎考驗著車輛的牽引力，同時又有要求高穩定性與抓地力的極速彎道。找出最合適的車輛設定吧，祝你好運。
series11_event5=使用高馬力的車輛挑戰伊莫拉可不容易。我們了解躍過路緣的跑法可以在此賽道取得良好的成績，但在750制動馬力的情況下，這就是個大難題了…也許現在就是使用manettino旋扭的好時機了，利用它選出最合適的牽引力控制等級吧。
series11_event6=現在你必須學習如何利用599XX的電子系統去控制它的空氣動力功能了。 如果你想要好好試試這項功能，Silverstone是一個很好的選擇。此地氣溫雖不高，但路面卻容易使輪胎過熱，所以在調整相關設定的時候，請務必三思而行。
