series28=賽車領域的巔峰!</br></br> 過往傳奇的方程式賽車如今依然在賽場上發出耀眼的光芒和震耳欲聾的咆哮。感謝那些車主們的熱情，讓那些賽車如今依然馳騁在賽道上，能駕駛這些車輛的只有真正專業的車手，而這些車手的價值和不斷挑戰極限的熱情值得我們給予最大的敬意。</br></br> 收集<strong> 3 枚銅牌、2枚銀牌和1枚金牌</strong>。
series28_event1=經典車隊Lotus想要你去試駕他們保存良好的跑車Lotus type 49。這輛車是F1歷史上最高的技術成就之一，它的馬力驚人且車體非常的輕。你可以在彎道處神奇地甩尾，但請留意煞車距離。強大的最高速度和無ABS的設計，這意味著相較於你過往的駕駛習慣，你應該要提早開始踩煞車。
series28_event2=駕駛經典車隊的Lotus type 49無疑是一場眼界大開的體驗，但想像一下，在1967年的時候開著這台車在Monza賽道上馳騁的畫面。雖然這個賽道和過去沒有差多少，一樣沒有慢速彎道，不過閉上你的眼睛想像一下，回到那個年代，那時在賽車場上充滿了危險還有... 嗯，你懂，安全至上。
series28_event3=回到1975年，Ferrari 312T這台車曾在Niki Lauda和Clay Regazzoni手中為Ferrari車隊贏得雙料F1世界車手冠軍和世界車隊冠軍。如今，你可以在Imola賽道上駕駛這輛車競速，並透過這台傳奇跑車的輪下威力來體驗那些史詩的戰役。
series28_event4=Lotus Exos的客戶團隊來到了Silverstone，他們要進行一場測試賽。他們需要專業的車手來展示一下這輛跑車，以便讓真正的買家出現前調整到最佳狀態。把Lotus Exos的性能推到極致，並讓所有的潛在客戶為之驚豔吧。
series28_event5=你在Silverstone駕馭Exos 125的表象讓Lotus車隊印象深刻，他們決定邀請你擔任客座車手，駕駛調校過的Lotus Exos 125 S1參與一場賽事。賽道選定在Mugello，你會有一整個週末的競賽時程，好讓我們把這輛跑車調整到最佳狀態，拿出你最好的表現，祝你好運!
series28_event6=經典車隊Lotus對你新近的表現印象深刻，他們認為你足以駕馭Lotus潛力無窮的車款。Lotus 98T在1985年的駕駛車手是Ayrton Senna，在那個以渦輪聞名的時代，造就了最強大的F1跑車，在排位賽的情況下跑出了1000的制動馬力。只有最優秀的車手能掌控如此兇猛的車款，並將其潛力發揮到極限，也許你就是那個萬中選一的人。
series2_event1=你剛加入了BMW車隊的世界，接下來你有很多機會和這個廠牌最具指標性的車輛一較高下。讓我們先在德國跑車的故鄉Nurburgring賽道進行一些訓練吧。要加入BMW挑戰之前，你必須先在下列時間競速賽中收集至少1200點積分： 準備好了嗎?
series2_event2=BMW俱樂部正在為車隊成員規劃有趣的競賽。由於你展現了高超的駕駛技術，俱樂部決定邀請你作為嘉賓，並提供你一輛BMW Z4 35is。它或許不是BMW最快的車，但足以讓你在Monza賽場上的長直線車道佔有一定的優勢。
series2_event3=這是第二場BMW俱樂部的競賽。這輛嬌小但充滿傳奇色彩的M3 E30現在是你的了。這輛車具有絕佳的靈敏度，但馬力卻不太夠。Nurburgring GP賽場正好有一些長程直線車道，如此一來你就有機會和其他現代車款拼搏一場了。
series2_event4=你已經試過了所有M3車系的前代車款了，現在是時候讓你駕馭最新一代的車輛了。這輛車有著夢幻般的底盤，它強而有力的V8引擎有著驚人的馬力。拿出你最好的表現，老實說，我們期待你至少能站上領獎台。
series2_event5=雖然M3享有盛名，但許多人仍相信更輕量、更短小敏捷的1M系列雙門轎跑車才是傳統M3車系的真正繼承者。它的馬力雖然較低，但卻有更強的扭距和渦輪引擎，這讓它在挑戰極限的時候更有競爭力。你準備好再次站上領獎台了嗎?
series2_event6=表現得太優秀了! BMW的競賽車部門已經開始注意你了。他們打算邀請你參與一次試駕，開的是真的競賽用車! 你現在可以開著這輛輝煌的BMW Z4 GT3來參加時間競速賽。好好駕馭它吧。
series3=恭喜! 你現在可以參加初階系列賽3了。</br> 一間來自澳洲、小規模但很有名的製造商正在觀察你駕駛BMW的情況。KTM以賽車聞名，同時也創造了今日極限賽事上最具競爭性的強大武器。KTM X-Bow R現在可以讓你用來參加整個系列賽了。</br></br> 贏得 <strong> 2枚銅牌和1枚銀牌 </strong> 來讓KTM工程師團隊留下深刻印象。
series3_event1=歡迎來到超輕量車的世界。KTM X-BOW-R被認為是這類型中最讓人激動不已的車款。現在你有機會見識到這輛車驚異的操控表現，並駕馭它在最具挑戰性的賽場上：Imola的Autodromo "Enzo e Dino Ferrari"賽道。
series3_event2=KTM正在為其團隊成員安排競賽。你受邀成為嘉賓了，同時你也能駕駛KTM X-BOW R。至少獲得第三名的成績來獲得這輛車，並贏得參加X-BOW R挑戰賽的資格。
series3_event3=你最近在Vallelunga俱樂部賽道展現出了高超的技巧，現在是時候來挑戰GP賽道了。對Roman賽道來說，X-BOW R是最完美的車型。Campagnano彎道是你用來超車的絕佳位置，謹記在心吧!
series3_event4=這是贏取X-BOW R的最後一關了。Nurburgring的短賽道對你來說已經不成問題了。別浪費這個好機會，把這輛車帶走吧!
series3_event5=你現在已經擁有自己的X-BOW R了，你可以自由挑戰這輛車原本的車手。除非...你懂的，看你有沒有勇氣了...
series4=歡迎來到初階系列賽4。</br></br> 你在KTM的優秀表現已經讓不少人感到驚豔。X-BOW是此類車款的代表作，這是其他缺乏輕量車型歷史的廠牌所望其項背的。<strong> Lotus</strong> 車隊需要你為其效勞，你需要增進自己在中型引擎車輛的駕駛技術。</br></br> 在此系列賽中贏得<strong> 3枚銅牌和1枚銀牌</strong>。
series4_event1=Lotus車隊，鮮少有其他廠牌能挑戰這個充滿傳奇歷史的偉大車隊。你現在有機會駕駛他們入門級輕量化賽車了，如果你表現出色，還有機會能成為Lotus車隊的客座車手並參加他們的賽事。
series4_event2=表現得很好! 現在你可以進階並駕駛有著相似操控性的Exige 240R。但請注意，雖然你能快速適應這輛車的操控性，但它卻有更快的速度! 你的對手都是一些經驗豐富的Lotus死忠愛好者，當然其中也有一些專業車手，這項挑戰不太輕鬆喔。
series4_event3=有車隊正在舉辦賽事，地點位於Silverstone International。大部分的死忠車迷覺得Evora不過是台過氣的老跑車，不過經過微調的Lotus Evora S2將會是你強大的武器，能幫助你對抗其他競爭者，順便好好給他們上一課。
series4_event4=Lotus的工程師想要測試Lotus Exige S的極限。這輛車的名稱雖然很眼熟，但它有著全新的底盤並附掛了強大的V6引擎。你可以自行決定要不要參加這場時間競速賽，並將這輛車的潛力發揮到極致，看看它有多少能耐。
series4_event5=經過了這場精彩的時間競速賽，你現在已經被邀請擔任Lotus Exige V6獎盃競賽的客座車手。你的對手們經驗豐富，請小心應付他們的小手段還有高超的技術。
series4_event6=Lotus 2-11年度錦標賽造訪了Magione。你被受邀參加此場盛會，先別興奮過頭，2-11是一輛有著開放差動齒輪的車，這會讓它的後內輪在面對像Italian賽道的狹彎時易於失控旋轉。如果你不多加留意的話，這個情況會讓你的車速降低並耗損你的輪胎。你需要用正確的操控技術來駕馭它。
series4_event7=Lotus車隊的工程師認為你是最好的人選，能幫助他們讓GTC車型有更強大的進化。你被受邀駕駛全新的Lotus Evora GTC賽車來參與一場時間競速賽，賽道則是難度相當高的Imola。當天氣候炎熱，請小心過熱問題。請依照情況適時調整車體設定，然後放手追求極限吧!
series5=恭喜，你現在能參加進階系列賽1了!</br></br>當你為知名車廠Lotus駕駛車輛並有精彩的表現，其他英國車廠會將目光投注在你身上也不足為奇了... 對了，等你電話響起時，McLaren就在電話的另一頭等著和你通話，我知道這情況一定很難讓人冷靜下來。</br></br> 贏得 <strong> 2枚銅牌和1枚銀牌</strong> 並展現出你能操控一切的實力吧!
series5_event1=一個超跑俱樂部正在歐洲各處的賽道為愛好者們舉辦競速賽事。麥拉倫汽車需要一位經驗豐富的街頭跑車車手來駕駛他們的新款McLaren MP4 12C，他們需要你發揮這輛車的潛力，並讓世人的注意力都集中在它不凡的價值上。第一場比賽將會在Vallelunga賽道舉行。
series5_event2=第二場超跑競賽會在Mugello舉辦。這條義大利賽道的主人是知名廠牌Ferrari，這條賽道也是最嚴苛的賽場之一，它有著長而快速的彎道，賽道中也充滿著上坡和下坡。駕著McLaren單槍匹馬闖入Ferrari的賽場，這會是一項令人亢奮的挑戰。
series5_event3=超跑系列賽移動到了Nurburgring GP賽道來舉辦，預計德國車廠會帶著他們眾多的知名超跑現身，也許還會帶來更多驚喜。
series5_event4=Silverstone可以說是McLaren的老家了。雖然這個賽道有一些非常快速的連續左右彎來考驗每台車輛的極限，不過有些英國來的輕量跑車仍能保持車胎的健全直到終點，最好睜開雙眼注意這些對手。
series5_event5=Monza是競速的王國，有著最快直線的方程式賽道。駕馭著McLaren的車款，你可以達到不可思議的最高速度，不過請記得，你使用的仍是街道用胎，所以請留意煞車距離。對了，我們聽說有一些少見的Ferrari車款將會現身此賽事。
series6=進階系列賽2!</br></br>現在的狀態可說是扶搖直上了。Mercedes Benz要提供你一輛指標性的跑車。AMG SLS需要一位足以發揮其極限的駕駛者。你能勝任此要務嗎?</br></br> 贏得 <strong> 2枚銅牌和1枚銀 </strong> 來完成銀箭系列賽。
series6_event1=Mercedes Benz正在為他們的客戶籌辦一場開放式的競賽。他們會提供你一輛全新的Mercedes SLS AMG。第一場賽事將在Nurburgring GP舉辦。
series6_event2=Imola賽道是Mercedes俱樂部賽事的第二個場地。SLS AMG是一輛非常適合此賽道的跑車，不過Imola依然是個危險的場地，當你飛越路緣的時候，請千萬多留點神。
series6_event3=Silverstone賽道有著典型的寒冷氣候。請確保你的車胎有做足暖胎工作，但在高速彎道的時候也請掌握好車胎過熱的情況。
series6_event4=Spa Francorchamps是個驚奇的賽道。你需要足夠的馬力、預期性的操控、靈敏度和抓地力來對付這個賽場。Mercedes SLS AMG具備了上述的每個特性，加上你的駕駛技術，足以在此賽道上耀眼奪目。不過對手們也不是省油的燈，每個車手都熱愛在Spa的競賽。
series6_event5=再也找不到比Monza擁有更長直線距離的賽道了。如果說SLS AMG需要個地方伸展筋骨，那這裡就是了。
series7=做得好! 你解鎖了進階系列賽3。</br></br>Ferrari! 世界上最有價值的車廠。他們通常都不會帶著他們的跑車和車手來參加賽道體驗日的，不過如果他們這麼做了，他們一定會挑選最傑出的... 就是你! 這是你一生中最值得好好把握的機會。</br></br> 贏得 <strong> 2枚銅牌和2枚銀牌。</strong>
series7_event1=一家知名的跑車雜誌正在關注你的表現，他們希望你能為他們測試一款國外的跑車。這是你的大好機會，也許你會因此受到國外車廠的注目。第一場測試安排在Imola，你要駕駛的是令人驚豔的Ferrari 458 Italia。
series7_event2=一場集體超跑測試賽將在Monza舉辦。Ferrari 458傑出的超控特性必定能幫助你在這場賽事創出佳績，不過場上仍有許多超跑能和這輛車並駕齊驅，甚至有更強大的馬力，當然你明白這一點，在Monza賽道，馬力就是一切。
series7_event3=Spa是一個很容易讓車胎發生過熱情況的賽道。幸好大部分的時間裡，此賽道的環境溫度夠低，足以讓車胎降溫。不過此賽道的四圈競賽對街胎來說仍是個非常嚴苛的挑戰。
series7_event4=這是Ferrari廠牌擁有的賽道，對輪胎、車輛和車手來說，是個非常嚴苛的環境。一些來自Ferrari錦標賽的團隊也在此地觀察你的表現。拿出你的實力，說不定你能獲選參加Ferrari 458 S3錦標賽。
series8=歡迎來到國際Lotus輕量級錦標賽。</br></br>和其他的愛好者一起在小型賽道體驗日競速是一件很棒的事，不過真正重要的還是和其他擁有天份的車手用相似的車款一較高下，並贏得真正的冠軍獎盃。</br></br> 收集 <strong> 20點冠軍賽積分 </strong> 以解鎖下一個系列賽。
series8_event1=國際Lotus輕量級錦標賽在Magione展開了。Magione的慢速髮夾彎和減速彎最適合讓靈巧的Lotus 2-11發揮了。不過請留意你的開放式後差動齒輪，如果你不想讓你的後胎遭遇磨紋和起泡問題的話，就不要在出彎處用力過猛。
series8_event2=Monza又是一個對Lotus 2-11來說非常棒的賽道。減速彎的地方剛好能讓這輛車的靈巧性完美發揮。同樣地，你需要將後定風翼設定得很低，以利於在長直線距離時爭取氣洞空間並趁機超車。後車身的低下壓力設定可以讓這輛車在Ascari和Parabolica賽道變得更加刁鑽。
series8_event3=這是全世界最嚴苛的賽道之一。飛越各種不同的高起路緣、在不平坦的路面煞車，以及在高低差彎道過彎。這個賽道就是想盡辦法要你在每個彎道處搞砸。你的對手們一定很期待看到你發生這種狀況... 讓他們的期待落空吧。
series8_event4=各種快速彎道和大型爬坡道，這就是Mugello賽道的形容。在這個高速的賽道裡，需要的是精準度和勇氣。這是此系列賽的最後一場競賽了，也是你最後能讓自己站上排行榜頂端的機會!
series9=Ferrari 458錦標賽解鎖了!</br></br> 像你這種水準的車手不用再去賽道體驗日了。是時候邁出步伐並參加一場正規的賽事，和其他有頭有臉的車手一較高下了。Ferrari 458錦標賽是世界上最具有魅力的統一規格競賽之一，同時也有許多專業團隊在此物色優秀車手。</br></br> 收集 <strong> 15點冠軍賽積分 </strong> 來讓專業車隊留下深刻印象吧。
series9_event1=Ferrari 458 S3錦標賽在Monza展開了。這輛車有著接近600匹制動馬力、低空氣阻力和強大的加速力，能達到令人瞠目結舌的最高速度。雖然這輛車搭載的是光頭胎，你最好還是多留意煞車距離。
series9_event2=458 S3的極低車高會讓你在Mugello賽道的快速顛簸彎道處遭遇一些麻煩。如果你不想冒更大的風險，那就最好避開路緣的部份。
series9_event3=全新的Silverstone賽道有著完美的平坦路面，這對Ferrari 458 S3來說是最完美的賽場。然而，有些彎道和減速彎還是非常快速，需要你更強的專注力來面對。
series9_event4=知名的Spa Francorchamps賽道。試著在通過Eau Rouge彎道時保持在路面上。至於其他的彎道一樣充滿難度，不過並非無法超越。
series9_event5=Imola是一個充滿技術成份的賽道。在通過Rivazza彎道的下坡煞車路段時請多加留意。或許在進入下坡段之前先採取輕微的右擺過度轉向然後再使用ABS煞車來穩定車身，會是一個較好的策略。
series9_event6=Nurburgring GP或許沒有像另一條更長的賽道Nordschleife一樣有著耀眼的光芒，但它仍是一條嚴峻的賽場。你需要在煞車狀況下有夠高穩定性的車輛，才能取得賽道中至少三個超車點的絕對優勢。