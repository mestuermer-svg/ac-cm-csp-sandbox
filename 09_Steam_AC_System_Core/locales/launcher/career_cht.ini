series12=Ferrari 458進階錦標賽!</br></br>像你這樣等級的車手沒必要再去賽道體驗日了。是時候去和其他車手來場紳士的較量了。Ferrari 458進階錦標賽會讓你有機會挑戰滿滿的賽程。</br></br>在系列賽中收集 <strong>30點積分</strong>讓專業車隊對你留下深刻印象吧。
series12_event1=Ferrari 458 S3 錦標賽開始於蒙札賽道。擁有著近600制動馬力, 低空氣阻力,還有極快的加速力，這輛車可以達到令人驚艷的最高速度。最好注意一下煞車的距離，即便你使用的是光滑的輪胎。
