series16=頂級超跑賽 等級1 已解鎖!</br></br>頂級超跑的車主一定對他的車子感到十分自豪。一部分的車主之所以收藏它們不僅僅只是因為它們的價值，更是享受駕駛看見它們在賽場上奔馳的快感。他們也常常會邀請專業車手去駕駛這些頂級跑車，見識這些車子的最大極限，不過言歸正傳，要收到邀請可不容易。想想你也是挺幸運的，是吧。</br></br> 至少<strong>收集3個銅牌與2兩枚銀牌 </strong>來完成這個賽季。.
series16_event1=Ferrari F40， 愛好者認為它是有史以來最棒的類比動力超跑，也是最具標誌性意義的超級跑車。這款特定的S3版本使用的是超過600制動馬力的平跑引擎並搭配著光滑的車輪，而且無ABS與牽引力控制系統。你能有辦法發揮出它的極限嗎？
series16_event2=根據Ferrari的開發計畫與相關研究得出，599XX是實驗車型中最快的跑車之一。配備750制動馬與動態空氣動力系統，它的駕駛難度也堪稱地獄等級。所屬Ferrari的Mugello車道是對這輛跑車來說最完美的賽場。
series16_event3=驚人的馬力、空氣動力系統及超高抓地力的光頭胎，這些條件使得Ferrari 599XX EVO成為Nordschleife賽道上最快記錄的保持者之一。駕駛這輛車奔馳在這個賽場上會令每個車手如痴如狂。Nurburgring GP賽道對於超跑愛好者來說不僅是一項挑戰，更帶著令人著迷的魔力。
series16_event4= Pagani Zonda已稱得上世界上最受歡迎的跑車之一。Zonda R version擁有全部Pagani跑車所包含的魅力，並且有過之而無不及。重量輕，馬力強大，賽道特製化。你完全無法想像銀石賽道上能夠出現如此速度。但是你有辦法駕馭這樣的跑車嗎？
series16_event5= Pagani Zonda R能以極快的速度穿梭在Imola中各處高低起伏的賽道，如果你不能全神貫注，保證會被搞得暈頭轉向。再想像一下，在這種情況下還有其他超跑作為你的對手，請盡力克服一切邁向勝利吧！
series16_event6=經過挑戰極限的Zonda R之後，沒有人認為Pagani在可合法上路的條件下創造出更加極端的跑車。但他們錯了。Pagani Huayra可以在Monza的直線跑道上輕鬆達到300公里。 其中最具特色的4個可獨立活動的空氣動力襟翼能否在狹窄的減速彎中發揮出它應有的效用呢？
series16_event7=最著名的跑車製造商傳說將以名為LaFerrari的超跑傳承下去。這項令人難以置信的技術奇蹟採用混合動力技術實現963的制動馬力，配上活動空氣動力系統和新式底盤研發，令其他超跑望塵莫及。為了證明這一點，請在Spa Francorchamps賽道上的這場巨星之戰中，拿出你最好的成績吧。
series17=歡迎來到GT進階系列賽!</br></br> 您駕駛各種跑車的出色表現，使您成為一位著名的紳士車手。GT3甚至GT2的跑車車隊正在尋找像您這樣的車手與他們的跑車同場競賽。</br></br> 收集至少<strong> 3枚銅牌與2枚銀牌</strong>讓GT車隊為您留下深刻印象。
series17_event1=您現在有機會在Nurburgring GP賽道上駕駛BMW Z4 GT3賽車。作為最強大的GT3跑車之一，這台BMW在剎車時會需要比較大的空間。在直線跑道上抓好煞車時機，並使用它強大的馬力快速通過賽道。
series17_event2=BMW Z4 GT3車隊又給您了一次駕駛機會，本次挑戰的是Vallelunga賽道。BMW強大的扭距十分適合加速通過Vallelunga 賽場上的慢速髮夾彎。如果您因為磨損的輪胎而遇到麻煩，請在駕駛時調整牽引力控制等級。
series17_event3= McLaren MP4 GT3車隊將提供您車輛參與銀石賽道上的比賽。 McLaren是一輛性能非常強大的跑車，但它的渦輪引擎和雙面刃般的操作特性也十分危險。最好選擇一種較安全的設定，雖然起始速度會比較慢，但後面在輪胎磨損時會更加穩定。
series17_event4=又一場駕駛McLaren MP4 GT3超跑的比賽，本次將挑戰的是Mugello賽道 。賽場中的長彎道會對輪胎造成很大的壓力，所以請不要低估這方面的影響。最好使用一個作用比較大的後翼版會安全一些，會好過為了速度卻犧牲掉過彎的穩定性。
series17_event5=Mercedes SLS GT3車隊對您的速度印象深刻。他們為您提供車輛參與Imola賽道的比賽。Mercedes跑車非常強大，特別是在引擎位於低至中段的轉速的時候。伊莫拉賽道的路緣會破壞汽車的穩定性，失去牽引力，所以請安排好牽引力控制的相關設定。
series17_event6=Monza對強大的Mercedes SLS來說可是最完美的賽道。如果你先前的戰績不太好，這會是反攻的最好機會，可藉此奪得重要的積分。前去贏取勝利吧!
series17_event7=Scuderia Glickenhaus一般只邀請經驗豐富的車手，但這次他們願意開個例外。 Spa Francorchamps是一條高難度的賽。P4 / 5 Competizione賽車有強大的抓地力，但在最高速度上卻差強人意。雖然取得勝利幾乎是不可能的，但也許你還是可以取得一個不錯的成績。
series18=歡迎來到 BMW GT3 系列賽!</br></br> BMW歡迎您來到他們的GT3耐力車隊。您將車廠的支援下駕駛Z4 GT3一整個賽季。</br></br> 車隊認為你需要在冠軍賽中收集到<strong> 60點積分 </strong>。
series18_event1=BMW Z4 GT3絕對是一款經典的冠軍車種。該車對設定的改動非常敏感，所以在第一場比賽中，我們將嘗試著重於安裝上的更改，這有助於我們在未來的比賽中有個安全的駕駛環境。前後翼設定為1-6 。煞車偏差設定為74％ 。前輪轉速設定200，前 ARB 設為 8。車前高度調低為7，車後高度調低為30。 差速器設為60%.。這可以讓車輛在第一次的比賽兼具速度與穩定性。
series18_event2=Vallelunga是一個相對安全的賽道，我們可以嘗試一些更加極端的設定來提高最高速度和轉彎速度。將前後翼設定為0-4。 煞車偏差設定為74％ 讓車輛在煞車時保持一定慣性。前輪轉速設定200，前 ARB 設為 6。你在通過轉角時可能依然會發生問題，故最好將牽引力控制設定在5-7級。
series18_event3=Silverstone是個非常困難的賽道，最好以安全為上。建議前後翼設定為1-6、煞車偏差設定為74％、前ARB設定為8. 天氣很冷，所以你應該拿出適中的輪胎參加比賽，但還是會有過熱的風險。如果您發現遇到問題，請移到難度設定位置，嘗試降低3點的難度。
series18_event4=我們需要解決我們車輛後期控制問題，同時在Mugello賽程中期達到良好的速度。前後翼設定為1-6。我們將嘗試使用非常硬的設定來更好地驅動輪胎。前位移距離設定40、 前 ARB 設定 10、前高度設定8 、後位移距離設定 70、後車輪轉速設定90、後高度設定20、後ARB 設定6。使用前後硬輪胎24-25。在第一圈時先慢著點開，讓輪胎熱好身，然後開始加速。
series18_event5=像平常一樣，在Imola賽道上，車輛的阻尼為了應對賽道路緣會起到很大的作用。前後翼設定為1-6、後位移距離設定 70、前 ARB 設定 6、後 ARB 設定。後壓縮阻尼設定10 、快速阻尼設定34、 後快速回彈阻尼設定25。煞車偏差設定為74％。使用前後中等輪胎24-25。牽引力控制等級設為7應該是最為完美。.
series18_event6=BMW有著神奇的引擎，我們只需要嘗試優化空氣動力與盡可能在維持正常駕駛的情況調低後定風翼。空氣動力設定為0-3、輪胎胎壓設為29-25、煞車偏差設定為79％來加強煞車時的穩定度。前 ARB 設定 5,、前車輪轉速設定190、前車輛高度設定10, 、後車輛高度設定28、後 ARB 設定0。最終齒輪比設為10-47. 牽引力控制等級設為8。
series18_event7=最後一場比賽將在 Spa Francorchamps賽道。我們希望能取得一個很好的結尾，也許我們可以在設定上冒險一下。使用中等輪胎, 前後翼設定為0-4。牽引力控制等級設為7 會有助於脫離車輪轉速低的情況。前車輪轉速設為 200有助於煞車時的穩定性，前車輛高度設定16、後車輛高度設定26有助於差速器的運作， 最後煞車偏差可設定為79％。這台車可能不好駕馭，但非常快速。上吧!
