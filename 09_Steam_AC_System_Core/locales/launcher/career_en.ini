series24=Driving for the BMW GT2 Works team!</br></br> This is a great achievement for a professional driver. The car is a bit old by now, but still competitive and the team expects great effort from your side.</br></br> A strong performance of at least <strong>60 points </strong>will be very satisfactory.
series24_event1=As you probably know, our car has had a succesful history and we have a good base setup that we know it works properly. We will let you familiarize with this base setup on the first race and then propose small changes that might suit your driving style. Set 2-4 front,rear wings. Final gear ratio at 10/50 and 6th gear at 34/31. Medium tyres at 21 pressure all around.
series24_event2=We start with the Nurburgring GP setup, but for Vallelunga we suggest 1 more click front ARB and 1 more click longer 6th gear. The car is predictable at the slow hairpins of Vallelunga but although fun, you should limit oversteer and maximize traction for better laptimes.
series24_event3=Start again with the Nurburgring GP setup. Use a slightly longer 6th gear at 25/31. If you need more bite from the tyres, I suggest a -3.8 front camber and -3 at the rear. Beware of lockups under braking so that you do not flat spot your tyres. Also the car might become more nervous over the kerbs.
series24_event4=Mugello has plenty of high speed bends which make the suspension riding on the bumpstops for a long time. We will use the Silverstone setup and work on the packers spring rate to make the car more stable over kerbs. Change front Packer rate at 130 and rear Packer rate at 100. You might get tyre overheating problems. Use less negative camber and adjust your driving style. If the problem persists, use Hard tyres but remember that the setup is not tested for such a hard compound in this circuit.
series24_event5=The Mugello setup should do fine here at Imola, with just a couple of modifications, mainly at the Dampers settings. Fast bump 60 at front, 40 at rear. Fast Rebound 140 at front, 85 at rear. Rebound rear 20. Rear Travel range at 80. The car remains a bit bouncy, so keep an eye on how you feed the power over the kerbs.
series24_event6=Minimum aero drag is needed for Monza. Start with the default setup and change wings to 0-2 front, rear. Medium tyres at 28-21 front-rear. Rear ARB at 0. As usual, be careful with your braking to avoid flat spots. If you feel like risking a bit more, you could lower the rear wing to 1 and use more front ARB to balance out.
series24_event7=Spa Francorchamps is the last race of the season. We suggest the base Nurbrugring GP setup with -3.8 front camber and -3 at the rear. Use a longer 6th gear at 25/31.
series25=Driving for the BMW GT2 Works team!</br></br> This is a great achievement for a professional driver. The car is a bit old by now, but still competitive and the team expects great effort from your side.</br></br> A strong performance of at least <strong>60 points </strong>will be very satisfactory.
series25_event1=Our race engineer is keen to improve the car steadily during the season, instead of creating specific setups for each track. An experienced driver like you should be able to overcome handling issues and give proper feedback as the car improves race after race. We will start at Nurburgring GP with Medium tyres at 21 pressure, a click shorter gearbox final ratio, default wings and a rear ARB of 2. Remember the engine has no real power over 7000rpm so change when the leds are flashing.
series25_event2=The Nurburgring setup was good but lacked a bit of traction. We will start from this and improve traction for Vallelunga. Load the Nurbrugring GP setup and lower rear ARB to 0. -3.0 front negative camber to give some bite to the front end in mid turn. Front wheel rate at 120 to help with braking grip. 1 click longer 6th gear ratio, value 25/24.
series25_event3=Silverstone should suit our car very well as it is all about flow and turn speed. Let's start with the Vallelunga setup. 5th gear ratio at 23/26. Rear wheel rate at 110. Front height at 6, rear height at 2. Rear bump damper at 30, rear fast rebound at 97. This should make the car more stable on the kerbs. If it works well we will use it also at Imola.
series25_event4=The car is working quite well. For Mugello we will start as usual from the Silverstone setup. Add a tiny bit of travel range at the front to aid the front end on the long bends. Value 40. Rear Wheel rate at 105. This should be enough. The medium tyres might overheat here. You should be able to control the overheat but in case of serious problems we might be forced to use hard tyres.
series25_event5=Our Mugello setup should be good enough for Imola by now. Medium tyres should work great here. Be careful at Tosa turn, while the tyres are cold. You might have traction problems. If traction problems persists, you could lower by 1 click or 2 the rear tyre pressure. We're getting to a point where our base setup is very good.
series25_event6=Monza is a particular track. We will try to create as low aerodynamic drag as possible, without upsetting the balance of the car. Set wings 0-2 front, rear. The car will have more downforce to the front now so we will block the front travel to limit the pitch sensitivity. Front height 15, front travel range at 30 and front packer rate at 150. Front ARB at 10. Medium tyres at 26-22. Final gear ratio 10/34, 6th gear 27/28. If you still finding problems with the car handling, set rear wing to 3.
series25_event7=For the last race of the season at Spa, we will use our latest setup development from Imola. We will only change the gear ratios to better suit the long straights of the track. Load the Imola setup and change final gear ratio to 10/34. It should be good. The team would also like to thank you for your efforts on creating a great base setup for our customer cars. Well done!
series26=Official Ferrari 458 GT2 driver!</br></br> Having the patience and commitment to follow all the Ferrari smaller trofeos paid dividends in the end. Being a professional driver for Ferrari is a dream come true.</br></br> The team looks for at least <strong> 60 points in the championship.</strong>
