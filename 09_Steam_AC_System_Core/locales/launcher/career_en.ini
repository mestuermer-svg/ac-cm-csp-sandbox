series22=Well done! You are now a driver for the Mercedes SLS GT3 team!</br></br> The Mercedes SLS GT3 is one of the most powerful and impressive cars in the series. Competing with a Mercedes does wonders for your future career.</br></br> Collect at least <strong> 60 points in the championship.</strong>
series22_event1=The Mercedes SLS GT3 is an extremely capable car, right from the factory. We will do just some tiny modifications to make it perform better inside Nurburgring GP. Start with medium tyres and lower by 2 clicks the 6th gear ratio. Aero setting 1-6 front rear. Brake bias at 70%. Front wheel rate at 100. The engine has so much torque everywhere, that you're going to have traction problems without TC so set this to level 5 or 6.
series22_event2=With so much torque at so low revs from the engine, we must concentrate on traction from the slow corners of Vallelunga. Wing setting 1-6. Medium tyres 25-24 pressure front rear. Diff. coast 35% and 70% brake bias. Front wheel rate at 100 and rear wheel rate at 100 again. 0 rear ARB. You might have some slight understeer with this setup but the traction will be so good you might not even need TC.
series22_event3=The fast flow of Silverstone track does not suit perfectly the characteristics of our car. We will try to make the car safe on the fast left right Maggots corners and compromise a little as possible on the rest of the track. Wings 1-7 front rear. Front wheel rate 110, rear ARB 0. 70% brake bias. 1 click shorter 6th gear ratio. You will need some Traction Control for the slow corners, I suggest level 6 or 7. Bring home a good result.
series22_event4=Mugello is another track with fast flow corners. But it also has a very long uphill straights. We will try to attack on that straight and defend on turns. Wings 1-5 front rear. Front ARB 6, rear wheel rate 100. Front height 2, rear height 0. Brake bias 70%. Hard tyres are a must with hot weather. Take it easy on the first laps and drive smoothly on the fast turns.
series22_event5=Imola is a track that can suit our car if you manage to drive it well over the kerbs. We will try a high downforce setup to take advantage of our power and torque and keep the car down while jumping on the kerbs. 1-8 front rear wings. Medium tyres with 21 pressure at the rear. Front wheel rate at 110 and rear ARB at 0. Rear bump at 7 and rear fast bump at 30. Brake bias at 69%. Attack the kerbs hard but try to have the steering wheel straight when landing.
series22_event6=Time to put all that power to use. Monza means acceleration and top speed. Hard tyres are needed here raise the front pressure to 29. 0-2 front rear wings. Brake bias at 71%. Front wheel rate 120, rear wheel rate 105, rear ARB 0. With a good balanced car and over 270km/h top speed, not many cars will be able to resist our performance.
series22_event7=Spa is our last chance for the championship! We will start with the Mugello setup and see if we can improve. Wings 1-5 front rear. Front ARB 6, rear wheel rate 100. Front height 2, rear height 0. Brake bias 70%. The weather is cold so let's risk the medium tyres. Take it easy on the first laps and drive smoothly on the fast turns.
series23=Congratulations! You unlocked Mercedes SLS GT3 Extreme!</br></br> A full endurance season with race weekend including practice and qualifying sessions, lies ahead. The Mercedes SLS GT3 works team will need all the help you can give them.</br></br> Collect at least <strong> 60 points in the championship.</strong>
