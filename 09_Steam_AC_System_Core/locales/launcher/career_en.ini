series1=Welcome to the Assetto Corsa Career.<br/><br/> Driving a Ferrari 458 GT2 might be a dream, but you have lots of work to do if you want to become a professional driver. Start with your nice little Abarth 500 EsseEsse. The little Abarth might not be extremely fast on a straight line, but it is very agile around narrow corners. Can you push it to its limits and take advantage of the Front Wheel Drive configuration?<br/><br/> Win at least <strong>3 Bronze medals</strong> to move on to the next series.
series10=Welcome to the Formula Abarth championship.</br></br> This single seater championship is one of the most important driver tests. A driver that delivers solid performance on this series always gets noticed by professional teams.</br></br> Collect <strong> 40 points in the championship</strong> to impress the professional teams.
series10_event1=The CSAI Formula Abarth championship starts at Magione. This very narrow circuit might seem easy to remember but it is way too much bumpy for a single seater race car. You will probably need to raise the car and use softer suspension to deal with the bumps, undulations and kerbs.
series10_event2=Vallelunga circuit has plenty of opportunities to overtake, but also to be overtaken. It also has some "secrets" on a couple of turns, that require a non conventional braking line. Learn what line to keep and you might gain up to half a second per lap.
series10_event3=Mugello is one of the most difficult tracks. The long fast bends need downforce, but the very long straight asks for top speed. You'll have to find the correct compromise. Avoid the kerbs, they seem low but can severly destablize the car at high speeds.
series10_event4=Nurburgring GP is another very technical circuit. From downhill 1st gear hairpins to flat out 5th gear uphill chicanes. Precision and bravery is what you need to go fast and overtake.
series10_event5=They call Imola the small Nurburgring. To be fast here, you need to jump through the kerbs, but that doesn't mean they are low and easy to use kerbs. You might be able to take some risks and do a single perfect lap, but can you do it for the whole race?
series10_event6=Silverstone has everything. From very slow hairpins to flat out 5th and 6th gear bends and chicanes! It takes skills, setup and courage to keep your foot down at some of those crazy fast bends.
series10_event7=A very fast circuit where low downforce and slipstream strategies are needed to succeed. Lower the car to make the diffuser work better, but keep away from kerbs to avoid scraping the underbody.
series10_event8=Last race of the CSAI Formula Abarth championship, last chance to win the season. The Eau Rouge alone is probably the most impressive, exciting and dangerous curve in the world. Then there is the rest of the circuit you have to deal with. A whole 7km of it.
series11=The Ferrari 599XX Trofeo.</br></br> The 599XX trofeo is a dedicated series, open only to the owners of the exclusive XX program of Ferrari. Some professional drivers are also invited and watched carefully. The best of them might be offered a seat to one of the works GT Ferrari teams. </br></br> Collect <strong> 36 points in the championship</strong> to get hold of a Ferrari GT drive.
series11_event1=Driving such a powerful car in the narrow bends of Magione is not an easy task. Soft tyre compounds and lower tyre pressures will definitely help you. You might need to enable traction control too, in order to tame the excess power and find some traction.
series11_event2=The Ferrari 599XX EVO arrives at the first extremely fast downhill chicane of Vallelunga at over 250km/h... That's fast! You might be able and brave, or fool enough, to make a setup and go into the first bend flat out, but then you'll probably miss a lot of traction on the slower long turns. Better compromise and make a good stable all around setup.
series11_event3=Long fast bends. That's what Mugello is all about. The 599XX EVO is a very capable car, but you need to understand and trust its active aerodynamics. Enter a turn smoothly and when you feel the front end washing out a bit, turn some more and let the electronics know that you need more front grip. The results might surprise you.
series11_event4=Nurburgring GP has turns from all the circuits you've been until now, combined in one track. Slow hairpins where you're going to struggle for traction and extremely fast bends where front grip and stability are important. Good luck finding a compromise on the setup.
series11_event5=Imola is not an easy track for powerful cars. To make a good laptime here you need to jump on the kerbs but when you have over 750bhp on the rear wheels, it can be an issue... Maybe it's time to turn around the manettino and select one of the various traction control levels.
series11_event6=You should have learned how the 599XX electronics and active aero work by now. If you like how they work and you can exploit them, Silverstone can be a very good track for this car. The weather is cold but the track overheats tyres, so think twice on what compound to use.
series11_event7=Unleash 750bhp at the long straights of Monza and prepare to see top speeds well over 300km/h! Be aware though, long braking distances are needed to stop from such speeds and Monza's chicanes are very narrow and tricky. Keep an eye on the very hot weather too, use hard tyres.
series11_event8=Cold weather, low grip, some of the most amazing corners on any circuit on the world. This is Spa Francorchamps. Soft tyres should give good grip, but will they last for the whole race? It's the final race of the season, better make it a good one.
series12=Ferrari 458 Trofeo Advanced!</br></br> A driver of your level can't do trackdays for life. Time to go and do a proper race between other gentleman drivers. The Ferrari 458 Trofeo Advanced gives you the opportunity to do full race weekends and long races.</br></br> Collect <strong> 30 points in the championship</strong> to impress the professional teams.
series12_event1=The Ferrari 458 S3 trofeo starts at Monza. With almost 600bhp, low aerodynamic drag and fast acceleration, this car can achieve some impressive top speeds. Better watch out your braking distances, even with the slick tyres.
series12_event2=The very low height of the 458 S3 can get you into trouble in the fast and bumpy bends of mugello. Better avoid the kerbs if you don't want to take big risks.
series12_event3=The new Silverstone circuit has a perfectly smooth surface and it's a perfect match for the Ferrari 458 S3. Still, some bends and chicanes are very fast, so it needs total concentration.
series12_event4=The famous Spa Francorchamps. Just try to stay on the track through the Eau Rouge bend. The rest of the curves are typically difficult but not impossible.
series12_event5=Imola is a very technical track. Pay particular attention to the downhill braking zone of Rivazza turn. Maybe it's better to lift off before going downhill on the slight right hander and then step on the brakes using the ABS to stabilize the car.
series12_event6=The Nurburgring GP might not have the aura of the longer Nordschleife, but it's still a very demanding track. With at least 3 overtaking points, you need a stable car under braking to make the most out of it.
series13=Welcome to the Formula Abarth championship.</br></br> This is the full blown championship with race weekend events. Your opponents are even faster and track conditions vary through the weekend.</br></br> Collect <strong> 60 points in the championship</strong> to impress the professional teams.
