series16=Hypercars level 1 unlocked!</br></br> Hypercar owners are obviously very proud of their cars.  Some of them, not only collect those cars for their value, but also enjoy them on the track as well. They often ask professional drivers to drive their cars and find their actual limits, but only on invitation. Consider yourself lucky.</br></br> Collect <strong> 3 bronze and 2 silver medals</strong> to complete this season.
series16_event1=The Ferrari F40, a true supercar icon that by some is still considered to be the last and best analog supercar ever build. This particular S3 version has a factory-tuned engine to over 600bhp and slick tyres. No ABS, no traction control. Can you find the car's limits, or will you reach your own?
series16_event2=Straight from Ferrari's client research and development program, the 599XX is a true racing laboratory and a very fast one. Featuring 750bhp and active aero, it sure makes a hell of a challenge to race. The Mugello circuit, owned by Ferrari, is the perfect match for this car.
series16_event3=The amazing power, active aero and sticky slick tyres made the Ferrari 599XX EVO one of the fastest cars ever to hotlap the Nordschleife. Nobody is crazy enough to race this car on the long ring though. The Nurburgring GP is more than challenging for a race and a great attraction to other hypercar enthusiasts.
series16_event4=The Pagani Zonda is already one of the most desirable cars in the world. The Zonda R version takes everything we love about Pagani's cars and exaggerates it. Lightweight, extremely powerful, track focused. You'll never thought Silverstone could be lapped so fast. But can you race other similar cars?
series16_event5=The Pagani Zonda R is so fast around the uphills and downhills of Imola that if you're not focused you might get dizzy. Imagine having also other hypercars around you, pushing for the win!
series16_event6=After the extreme Zonda R, nobody thought Pagani could create something even more extreme and road legal. They were wrong. The Pagani Huayra can easily reach over 300km/h at Monza straights. Can the 4 independently active aerodynamic flaps stop it in time for the tight chicanes?
series16_event7=The legend of the most famous sportscar manufacturer continues with the hypercar named LaFerrari. This unbelievable technological marvel employs hybrid technology to achieve 963bhp, active aerodynamics and chassis developments that could make all the other hypercars feel slow by comparisson. Prove it so, in this titans battle through the turns of the Spa Francorchamps.
series17=Welcome to the GT Advanced Series!</br></br> Your excellent performance with all kinds of cars, made you famous as a gentleman driver. Various teams with GT3 and even GT2 cars are searching for drivers like yourself to compete with their cars.</br></br> Collect at least <strong> 3 Bronze and 2 Silver medals </strong> to impress the GT teams.
series17_event1=You have the opportunity to drive the BMW Z4 GT3 car at Nurburgring GP. One of the most powerful GT3 cars, the BMW can be a bit nervous under braking. Brake on a straight line and use the power for fast exits.
series17_event2=The BMW Z4 GT3 team offers you a seat again, this time at Vallelunga circuit. The generous torque of the bimmer is perfect for accelerating away from the slow hairpins of Vallelunga. If you have troubles with worn tyres, adjust your traction control level while driving.
series17_event3=A McLaren MP4 GT3 team is offering you their car for the Silverstone race. The McLaren is an extremely capable car, but the turbo engine and the razor sharp handling characteristics can be dangerous. Better use a safe setup that might be a bit slow at first but more stable when tyres get worn.
series17_event4=Another race with the super fast McLaren MP4 GT3, this time at Mugello. The long fast bends of the track put a lot of stress on the tyres, so don't underestimate this aspect. Better add a click more rear wing and be safe, rather than using a lower wing and be fast but sorry after a spin.
series17_event5=The Mercedes SLS GT3 Team has been impressed by your speed. They offer you their car for the Imola race. The Mercedes is very powerful, especially at low to mid range engine speeds. Imola kerbs can destabilize the car and lose traction, so better work with the traction control settings.
series17_event6=Monza is the perfect circuit for the very powerful Mercedes SLS. Even if you had problems with the previous races, this is the perfect opportunity to get revenge and score some important points. Go for the win!
series17_event7=The Scuderia Glickenhaus uses only experienced drivers, but they are willing to do an exception. Spa Francorchamps is a very technical circuit. The P4/5 Competizione race car has tons of grip, but lacks in top speed. Winning is probably impossible, but can you manage to do a good finish?
series18=Welcome to the BMW GT3 Series!</br></br> BMW welcomes you to their GT3 endurance team. You are going to be driving a Z4 GT3 for the whole season with factory support.</br></br> The team thinks you should collect <strong> 60 points in the championship </strong>.
series18_event1=The BMW Z4 GT3 is definitely a class winning car. The car is very sensitive to setup changes so for this first race we will try to focus on setup changes that will give us a safe handling for future races. 1-6 front rear wings. Brake bias at 74% front. Front wheel rate at 200, front ARB at 8. Lower front height at 7 and rear at 30. Diff Coast at 60%. This should make the car fast enough and stable for this first race.
series18_event2=Vallelunga is a relatively safe track, we can try some more extreme settings to gain top speed and corner speed. Set wings 0-4 front, rear. Brake bias at 74% as the car is always a bit nervous under braking. Front wheel rate at 200 and front ARB at 6. You might still have problems at corner exit so play with the TC at 5-7 level.
series18_event3=Silverstone is a very difficult circuit, better play it safe. I suggest a 1-6 front rear wings, front ARB at 8 and front brake bias at 74. The weather is cold so you should be able to pull out the race with medium tyres, but there is always a risk of overheating. If you see you're having problems, change to hards and lower the pressure by 3 clicks.
series18_event4=We need to cure the nervous rear end of our car while achieving good mid turn speed for Mugello. Let's start with 1-6 front rear wings. We will try to use a very stiff setup to load the tyres better. Front travel range 40. Front ARB at 10, front height at 8. Rear travel range 70. Rear wheel rate at 90, rear height at 20. rear ARB 6. Use Hard tyres 24-25 front,rear. Take it easy on the first lap, let the tyres warm up properly, then start to push.
series18_event5=As usual at Imola we got plenty of damping work to do for the kerbs. Set 1-6 front rear wings. Rear travel range at 70. Front ARB at 6, rear at 0. Rear bump damper at 10, fast bump at 34. Rear fast rebound at 25. 74% front brake bias. Medium tyres at 23-22 front rear. TC level of 7 should be perfect.
series18_event6=The BMW has a fantastic engine, we should only try to optimize the aero with as low rear wing as we can run. Set the aero at 0-3 front rear. Hard tyres are a must, 29-25 front rear pressures. 79% front brake bias to stabilize the car as much as possible under braking. Front ARB at 5, front wheel rate 190. Front height 10, rear height 28, rear ARB 0. Longer final ratio at 10-47. Traction Control level at 8.
series18_event7=Final race at Spa Francorchamps. We better get a good result, so maybe we should risk a bit with the setup. Keep the medium tyres, and set 0-4 front rear wings. TC value of 7 will help you deal with the slow exit turns wheel spin. Front wheel rate at 200 to get good turn in and stability under braking. Front height at 6 and rear at 26 to keep the diffuser working. Finally braking bias 74% front. The car won't be very easy but should be fast. Go for it!
series19=Welcome to the BMW GT3 Extreme Series!</br></br> BMW welcomes you to their GT3 endurance team. You are going to be driving a Z4 GT3 for the whole season with factory support. Furthermore you'll be responsible for the practice and qualifying sessions during the race weekend.</br></br> The team thinks you should collect <strong> 60 points in the championship.</strong>
