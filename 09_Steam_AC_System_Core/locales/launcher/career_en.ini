series27_event1=Our race engineer is keen to improve the car steadily during the season, instead of creating specific setups for each track. An experienced driver like you should be able to overcome handling issues and give proper feedback as the car improves race after race. We will start at Nurburgring GP with Medium tyres at 21 pressure, a click shorter gearbox final ratio, default wings and a rear ARB of 2. Remember the engine has no real power over 7000rpm so change when the leds are flashing.
series27_event2=The Nurburgring setup was good but lacked a bit of traction. We will start from this and improve traction for Vallelunga. Load the NurbrugringGP setup and lower rear ARB to 0. -3.0 front negative camber to give some bite to the front end in mid turn. Front wheel rate at 120 to help with braking grip. 1 click longer 6th gear ratio, value 25/24.
series27_event3=Silverstone should suit our car very well as it is all about flow and turn speed. Let's start with the Vallelunga setup. 5th gear ratio at 23/26. Rear wheel rate at 110. Front height at 6, rear height at 2. Rear bump damper at 30, rear fast rebound at 97. This should make the car more stable on the kerbs. If it works well we will use it also at Mugello.
series27_event4=The car is working quite well. For Mugello we will start as usual from the Silverstone setup. Add a tiny bit of travel range at the front to aid the front end on the long bends. Value 40. Rear Wheel rate at 105. This should be enough. The medium tyres might overheat here. You should be able to control the overheat but in case of serious problems we might be forced to use hard tyres.
series27_event5=Our Mugello setup should be good enough for Imola by now. Medium tyres should work great here. Be careful at Tosa turn, while the tyres are cold. You might have traction problems. If traction problems persists, you could lower by 1 click or 2 the rear tyre pressure. We're getting to a point where our base setup is very good.
series27_event6=Monza is a particular track. We will try to create as low aerodynamic drag as possible, without upsetting the balance of the car. Set wings 0-2 front, rear. The car will have more downforce to the front now so we will block the front travel to limit the pitch sensitivity. Front height 15, front travel range at 30 and front packer rate at 150. Front ARB at 10. Medium tyres at 26-22. Final gear ratio 10/34, 6th gear 27/28. If you're still finding problems with the car handling, set rear wing to 3.
series27_event7=For the last race of the season at Spa, we will use our latest setup development from Imola. We will only change the gear ratios to better suit the long straights of the track. Load the Imola setup and change final gear ratio to 10/34. It should be good. The team would also like to thank you for your efforts on creating a great base setup for our customer cars. Well done!
series28=The pinnacle of motorsport!</br></br> The amazing formula cars of the past still shine and roar today. Thanks to the passion of their owners, those cars are still racing nowadays, driven only by professionals that are capable to respect their value and find their limits.</br></br> Collect <strong> 3 bronze, 2 silver and 1 gold medal</strong>.
series28_event1=Classic Team Lotus has asked you to try their finely preserved Lotus type 49. This car is one of the most technical achievements in F1 history. The power is amazing and the car is so light. Surprisingly you can drift the car around bends but be careful of the braking distances. High top speeds and no ABS means that you better start braking much earlier than what you're used to.
series28_event2=Driving the Classic Team Lotus type 49 is sure an eye opening experience. But can you imagine racing this car back in 1967 at Monza. The circuit although similar, had no slowdown chicanes back then. Close you eyes and travel back in time in an era where racing was dangerous and... well you know what, was safe.
series28_event3=The Ferrari 312T won the both the drivers and constructors championships for Ferrari with Niki Lauda and Clay Regazzoni back in 1975. Today you can race the car at Imola and get a taste of those epic battles behind the wheel of a legendary machine.
series28_event4=The Lotus Exos client program is visiting Silverstone for a test session. They ask from professional drivers to shake down the cars before letting the owner clients try them. Push the Lotus Exos to its limits and make sure the potential clients are impressed.
series28_event5=Your last performance with the Exos 125 at Silverstone, convinced the Lotus team to invite you as a guest on a race with tuned Lotus Exos 125 S1. The race will take place at Mugello circuit and you will have a whole racing weekend in order to setup the car properly and do your best for the race. Good luck!
series28_event6=Classic Team Lotus is impressed by your latest performance. They think you're up to the task to drive a car that has inestimable value. The Lotus 98T driven by Ayrton Senna in 1985. The famous turbo era that produced the most powerful F1 cars, capable of over 1000bhp at qualifying trim. Only the best can master such a difficult car to the limit. Maybe you're one of a kind.
series2_event1=You have just entered the BMW world, having the chance to race against some of the most iconic cars of the brand. Let's do some training at the home of German cars, the Nurburgring. To join the BMW Challenge, you must get at least 1200 points in the following time attack: are you ready?
series2_event2=BMW club is organizing fun races for its members. Since you've been showing some great skills, you have been invited as a guest, and you've been given a BMW Z4 35is. It's not the absolute fastest BMW on the grid, but can defend itself on the long straights of Monza.
series2_event3=Second BMW club race. The small but leggendary M3 E30 is yours. The car has great agility but lacks power. Nurburgring GP spares you some long straights, so you might have a chance against the modern cars.
series2_event4=You tried the father of all M3s, now it's time to drive the latest one. The chassis is fantastic and the thunderous V8 has tremendous power. Try your best, but realistically we expect at least a podium finish.
series2_event5=Although the M3 has the name, many believe the lighter, shorter, more agile 1M series Coupé is the real successor to the original M3. It has less power, but more torque and the turbo engine can make it trickier on the limit. Do you have what is needed to score another podium?
series2_event6=What an amazing performance! BMW Motorsport department has been watching you. They are offering you a test drive on a real racing car! The glorious BMW Z4 GT3 is yours for a time attack. Make good use of it.
series3=Congratulations! You're now competing in Novice Series 3. </br>A small but very famous manufacturer from Austria was watching you while you've been driving the BMWs. KTM, famous for its motorcycles, has also created one of the most advanced and extreme trackday weapons available today. The KTM X-Bow R is all yours for a series of events.</br></br>Win <strong> 2 bronze and 1 silver medal </strong> to impress the KTM engineers.
series3_event1=Welcome to the world of ultra-light cars. The KTM X-BOW-R is considered one of the most adrenalinic cars of the genre. Now you have the chance to meet and appreciate its handling and performance on one some of the most challenging circuits: the Autodromo "Enzo e Dino Ferrari", at Imola.
series3_event2=KTM is organizing a race for its members. You have been invited as a guest, and you've been given a KTM X-BOW R. Reach at least the third place to get the car and join the X-BOW R Challenge!
series3_event3=You have recently showed your skillset at Vallelunga Club circuit, now it's time to challenge the GP track. The X-BOW R is the perfect car for the Roman circuit. The Campagnano bend offers good chances for overtaking, keep this in mind!
series3_event4=Last call to win your own X-BOW R. The Nurburgring short track doesn't have secrets for you. Don't waste your chances, bring it home!
series3_event5=You now own an X-BOW R and you're free to challenge its natural competitors. Unless you are scared, you know...
series4=Welcome to Novice Series 4.</br></br>Your amazing performance with the KTM has raised some eyebrows. While the X-BOW is a great novelty, there is no other brand with a bigger tradition on lightweight cars. <strong>Lotus</strong> needs your services and you need to improve your mid engined driving techniques.</br></br>Win <strong> 3 bronze and 1 silver medals </strong> for this series.
series4_event1=Lotus. Few other brands can challenge the legendary history of Lotus. You have been given the opportunity to try their entry level lightweight sportscar, and if you do good, you might be able to be a guest driver to many Lotus events.
series4_event2=You did great! You can graduate to the very similarly handling Exige 240R. Watch out though, though it handles similar it goes quite a bit faster! Your opponents are experienced Lotus enthusiasts and the occasional professional driver. It won't be easy.
series4_event3=There's a club race happening, at the Silverstone International layout. Most of the enthusiasts think the Evora is just a gran turismo car, but a slightly tuned Lotus Evora S2 should be a great weapon for you to fight against and teach them a couple of new tricks.
series4_event4=Lotus engineers want to check the Lotus Exige S limits. The name might seem familiar, but it's a brand new chassis with a powerful V6 bolted on. It's up to you to compete in this time attack session and find out what this car is capable of doing when pushed hard.
series4_event5=After the great time attack session, you've been granted guest driver pass for a Lotus Exige V6 Cup race. The drivers are experienced, so watch out for dirty tricks and high level of performance.
series4_event6=The Lotus 2-11 trofeo makes its annual visit to Magione circuit. You've been asked to join, but stay focused. The 2-11 has an open differential and this can make the rear inner wheel spin like crazy in the narrow turns of the Italian circuit. This will slow you down and consume your tyres if you're not careful. You will need the correct driving technique.
series4_event7=Lotus engineers believe you're the right man to help them with the evolution of their GTC car. You are asked to perform a time attack on a brand new Lotus Evora GTC race car at the very difficult track of Imola. The day is very hot, so beware of overheating. Change the setup accordingly to fit your needs and push the limits!
series5=Congratulations you are now competing in Intermediate Series 1!</br></br>When you are driving so well for a great brand like Lotus, it's logical that other British manufacturers will keep an eye on you... Still, when the phone rings and McLaren is on the other side of the line, it's not easy to stay calm and composed. </br></br>Win <strong> 2 bronze and 1 silver medals </strong> and show that you can handle all that power!
series5_event1=A supersports racing club is organizing enthusiast races around European tracks. McLaren automotive needs an experienced driver of street cars to drive their new McLaren MP4 12C to the limit and raise awareness on the qualities of this new supercar. First race at Vallelunga circuit.
series5_event2=Second supersports race, at Mugello. The Italian track, owned by Ferrari, is one of the most demanding tracks with long and very fast turns going both up and downhill. A McLaren inside Ferrari's circuit alone is quite an emotional challenge.
series5_event3=The supersports series is moving to Nurburgring GP circuit. Expect German manufacturers to show up in big numbers with their usual sportscars, plus a couple of surprises.
series5_event4=Silverstone should be the home of McLaren. Nevertheless the track has some very fast left-right sequences that could bring the car to its limits. Some other lightweight British sportscars might be able to keep their tyres fresh and come back towards the end of the race, so you better keep an eye for them.
series5_event5=Monza is the speed kingdom. The Formula One track with the fastests straights. In a car like the McLaren, you can achieve some amazing top speeds, but remember you're still on street legal tyres, so you better watch out your braking distances. Also, we heard that some rare Ferrari cars might show up.
series6=Intermediate Series 2!</br></br>From now on it gets better and better. Mercedes Benz is offering you one of the most iconic cars of all time. The AMG SLS needs to be driven by someone capable to reach its limits. Are you up to the task?</br></br>Win <strong> 2 bronze and 1 silver medals </strong> to complete the silver arrow series.
series6_event1=Mercedes Benz is organizing some open club races for their clients. They offer you a brand new Mercedes SLS AMG. First event at Nurburgring GP.
series6_event2=Imola circuit is the place of the second Mercedes club event. The SLS AMG is a very capable car, but Imola is as dangerous as always, so pay extra attention as you jump from one kerb to the other.
series6_event3=Silverstone circuit has typically cold weather. Make sure you keep your tyres warmed up, but also control overheating at the very fast bends.
series6_event4=Spa Francorchamps is an amazing circuit. It needs power, predictive handling, agility and grip. The Mercedes SLS AMG has it all and with your skills it should shine in this circuit. But the opponents are very strong, everybody loves to race at Spa.
series6_event5=There's no other circuit with longer straight lines than Monza. If there's one place where the SLS AMG can stretch its legs, this is it.
series7=Well done! Intermediate Series 3 Unlocked.</br></br>Ferrari! The most valuable car brand in the world. They usually don't participate on trackdays with their cars and drivers, but when they do, they pick only the best... and they picked you! That is once-in-a-lifetime occasion to do well.</br></br>Win <strong> 2 bronze and 2 silver medals.</strong>
series7_event1=A famous car magazine has been watching your progress and wants you to test some exotic cars for them. It is a great opportunity for you, as you might get noticed by exotic car manufacturers. A first test has been organized at Imola with the amazing Ferrari 458 Italia.
series7_event2=A collective supercar test has been organized at Monza. The excellent handling characteristic of the Ferrari 458 will certainly help you on this race, but there are other supercars that have the same or even more power and as you know, at Monza, power matters.
series7_event3=Spa is a track that can easily overheat tyres. Fortunately, most of the time the ambient temperature is low enough to cool the tyres down. Still, 4 laps on street tyres on this long track are always demanding.
series7_event4=The track is owned by Ferrari and it is very demanding on tyres, car and driver. Some teams from the Ferrari trofeo are here and will be watching you. Do well here and you might grant yourself a season in the Ferrari 458 S3 Trofeo.
series8=Welcome to the National Lotus Lightweight Trofeo.</br></br>Racing against other enthusiast in small trackdays is nice, but the real deal is doing a complete championship against other talented drivers with similar cars.</br></br> Collect <strong> 20 points in the championship</strong> to unlock the next series.
series8_event1=The national Lotus Lightweight Trofeo starts at Magione. The very slow hairpins and chicanes of Magione are ideal for the nimble Lotus 2-11. But be aware of the open rear differential. Don't push too much on the exits if you don't want to have problems with graining and blistering at the rear tyres.
series8_event2=Monza is another great track for the Lotus 2-11. The chicanes are perfect for the agility of the car. Still, you're going to need a very low setting for the rear wing in order to be able to slipstream and overtake other car in the long straightlines. Low rear downforce can make the car very tricky at Ascari and Parabolica.
series8_event3=One of the most demanding tracks in the whole world. Jump through the various high kerbs, brake in uneven surfaces, turn on off-camber bends. This track is trying to make you crash on every single turn. Your opponents would like to see you crash too... show them otherwise.
series8_event4=Fast bends and big hills, that's what Mugello is all about. A very fast track that requires precision and courage. It's the last race of the series and your last chance to stay on top of the ranking!
series9=Ferrari 458 Trofeo unlocked!</br></br> A driver of your level can't do trackdays for life. Time to go and do a proper race between other gentleman drivers. The Ferrari 458 Trofeo is one of the most glamorous singlemake event in the world and many professional teams are looking for good drivers.</br></br> Collect <strong> 15 points in the championship</strong> to impress the professional teams.
series9_event1=The Ferrari 458 S3 trofeo starts at Monza. With almost 600bhp, low aerodynamic drag and fast acceleration, this car can achieve some impressive top speeds. Better watch out your braking distances, even with the slick tyres.
series9_event2=The very low height of the 458 S3 can get you into trouble in the fast and bumpy bends of Mugello. Better avoid the kerbs if you don't want to take big risks.
series9_event3=The new Silverstone circuit has a perfectly smooth surface and it's a perfect match for the Ferrari 458 S3. Still, some bends and chicanes are very fast, so it needs total concentration.
series9_event4=The famous Spa Francorchamps. Just try to stay on the track through the Eau Rouge bend. The rest of the curves are typically difficult but not impossible.
series9_event5=Imola is a very technical track. Pay particular attention to the downhill braking zone of Rivazza turn. Maybe it's better to lift off before going downhill on the slight right hander and then step on the brakes using the ABS to stabilize the car.
series9_event6=The Nurburgring GP might not have the aura of the longer Nordschleife, but it's still a very demanding track. With at least 3 overtaking points, you need a stable car under braking to make the most out of it.
