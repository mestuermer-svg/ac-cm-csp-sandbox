series1_event1=The little Abarth 500 EsseEsse is an entry level car. Good fun and safe handling. Train at Vallelunga club circuit in this time attack and get ready for your first race.
series1_event2=The local Abarth club is organizing a small single maker race. Show your skills in this fast paced 3 laps race.
series1_event3=You're winning the trust of other car enthusiasts. A friend offers his Alfa Romeo Giulietta QV for a time attack at Magione circuit, show him you deserve it!
series1_event4=You've done great, so you have the opportunity to push the beautiful Alfa Romeo Giulietta QV to a local race at Magione. Watch out for the locals, they seem to have some prepared little Abarths with better tyres, suspension and engine upgrades. Show them what you can do in a 5 lap race.
series1_event5=One of the characteristics of Magione circuit is that it is often dusty. You have the opportunity to try a tuned BMW M3 E30 on a dusty surface with a much lower grip. Watch your braking points and power oversteer.
series2=Well done unlocking Novice Series 2! </br></br>You've done well on the first series so now it's time to graduate and drive some proper Rear Wheel Drive cars. BMW produces some of the finest sportscars that are not only fast and exciting, but also help you improve your driving technique by being easy to drive on the limit. </br></br> Win <strong> 2 bronze and 1 silver medal </strong> to successfuly complete this series.
series20=Welcome to the McLaren GT3 team!</br></br> The McLaren GT3 endurance program promotes the best new drivers with a full endurance championship season.</br></br> The team expects at least <strong> 60 points in the championship.</strong>
series20_event1=The endurance championship starts at Nurbugring GP. Your race engineer suggests that you setup your McLaren MP4 12C GT3 safely for the first race. Use medium tyres and lower their pressure by 2 clicks all around. Use a rear wing setting of 6 and a slightly shorter final gear ratio. Try to bring the car home safely, the championship is long and we can attack as you learn the car's habits.
series20_event2=Vallelunga is more of a stop-and-go track. Let's try to be more aggressive with the setup. Wings at 1 front and 5 rear. 2 clicks lower front tyre pressure and 1 lower at rear. 1 click more ARB rear and maybe you would like 1 click more rear brake bias. Try one thing at a time and see. If you have problems exiting slow corners use TC 6 or 7.
series20_event3=Silverstone has some very tricky corners and burns tyres. Keep default pressure on mediums. Since top speed is not so important here as high speed grip, I suggest you keep the default aero settings. Maybe 2 clicks more front ARB to stabilize the car. If you still have problems under turn in braking, move brake bias to the front for 2 clicks. Again use one click shorter final gear ratio.
series20_event4=Mugello is a hard circuit on the tyres, driver and setup. If the temperature is too high, you might need to use the hard tyres here. Use 0-4 front rear wing settings to optimize top speed on the long straight. 2 clicks lower wheel rates at front and 4 clicks at the rear to lower the car and make the diffuser work better. Use 20% diff power to make the car faster and easier on the long turns. Brake bias at 73 will stabilize your car under braking. 1 click shorter 6th gear.
series20_event5=Imola is a very tricky circuit. Lots of work needed on the dampers to be able to jump at the kerbs with decent stability. Lower the medium tyre pressures by 2 clicks. Front rebound damper at 12, front bump at 15. Rear bump at 5. Fast rear bump at 30. Rear travel range at 70. 0 rear ARB. Diff. power at 40%. 1 click shorter final gear ratio.
series20_event6=Monza is all about top speed and agility on the slow chicanes. Let's start with 0-1 front rear wings. Suspension height at 24-21 front-rear. Use hard tyres at 29-27 front rear pressures. Watch out for overheating. Front ARB at 7. Rear ARB at 0. Raise front brake bias to 71 for better turn in stability. Watch out at race start, incidents are very easy on the first chicane.
series20_event7=Spa is a complete track with slow and fast turns, much like Silverstone but with an added bonus of some amazing hills and need for top speed on the straights. Start with the 0-4 front rear wings. Front ARB to 7, to gain back some stability. You might need to use hard tyres, if so lower the pressure by 3 clicks. 1 click shorter 6th gear ratio. 72% front brake bias.
series21=Welcome to the McLaren GT3 factory team!</br></br> The McLaren GT3 Extreme program requires total dedication for a whole endurance season. Race weekends will find you fighting not only in the races but also during practice and qualifying sessions.</br></br> The team expects at least <strong> 60 points in the championship.</strong>
