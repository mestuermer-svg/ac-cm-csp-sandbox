series28=Il livello massimo del mondo motoristico!</br></br> Le incredibili vetture da formula del passato splendono e ruggiscono ancora oggi. Grazie alla passione dei loro proprietari, queste vetture gareggiano ancora nei nostri circuiti, guidate esclusivamente da professionisti che le rispettano e sono capaci di trovarne i limiti.</br></br> Conquista <strong> 3 medaglie di bronzo, 2 di argento e una d'oro</strong>.
series28_event1=Il team Classic della Lotus chiede se puoi provare la loro Lotus Type 49 originale. Questa vettura è una delle più grandi meraviglie tecnologiche nella storia della F1. La potenza è incredibile mentre la monoposto è davvero leggera. Ti sorprenderà la facilità con la quale potrai controllare il sovrasterzo lungo le curve, ma fai attenzione agli spazi di frenata. L'altissima velocità e la mancanza di ABS ti costringeranno a frenare molto prima di quanto tu sia abituato.
series28_event2=Guidare la Lotus Type 49 del team Classic è sicuramente un'esperienza entusiasmante. Riesci ad immaginare questa vettura a Monza nel lontano 1967? Il circuito era simile, ma non aveva nessuna chicane a quel tempo. Ora chiudi gli occhi e viaggia indietro nel tempo, a quando gareggiare era pericoloso e... sai cosa, era sicuro.
series28_event3=La Ferrari 312T ha vinto sia il campionato piloti che quello costruttori nel lontano 1975, quando a pilotarla erano Niki Lauda e Clay Regazzoni. Oggi puoi guidarla a Imola e provare il gusto di quelle epiche battaglie al volante di questa vettura leggendaria.
series28_event4=Il programma clienti Exos della Lotus fa visita al circuito di Silverstone per una sessione di test. Hanno richiesto alcuni piloti professionisti per preparare le vetture prima che queste vengano consegnate ai rispettivi proprietari. Spingi al limite la Lotus Exos e assicurati di fare buona impressione ad altri potenziali clienti.
series28_event5=La tua ultima prova con la Exos 125 a Silverstone ha convinto il team Lotus ad invitarti come ospite ad una gara con le più performanti Lotus Exos 125 S1. Questo evento si terrà sul circuito del Mugello e avrai un intero weekend per preparare la vettura al meglio per la gara. Buona fortuna!
series28_event6=Il team Classic della Lotus è davvero colpito dalle tue ultime performance. Pensa che tu abbia la stoffa per guidare una vettura di valore inestimabile. La Lotus 98T guidata da Ayrton Senna nel 1985. La famosa era del turbo ha prodotto i più potenti modelli di F1, capaci di superare i 1000 cavalli di potenza nella configurazione da qualifica. Solamente i migliori possono gestire una vettura così impegnativa se portata al limite. Forse tu sei uno di questi.
series3=Congratulazioni! Ora partecipi alla Novice Series 3. </br>Un piccolo ma molto famoso costruttore Austriaco ti ha notato mentre guidavi le BMW.  La KTM, famosa per le sue motociclette, ha anche creato una delle più avanzate e estreme macchine da Track Day esistenti al momento. La KTM X-Bow R è tutta tua per una serie di eventi.<br/><br/> Vinci almeno <strong>2 medaglie di bronzo e una di argento</strong> per fare bella figura con gli ingegneri della KTM.
series3_event1=Benvenuto nel mondo delle vetture ultra-leggere. La KTM X-BOW-R è considerata come una delle macchine più adrenaliniche tra quelle di questo genere. Ora hai la possibilità di provare ed apprezzare la sua guidabilità e le sue prestazioni su uno dei circuti più impegnativi: l'Autodromo "Enzo e Dino Ferrari" di Imola.
series3_event2=La KTM sta organizzando una gara per i suoi clienti. Sei stato invitato come ospite e ti è stata fornita una KTM X-BOW R. Finisci almeno al terzo posto per tenere l'auto ed entrare nel X-BOW R Challenge!
series3_event3=Hai recentemente mostrato le tua abilità sul tracciato Club di Vallelunga e ora è tempo di sfidare quello GP. La X-BOW R è la vettura perfetta per il circuito romano. La curva Campagnano ti offre buone possibilità di sorpasso, ricordalo!
series3_event4=Ultimo tentativo per vincere la tua X-BOW R personale. Conosci tutti i segreti del tracciato Short del Nurburgring. Non sprecare questa chance, portala a casa!
series3_event5=Ora possiedi una X-BOW R e sei libero di gareggiare contro i suoi avversari naturali. A meno che tu non abbia paura...
series4=Benvenuto alla Novice Series 4.</br></br>Le tue strabilianti performance con la KTM hanno fatto alzare qualche sopracciglio. Mentre la  X-BOW è una grande novità, non ci sono altri marchi con più grande tradizione riguardo le vetture leggere. La <strong>Lotus</strong> richiede i tuoi servizi mentre tu hai bisogno di migliorare la tecnica di guida di vetture con motore centrale.<br/><br/> Vinci almeno <strong>3 medaglie di bronzo e una di argento</strong> per completare questa serie.
series4_event1=Lotus. Pochi altri marchi possono sfidare la leggendaria storia della Lotus. Ti è stata data la possibilità di provare la loro sportcar leggera entry level e ,se farai bene, allora potrai essere invitato in molti eventi targati Lotus.
series4_event2=Sei andato bene! Ora puoi passare ad una vettura con simile guidabilità come la Exige 240R. Attento però, perché anche se il controllo è simile, questa è ben più veloce! I tuoi avversari sono alcuni esperti fan della Lotus e piloti professionisti occasionali. Non sarà facile.
series4_event3=Un evento di club è stato organizzato sul tracciato International di Silverstone. Molti fan pensano che l'Evora sia solamente una macchina da gran turismo, ma la Lotus Evora S2 dovrebbe essere una grande arma per gareggiare e per insegnargli un paio di nuovi trucchetti.
series4_event4=Gli ingegneri Lotus vogliono verificare i limiti della Lotus Exige S. Il nome potrà sembrare familiare, ma è un nuovissimo telaio che monta un potente V6. Sta a te competere in questo time attack e dimostrare di cosa questa macchina sia capace quando viene spinta al limite.
series4_event5=Dopo una grande sessione di time attack, ti è stato garantito l'invito a partecipare ad una gara della Lotus Exige V6 Cup. I piloti avversari sono esperti, quindi fai attenzione al gioco sporco e all'alto livello di competizione.
series4_event6=Il Trofeo Lotus 2-11 viene a fare la sua visita annuale al circuito di Magione. Ti è stato chiesto di parteciparvi, ma rimani concentrato. La 2-11 ha un differenziale aperto e questo potrà portare la ruota posteriore interna a perdere aderenza nelle strette curve del circuito Italiano. Questo ti farà rallentare e consumare le gomme se non farai attenzione. Dovrai adottare una tecnica di guida corretta.
series4_event7=Gli ingegneri Lotus credono che tu sia la persona giusta per aiutarli nell'evoluzione della loro vettura GTC. Ti è stato chiesto di affrontare un time attack sul difficile circuito di Imola guidando la nuova Lotus Evora GTC. La giornata è molto calda, quindi stai attento al surriscaldamento. Cambia il tuo assetto secondo i tuoi gusti e spingila al limite!
series5=Congratulazioni, ora potrai competere nella Intermediate Series 1!</br></br>Quando guidi così bene per un gran marchio come Lotus è logico che gli altri costruttori Britannici ti terranno in considerazione... Ad ogni modo, quando il telefono squilla e all'altro capo del telefono c'è la McLaren, non è facile rimanere calmi e composti.<br/><br/> Vinci almeno <strong>2 medaglie di bronzo e una di argento</strong> e dimostra di sapere domare tutti quei cavalli!
series5_event1=Un club di vetture supersport sta organizzando delle entusiasmanti gare lungo alcuni tracciati Europei. La McLaren necessita di un esperto pilota di vetture stradali per spingere al limite la nuova McLaren MP4 12C e raccogliere dati su questa nuova supercar. La prima gara è sul circuito di Vallelunga.
series5_event2=Seconda gara delle supersports, al Mugello. Il tracciato italiano, di proprietà della Ferrari, è una delle piste più esigenti con lunghe e velocissime curve sia in salita che in discesa. Il solo fatto di avere una McLaren sul circuito della Ferrari dovrebbe essere una sfida emozionante.
series5_event3=La serie supersports sbarca sul tracciato GP del Nurburgring. Aspettati di incontrare costruttori tedeschi in gran numero con le loro tipiche auto sportive, oltre ad un paio di sorprese.
series5_event4=Silverstone dovrebbe essere la casa della McLaren. Tuttavia questo tracciato ha alcune veloci sequenze sinistra-destra â€‹â€‹che potrebbero portare la tua vettura al limite. Alcune leggere sportcars britanniche potrebbero essere in grado mantenere le gomme in condizioni migliori delle tue verso la fine della gara, quindi stai attento!
series5_event5=Monza è il regno della velocità. Il tracciato di Formula 1 con i rettilinei più veloci. Su una vettura come la McLaren potrai raggiungere velocità di punta incredibili, ma ricorda che questa monta ancora gomme stradali, quindi fai attenzione agli spazi di frenata. Inoltre, abbiamo saputo della probabile presenza di alcune rare Ferrari.
series6=Intermediate Series 2!</br></br>Da adesso le cose andranno di meglio in meglio. La Mercedes Benz ti sta offrendo una delle macchine più iconiche di tutti i tempi. La AMG SLS ha bisogno di essere guidata da qualcuno che sappia portarla ai limiti. Pensi di esserne capace?<br/><br/> Vinci almeno <strong>2 medaglie di bronzo e una di argento</strong> per completare la serie delle frecce d'argento.
series6_event1=La Mercedes Benz sta organizzando qualche gara di club per i suo clienti. Ti offrono una nuovissima Mercedes SLS AMG. Il primo evento si tiene al Nurburgring GP.
series6_event2=Il circuito di Imola è la location del secondo evento Mercedes. La SLS AMG è un ottima macchina, ma Imola è sempre un tracciato pericoloso, quindi fai attenzione quando salti da un cordolo all'altro.
series6_event3=Il circuito di Silverstone è noto per il clima freddo. Assicurati di mantenere le gomme calde ma evita surriscaldamenti nelle curve molto veloci.
series6_event4=Spa Francorchamps è un circuito fantastico. Necessita di potenza, guidabilità, agilità e aderenza. La Mercedes SLS AMG ha tutto questo e date le tue abilità dovresti fare faville su questo tracciato. Gli avversari sono molti forti però; ogni pilota ama gareggiare a Spa.
series6_event5=Non esiste un circuito con rettilinei più lunghi di quelli presenti sul tracciato di Monza. E' sicuramente la pista ideale per la SLS AMG.
series7=Ben fatto! Hai sbloccato la Intermediate Series 3.</br></br>Ferrari! Nel mondo non vi è un marchio più prestigioso. Di solito non partecipa ad eventi track day con le loro vetture e piloti, ma quando lo fa allora sceglie solo il meglio... e questa volta ha scelto te! Questa è l'occasione di una vita per far bene.<br/><br/> Vinci almeno <strong>due medaglie di bronzo e due di argento</strong>
series7_event1=Una famosa rivista motoristica ha seguito i tuoi progressi e ti ha chiamato per testare alcune vetture speciali. E' una grande opportunità, visto che potrai essere notato da alcune case costruttrici esotiche. Il primo test si terrà a Imola con la fantastica Ferrari 458 Italia.
series7_event2=Alcune supercars parteciperanno ad un test che è stato organizzato sul circuito di Monza. L'eccellente guidabilità della Ferrari 458 ti aiuterà sicuramente in questa gara, ma i motori delle altre vetture hanno una potenza simile o persino superiore alla tua e, come saprai di già, a Monza la potenza conta moltissimo.
series7_event3=Spa è un tracciato sul quale le gomme possono facilmente surriscaldarsi. Per fortuna, il più delle volte la bassa temperatura tipica di quella regione è in grado di raffreddarle. Ad ogni modo, su questo lungo tracciato percorrere 4 giri su gomme stradali è sempre impegnativo.
series7_event4=Questo tracciato è di proprietà della Ferrari ed è noto per stressare molto gli pneumatici. Alcuni team del Trofeo Ferrari sono qui e ti stanno osservando. Facendo bene potresti garantirti una stagione nel Trofeo Ferrari 458 S3.
series8=Benvenuto nel Trofeo Nazionale Lightweight della Lotus. </br></br>Gareggiare contro altri fan durante i brevi track day può essere divertente, ma la vera sfida sta nel affrontare un intero campionato contro piloti talentuosi su vetture simili alla tua.</br></br> Conquista <strong> 20 punti nel campionato</strong> per sbloccare le serie seguenti.
series8_event1=Il Trofeo Nazionale Lightweight della Lotus ha come prima tappa il circuito di Magione. I lentissimi tornanti e le chicane di Magione sono ideali per la agile Lotus 2-11. Ma fai attenzione al differenziale posteriore aperto. Non spingere troppo uscendo dalla curve se non vuoi avere problemi di graining o blistering alle gomme posteriori.
series8_event2=Monza è un altro ottimo tracciato per la Lotus 2-11. Le chicane sono perfette per l'agilità di questa macchina. Questa volta avrai bisogno di un assetto molto scarico per poter sfruttare la scia e superare le altre vetture nei lunghi rettilinei. La poca aderenza posteriore può rendere la macchina molto impegnativa alla Ascari e alla Parabolica.
series8_event3=Uno dei tracciati più impegnativi del mondo intero. Salta sugli alti cordoli, frena su superfici irregolari, percorri curve in contropendenza. Questo tracciato cercherà di farti uscire ad ogni curva. Anche i tuoi avversari aspettano quel momento... non dargli questo piacere.
series8_event4=Curve veloci e grandi colline, il Mugello è tutto questo. Un tracciato molto veloce che richiede precisione di guida e tanto coraggio. E' l'ultima gara della serie, quindi è anche la tua ultima possibilità per rimanere al vertice della classifica!
series9=Hai sbloccato il Trofeo Ferrari 458!</br></br> Un pilota del tuo livello non può limitarsi a partecipare solo ad eventi track day. E' tempo di andare a gareggiare seriamente contro piloti professionisti. Il Trofeo Ferrari 458 è uno degli eventi mono-marca più prestigiosi al mondo e molti team professionali sono li alla ricerca di ottimi piloti.</br></br> Conquista <strong> 15 punti nel campionato</strong> per fargli buona impressione.
series9_event1=La prima tappa del Trofeo Ferrari 458 S3 si tiene a Monza. Con una potenza di quasi 600 cavalli, bassa resistenza aerodinamica e gran accelerazione, questa vettura riesce a raggiungere notevoli velocità di punta. Anche se la vettura monta gomme slick, cerca di fare attenzione ai punti di frenata.
series9_event2=La bassissima altezza da terra della 458 S3 potrà crearti problemi nelle veloci e irregolari curve del Mugello. Meglio evitare i cordoli se non vuoi affrontare rischi enormi.
series9_event3=Il nuovo circuito di Silverstone possiede una superficie davvero liscia ed è perfetto per la Ferrari 458 S3. Ad ogni modo, alcune curve e chicane sono velocissime, quindi è richiesta la tua totale concentrazione.
series9_event4=La famosa Spa Francorchamps. Prova a non uscire dal tracciato percorrendo la Eau Rouge. Le curve restanti sono difficili ma non impossibili.
series9_event5=Imola è un tracciato molto tecnico. Fai particolare attenzione alla frenata in discesa prima della curva Rivazza. Forse è meglio sollevare il piede prima di entrare nella leggera curva a destra per poi premere a fondo il freno lasciando che l'ABS stabilizzi la vettura.
series9_event6=Il tracciato GP del Nurburgring potrà non essere venerato quanto il mitico Nordschleife, ma è comunque un percorso molto impegnativo. Con almeno 3 punti di sorpasso, avrai bisogno di una vettura stabile in frenata per riuscire a trarne vantaggio.
