series23_event5=Ad Imola la nostra vettura potrebbe fare davvero bene se riuscissi a ottenere una buona guidabilità passando sui cordoli. Proveremo un assetto con alta deportanza per avvantaggiarci della potenza e coppia del nostro motore e mantenere la vettura a terra quando salteremo sui cordoli. Ala anteriore a 1 e posteriore a 8. Gomme a mescola media con una pressione posteriore a 21. Molle anteriori a 110 e barra anti-rollio posteriore a 0. Compressione dell'ammortizzatore posteriore a 7 e compressione veloce a 30. Bilanciamento della frenata a 69%. Sii aggressivo sui cordoli ma cerca di atterrare con il volante ben centrato.
series23_event6=E' il momento di sfruttare tutta quella potenza. Monza è sinonimo di accelerazione e velocità di punta. La gomma a mescola dura è obbligatoria qui, con un pressione delle anteriori a 29. Ala anteriore su 0 e posteriore su 2. Bilanciamento di frenata a 71%. Molle anteriori a 120, posteriori a 105, barra anti-rollio posteriore a 0. Con una vettura ben bilanciata e una velocità di punta superiore a 270km/h, non molti avversari potranno darci filo da torcere.
series23_event7=La prossima gara a Spa è la nostra ultima chance per vincere il campionato! Partiremo con l'assetto utilizzato al Mugello, cercando di migliorarlo per questa pista. Ali A-P rispettivamente a 1-5. Barra anti-rollio anteriore a 6, molle posteriori a 100. Altezza anteriore a 2 e quella posteriore a 0. Bilanciamento della frenata a 70%. La temperatura è bassa, quindi monteremo le gomme a mescola media. Sii prudente durante i primi giri e ricorda di guidare con precisione nelle curve veloci.
series24=Guidare per il team ufficiale BMW GT2!</br></br> Questo è un gran risultato per qualsiasi pilota professionista. Pure avendo già qualche anno, questa vettura è ancora competitiva e il team si aspetta che tu faccia la differenza.</br></br> Ti viene richiesta la conquista di almeno <strong>60 punti </strong> perché la stagione sia soddisfacente.
series24_event1=Come forse saprai già, la nostra vettura ha un passato di successi e per questo abbiamo già un assetto di base che sappiamo essere efficace. Durante la prima gara potrai familiarizzare con questo setup mentre in futuro vedremo di consigliarti le modifiche per adeguarlo al tuo stile di guida. Setta l'ala anteriore a 2 e posteriore a 4. Rapporto finale delle marce a 10/50 e la sesta marcia a 34/31. Gomme a mescola media con pressione a 21.
series24_event2=Partiamo con l'assetto per il Nurburgring GP, ma per Vallelunga suggeriamo di aumentare la barra anti-rollio anteriore e la 6° marcia di 1 click. La vettura è abbastanza prevedibile nei lenti tornanti di Vallelunga ma per fare buoni giri dovrai limitare il sovrasterzo e massimizzare la trazione.
series24_event3=Ancora una volta utilizziamo il setup di Nurburgring GP. Utilizza una sesta marcia leggeremente più lunga, a 25/31. Se avrai bisogno di più aderenza, suggerisco un camber anteriore a -3.8 e posteriore a -3. Fai attenzione ai bloccaggi in frenata per evitare di spiattellare le gomme. Inoltre questa vettura potrà avere un comportamento nervoso quando passerai sui cordoli.
series24_event4=Il circuito del Mugello è ricco di velocissime curve che faranno andare le sospensioni a fine corsa per tutta la percorrenza. Useremo l'assetto per Silverstone, cambiandone la rigidità dei tamponi delle sospensioni per avere una vettura più stabile sui cordoli. Mettiamo i tamponi anteriori a 130 e quelli posteriori a 100. Potresti avere problemi di surriscaldamento. Utilizza meno campanatura negativa e cerca di adeguare il tuo stile di guida. Se il problema dovesse persistere, allora sii pronto a montare gomme a mescola dura ricordando che questo assetto non è stato pensato per una configurazione del genere su questo tracciato.
series24_event5=L'assetto del Mugello dovrebbe funzionare bene qui ad Imola, il tutto con qualche piccola modifica, principalmente ai tamponi delle sospensioni. Compressione dell'ammortizzatore anteriore su 60, posteriore su 40. Estensione veloce anteriore a 140 e posteriore a 85. Estensione dell'ammortizzatore posteriore a 20, corsa posteriore a 80. Anche in questo modo la vettura sarà un pò saltellante sui cordoli, quindi fai attenzione a quando darai gas.
series24_event6=Avere una bassa resistenza aerodinamica è obbligatorio a Monza. Iniziamo con l'assetto standard e cambiamo le ali A-P rispettivamente a 0-2. Montiamo gomme a mescola media con pressioni anteriori a 28 e posteriori a 21. Barra anti-rollio posteriore a 0. Come al solito, fai attenzione ai bloccaggi in frenata per evitare di spiattellare le gomme. Se pensi di poterti prendere qualche rischio aggiuntivo, potresti abbassare l'ala posteriore di 1 click e indurire la barra anti-rollio anteriore per bilanciare il tutto.
series24_event7=A Spa Francorchamps si corre l'ultima gara di questa stagione. Ti suggeriamo l'assetto del Nurbrugring GP con campanatura anteriore a -3.8 e posteriore a -3. Utilizza anche una sesta marcia più lunga, settandola a 25/31.
series25=Guidare per il team ufficiale BMW GT2!</br></br> Questo è un gran risultato per qualsiasi pilota professionista. Pure avendo già qualche anno, questa vettura è ancora competitiva e il team si aspetta che tu faccia la differenza.</br></br> Ti viene richiesta la conquista di almeno <strong>60 punti </strong> perché la stagione sia soddisfacente.
series25_event1=Il nostro ingegnere di pista è deciso a migliorare la vettura nell'arco di tutta stagione, invece di creare assetti specifici per ogni tracciato. Un pilota esperto come te dovrebbe essere capace di tenere testa ai possibili problemi di guidabilità e dare i consigli adeguati al fine di migliorare la macchina gara dopo gara. Partiremo con il Nurburgring GP montando gomme a mescola media con pressione a 21, un rapporto finale più corto di 1 click, ali su valori standard e barra anti-rollio posteriore a 2. Ricorda che il motore non fornisce molta potenza dopo i 7000rpm, quindi cambia marcia quando i led iniziano a lampeggiare.
series25_event2=L'assetto per il Nurburgring era abbastanza buono pur mancando di trazione. Per la gara di Vallelunga dovremo migliorarla. Carica il setup per Nurburgring GP e quindi abbassa la barra anti-rollio posteriore a 0. Sull'anteriore, una campanatura negativa a -3.0 ti darà aderenza al centro delle curve. Molle anteriori a 120 ci renderanno la frenata più efficiente. Incrementa di 1 click la sesta marcia, portandola a 25/24.
series25_event3=Silverstone dovrebbe essere un circuito adatto alla tua vettura, in quanto contano soprattutto aerodinamica e velocità in curva. Partiamo con l'assetto per Vallelunga. Setta la quinta marcia a 23/26. Molle anteriori a 110. Altezza da terra anteriore a 6 e posteriore a 2. Al posteriore, compressione dell'ammortizzatore a 30 e estensione veloce a 97. Questo dovrebbe rendere la macchina più stabile sui cordoli. Se sarà efficace potremmo utilizzare questo assetto anche ad Imola.
series25_event4=La vettura si sta comportando bene. Per il Mugello partiremo dall'assetto di Silverstone. Aggiungiamo un pò di corsa all'anteriore per aiutare il comportamento nelle curve lunghe; un valore di 40 può andare bene. Molle posteriori a 105. Questo dovrebbe bastare. Le gomme a mescola media potrebbero surriscaldarsi su questo tracciato. Dovremmo tenere la cosa sotto controllo, ma in caso di grossi problemi sarà obbligatorio montare gomme a mescola dura.
series25_event5=A questo punto l'assetto utilizzato al Mugello dovrebbe andare bene anche per Imola. Le gomme a mescola media dovrebbero funzionare a meraviglia qui. Fai attenzione alla curva Tosa se le gomme non sono ancora in temperatura. Se si presentano ancora problemi di trazione, allora abbassiamo di 1-2 click la pressione delle gomme posteriori. A questo punto l'assetto sarà davvero competitivo.
series25_event6=Monza è un tracciato particolare. Dovremo cercare di avere la minima resistenza aerodinamica senza distruggere il bilanciamento della vettura. Settiamo le ali A-P rispettivamente a 0-2. La deportanza anteriore della vettura sarà maggiore così proveremo a bloccare la corsa delle sospensioni anteriori per limitare il beccheggio. All'anteriore: altezza da terra a 15, corsa delle sospensioni a 30, rigidità dei tamponi a 150 e barra anti-rollio a 10. Montiamo gomme a mescola media con pressione anteriore a 26 e posteriore a 22. Il rapporto finale delle marce deve essere 10/34 e la 6° marcia a 27/28. Se dovessi avere ancora problemi di guidabilità, allora porta l'ala posteriore a 3.
series25_event7=A Spa, ultima gara della stagione, useremo l'assetto di Imola. Cambieremo solamente i rapporti delle marce per adeguarli ai lunghi rettilinei del tracciato. Carica l'assetto di Imola e cambia il rapporto finale delle marce mettendolo a 10/34. Dovrebbe essere ok. Il team ti ringrazia per il tuo lavoro e per avere creato un ottimo assetto di base che verrà utilizzato sulle vetture clienti. Ben fatto!
series26=Sei un pilota ufficiale della Ferrari 458 GT2!</br></br> Finalmente la pazienza e la dedizione che hai dimostrato durante i trofei minori della Ferrari hanno dato i loro frutti. Essere un pilota professionista per la Ferrari è un sogno che diventa realtà. </br></br> Il team richiede almeno <strong> 60 punti nel campionato.</strong>
