series16=Hai sbloccato le hypercar di livello 1!</br></br> Ovviamente i possessori di hypercar sono molto orgogliosi delle loro vetture. Anche se molti le collezionano solo per il loro valore economico, ad alcuni di questi piace anche vederle girare sui circuiti. Di solito chiedono a piloti professionisti di guidare le loro vetture al limite, ma solo su invito. Considerati fortunato. </br></br> Colleziona <strong> 3 medaglie di bronzo e 2 di argento</strong> per completare questo evento.
series16_event1=La Ferrari F40, una vera icona delle supercar che alcuni considerano ancora l'ultima e la miglior supercar analogica mai costruita. Questa versione S3 gode di un motore potenziato da oltre 600 cavalli e gomme slick. Il tutto senza ABS e traction control. Riuscirai a trovare i limiti della vettura, o solamente i tuoi?
series16_event2=Direttamente dal programma di ricerca e sviluppo Ferrari Clienti, la 599XX è un velocissimo laboratorio da corsa. Con 750 cavalli di potenza ed aerodinamica attiva, è sicuramente impegnativo condurla in gara. Il Mugello, di proprietà della Ferrari, è il circuito ideale per questa vettura.
series16_event3=Una potenza spaventosa, aerodinamica attiva e gomme slick fanno si che la Ferrari 599XX EVO sia una delle auto più veloci a girare al Nordschleife. Nessuno, però, è talmente pazzo da guidarla sul circuito lungo. Il circuito Nurburgring GP è molto impegnativo ed attrae moltissimi appassionati di hypercar.
series16_event4=La Pagani Zonda è una delle vetture più desiderate al mondo. La versione R ha tutto ciò che amiamo delle creazioni della Pagani, e lo amplifica. Leggerissima, estremamente potente, costruita per correre. Non avresti mai creduto che Silverstone potesse essere percorsa così velocemente. Sarai però in grado di gareggiare contro vetture simili?
series16_event5=La Pagani Zonda R è così veloce lungo le salite e le discese di Imola che dovrai rimanere concentrato per evitare di soffrire di vertigini. Immagina anche di avere altre hypercars attorno a te, che spingono per vincere!
series16_event6=Dopo l'estrema Zonda R, nessuno avrebbe creduto che la Pagani potesse creare qualcosa di ancor più estremo ma pur sempre guidabile in ambiente urbano. Si sbagliavano. La Pagani Huayra può facilmente superare i 300km/h lungo i rettilinei di Monza. Riusciranno le quattro ali indipendenti, azionate dall'aerodinamica attiva, a frenare la vettura in tempo per le strette chicane?
series16_event7=La leggenda del più famoso costruttore di sportcar al mondo continua con la hypercar LaFerrari. Questa incredibile meraviglia tecnologica utilizza un sistema ibrido per sviluppare 963 cavalli di potenza, aerodinamica attiva e scelte telaistiche che faranno apparire lente tutte le altre hypercar. Dimostralo in questa titanica battaglia lungo le curve del tracciato di Spa Francorchamps.
series17=Benvenuto nella GT Advanced Series!</br></br> Le eccellenti performance che hai ottenuto con svariati tipi di vetture ti hanno reso famoso. Alcuni team di GT3 e persino GT2 stanno cercando piloti del tuo calibro per affidargli le loro vetture. </br></br> Conquista almeno<strong> 3 medaglie di bronzo e 2 di argento</strong> per far bella figura con i team GT.
series17_event1=Hai l'opportunità di guidare una BMW Z4 GT3 sul tracciato GP del Nurburgring. Una delle più potenti vetture GT3, la BMW può dimostrarsi nervosa in frenata. Cerca di frenare sempre in linea dritta e sfrutta la potenza per uscire velocemente dalle curve.
series17_event2=Il team BMW ti offre di nuovo il sedile della sua BMW Z4 GT3, ma questa volta dovrai guidare sul circuito di Vallelunga. La generosa coppia della bimmer è perfetta per accelerare in uscita dai lenti tornanti di Vallelunga. Se in pista ti troverai in difficoltà con l'usura delle gomme, ricordati di agire sul livello di traction control.
series17_event3=Un team ti offre la possibilità di guidare la loro McLaren MP4 GT3 per una gara a Silverstone. La McLaren è una macchina estremamente efficiente, ma il motore turbo e una guidabilità che non ammette errori possono creare situazioni pericolose. Farai meglio ad utilizzare un assetto sicuro che potrebbe essere sì lento in principio, ma renderebbe la vettura molto più stabile a gomme consumate.
series17_event4=Un'altra gara sulla velocissima McLaren MP4 GT3, questa volta al Mugello. Le lunghe e veloci curve di questo tracciato stresseranno molto le gomme, quindi cerca di non ignorare questo aspetto. E' sicuramente meglio aggiungere qualche grado di ala posteriore per cercare stabilità, invece di essere più veloci rischiando il testacoda ad ogni curva.
series17_event5=Un team Mercedes GT3 è rimasto davvero impressionato dalle tue doti. Ti offrono la loro SLS per una gara a Imola. Questa Mercedes è molto potente, specialmente a bassi e medi regimi. I cordoli di Imola possono rendere instabile la vettura e farti perdere trazione, quindi è meglio agire sul traction control.
series17_event6=Monza è il circuito perfetto per la potentissima Mercedes SLS. Nel caso tu abbia avuto problemi nelle gare precedenti, questa è un'ottima opportunità per prenderti la rivincita e conquistare qualche punto prezioso. Porta a casa la vittoria!
series17_event7=La Scuderia Glickenhaus ingaggia solamente piloti esperti, ma questa volta faranno un'eccezione. Spa Francorchamps è un circuito molto tecnico. La P4/5 Competizione è nota per avere un grip estremo, ma anche per una velocità di punta non eccelsa. Anche se la vittoria sarà probabilmente al di fuori dalle tue possibilità, riuscirai a salire sul podio?
series18=Benvenuto nella BMW GT3 Series!</br></br> La BMW ti accoglie in uno dei suoi team GT3 per gare di durata. Guiderai una Z4 GT3 per l'intera stagione con il pieno supporto della casa costruttrice.</br></br> Il team pensa che dovrai conquistare <strong> 60 punti nel campionato</strong>.
series18_event1=La BMW Z4 GT3 è definitivamente una vettura di successo. E' molto sensibile ai cambiamenti di assetto, quindi per questa prima gara devi concentrarti nel trovare le soluzioni adeguate per migliorarne la guidabilità, in previsione delle prossime gare. Ala anteriore su 1 e quella posteriore su 6. Bilancimento di frenata su 74%. Molle anteriori a 200, barra anti-rollio frontale a 8. Altezza da terra anteriore a 7 e quella posteriore a 30. Differenziale in coast a 60%. Così facendo dovresti avere una macchina abbastanza veloce e stabile per questo primo evento.
series18_event2=Vallelunga è un circuito relativamente sicuro, quindi possiamo provare qualche assetto più estremo per aumentare la velocità di punta e quella in curva. Utilizza ali A-P rispettivamente su 0-4. Bilanciamento di frenata a 74% poiché in frenata la vettura sarà sempre un pò nervosa. Molle anteriori a 200 e barra anti-rollio anteriore a 6. Potresti avere problemi in uscita di curva quindi non dimenticarti di settare il traction control su un livello da 5 a 7.
series18_event3=Silverstone è un circuito impegnativo, quindi meglio puntare alla stabilità. Suggerisco ali A-P rispettivamente su 1-6, barra anti-rollio anteriore a 8 e un bilanciamento della frenata a 74. Il clima è freddo, quindi dovresti riuscire a gareggiare con le gomme a mescola media, ma ricorda che è sempre presente l'eventualità che si surriscaldino. Se pensi di avere questo tipo di problema, allora utilizza gomma a mescola dura abbassando la pressione di 3 click.
series18_event4=Dobbiamo trovare una soluzione al comportamento instabile del posteriore della tua vettura, ma allo stesso tempo cercheremo di avere una buona velocità lungo le curve del Mugello. Partiamo con ala anteriore a 1 e quella posteriore a 6. Proveremo ad usare un assetto molto rigido per distribuire meglio il peso sulle ruote. Corsa delle sospensioni anteriori 40. Barra anti-rollio anteriore a 10 ed altezza da terra a 8. Corsa delle sospensioni posteriori a 70. Molle posteriori a 90 con altezza da terra a 20. Barra anti-rollio posteriore a 6. Monta gomme a mescola dura con pressioni A-P rispettivamente a 24-25. Non spingere troppo al primo giro, lascia che le gomme si scaldino a sufficienza, e solo allora inizia a spingere.
series18_event5=Come spesso succede ad Imola, gli ammortizzatori saranno molto sollecitati a causa dei cordoli. Utilizza ala anteriore a 1 e quella posteriore a 6. Corsa delle sospensioni posteriori a 70. Barra anti-rollio anteriore a 6 ed quella posteriore a 0. Al posteriore, compressione dell'ammortizzatore a 10, compressione veloce a 34 ed estensione veloce a 25. Bilanciamento della frenata a 74. Gomme a mescola media con pressioni A-P pari a 23-22. Il livello 7 di traction control dovrebbe essere perfetto.
series18_event6=La BMW ha un motore fantastico, ora dovremmo provare ad ottimizzare l'aerodinamica abbassando l'ala posteriore il più possibile. Metti ala anteriore a 0 e quella posteriore a 3. Le gomme a mescola dura sono obbligatorie, con pressioni A-P pari a 29-25. Bilanciamento della frenata a 79 per stabilizzare la macchina il più possibile durante la frenata. Barra anti-rollio anteriore a 5, molle anteriori a 190. Altezza anteriore a 10, posteriore a 28, barra anti-rollio posteriore a 0. Allunga il rapporto finale delle marce a 10-47. Livello 8 per il traction control.
series18_event7=L'ultima gara si tiene a Spa Francorchamps. Dobbiamo riuscire ad ottenere un buon risultato, quindi forse dovremmo prenderci qualche rischio con il prossimo assetto. Teniamo le gomme a mescola media, settiamo l'ala anteriore a 0 e la posteriore a 4. Un livello di traction control pari a 7 dovrebbe aiutarti nelle uscite della curve lente. Molle anteriori a 200 per facilitare l'inserimento in curva e la stabilità in frenata. Altezza da terra anteriore a 6 e quella posteriore a 26 per far lavorare il diffusore. Infine, bilanciamento della frenata a 74. La vettura non sarà molto docile, ma dovrebbe essere veloce. Ora vai!
series19=Benvenuto nella BMW GT3 Extreme Series!</br></br> La BMW ti accoglie in uno dei suoi team GT3 per gare di durata. Guiderai una Z4 GT3 per l'intera stagione con il pieno supporto della casa costruttrice. Questa volta sarai responsabile per le sessioni di pratica e qualifica durante i weekend di gara. </br></br> Il team crede che dovresti conquistare <strong> 60 punti nel campionato.</strong>
series19_event1=La BMW Z4 GT3 è definitivamente una vettura di successo. E' molto sensibile ai cambiamenti di assetto, quindi per questa prima gara devi concentrarti nel trovare le soluzioni adeguate per migliorarne la guidabilità, in previsione delle prossime gare. Ala anteriore su 1 e quella posteriore su 6. Bilancimento di frenata su 74%. Molle anteriori a 200, barra anti-rollio frontale a 8. Altezza da terra anteriore a 7 e quella posteriore a 30. Differenziale in coast a 60%. Così facendo dovresti avere una macchina abbastanza veloce e stabile per questo primo evento.
series19_event2=Vallelunga è un circuito relativamente sicuro, quindi possiamo provare qualche assetto più estremo per aumentare la velocità di punta e quella in curva. Utilizza ali A-P rispettivamente su 0-4. Bilanciamento di frenata a 74% poiché in frenata la vettura sarà sempre un pò nervosa. Molle anteriori a 200 e barra anti-rollio anteriore a 6. Potresti avere problemi in uscita di curva quindi non dimenticarti di settare il traction control su un livello da 5 a 7.
series19_event3=Silverstone è un circuito impegnativo, quindi meglio puntare alla stabilità. Suggerisco ali A-P rispettivamente su 1-6, barra anti-rollio anteriore a 8 e un bilanciamento della frenata a 74. Il clima è freddo, quindi dovresti riuscire a gareggiare con le gomme a mescola media, ma ricorda che è sempre presente l'eventualità che si surriscaldino. Se pensi di avere questo tipo di problema, allora utilizza gomma a mescola dura abbassando la pressione di 3 click.
series19_event4=Dobbiamo trovare una soluzione al comportamento instabile del posteriore della tua vettura, ma allo stesso tempo cercheremo di avere una buona velocità lungo le curve del Mugello. Partiamo con ala anteriore a 1 e quella posteriore a 6. Proveremo ad usare un assetto molto rigido per distribuire meglio il peso sulle ruote. Corsa delle sospensioni anteriori 40. Barra anti-rollio anteriore a 10 ed altezza da terra a 8. Corsa delle sospensioni posteriori a 70. Molle posteriori a 90 con altezza da terra a 20. Barra anti-rollio posteriore a 6. Monta gomme a mescola dura con pressioni A-P rispettivamente a 24-25. Non spingere troppo al primo giro, lascia che le gomme si scaldino a sufficienza, e solo allora inizia a spingere.
