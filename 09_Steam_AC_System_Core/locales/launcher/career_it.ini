series14=Il Trofeo Ferrari 599XX Avanzato. </br></br> Questa è una serie dedicata, aperta solo ai possessori dell'esclusivo programma XX della Ferrari. Questo trofeo avanzato offre weekend di gara e lunghe gare contro avversari più veloci.</br></br> Conquista<strong> 45 punti nel campionato</strong> per prendere posto in una GT Ferrari.
