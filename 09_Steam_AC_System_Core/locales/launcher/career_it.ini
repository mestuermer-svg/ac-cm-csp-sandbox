series1=Benvenuti nella carriera di Assetto Corsa<br/><br/>Guidare una Ferrari 458 GT2 è un sogno, ma c'è molto lavoro da fare se vuoi diventare un pilota professionista. Comincia con la tua piccola Abarth 500 EsseEsse. L'Abarth sicuramente non è un missile nel dritto, ma è molto agile nelle curve strette. Riesci a trovare i suoi limiti e imparare i vantaggi della trazione anteriore?<br/><br/> Vinci almeno <strong>3 medaglie di bronzo</strong> per sbloccare la prossima serie.
series1_event1=La piccola Abarth 500 EsseEsse è un'ottima auto per iniziare. Divertente e sicura. Allenati a Vallelunga club con questo time attack e preparati per la tua prima gara.
series1_event2=Il club Abarth locale sta organizzando una breve gara monomarca. Dimostra le tue abilità in questa rapida gara da 3 giri.
series1_event3=Hai sempre più estimatori tra gli appassionati di auto. Un amico ti offre l'opportunità di guidare la sua Alfa Romeo Giulietta QV per un time attack sul circuito di Magione; dimostragli di meritare la sua fiducia!
series1_event4=Sei andato molto bene, così ti viene data l'opportunità di guidare una bellissima Alfa Romeo Giulietta QV in una gara locale sul circuito di Magione. Fai attenzione agli altri concorrenti in quanto sembra abbiano installato sulle loro piccole Abarth un set di gomme migliori, oltre a sospensioni e motori più performanti. Dimostra quello che puoi fare in una gara da 5 giri.
series1_event5=Una delle caratteristiche del circuito di Magione consiste in un manto stradale spesso polveroso. Hai l'opportunità di provare una BMW M3 E30 modificata su di una superficie molto scivolosa. Attento ai punti di frenata ed ai sovrasterzi di potenza.
series10=Benvenuto nel Trofeo Formula Abarth. </br></br> Questa campionato di monoposto è una delle più importanti vetrine per i piloti. Un pilota che riesca a dare solide performance in questa serie sarà sicuramente notato da team professionali.</br></br> Conquista <strong> 40 punti nella serie</strong> per fare buona impressione.
series10_event1=La prima tappa del campionato CSAI Formula Abarth si tiene a Magione. Questo stretto circuito è semplice da memorizzare ma è troppo sconnesso per una gara di monoposto. Probabilmente dovrai aumentare l'altezza da terra della vettura ed usare sospensioni più soffici per tenere a bada le asperità, le ondulazioni e i cordoli.
series10_event2=Il circuito di Vallelunga è ricco di opportunità per sorpassare, ma anche per essere superati. Alcune curve richiedono una linea di frenata non convenzionale. Impara quella linea e potrai guadagnare fino a mezzo secondo per giro.
series10_event3=Il Mugello è uno dei tracciati più impegnativi. Le lunghe e veloci curve richiedono deportanza mentre nei lunghissimi rettilinei è importante la velocità di punta. Dovrai trovare il giusto compromesso. Evita i cordoli: sembrano bassi ma in realtà, alle alte velocità, possono creare seri problemi di stabilità alla vettura.
series10_event4=Il Nurburgring GP è un altro circuito tecnico. Da tornanti in discesa da prima a chicane in salita da quinta marcia. Precisione e coraggio sono ciò di cui hai bisogno per andare veloce e sorpassare con successo.
series10_event5=Imola è anche chiamata "il piccolo Nurburgring". Per essere veloce dovrai saltare sui cordoli, ma questo non significa che questi siano bassi e innocui. Potresti anche essere in grado di prenderti qualche rischio e fare il giro perfetto, ma pensi ti poterlo fare per tutta la durata della gara?
series10_event6=Silverstone ha tutto: da tornanti molto lenti a velocissime curve e chicane da quinta e sesta marcia! Abilità, un buon assetto e tanto coraggio sono necessari per tenere giù l'acceleratore in quelle folli curve veloci.
series10_event7=Un circuito velocissimo dove il basso carico alare e i giochi di scie sono necessari per avere successo. Abbassa la vettura per far lavorare meglio il diffusore, ma rimani lontano dai cordoli se vuoi evitare danni al fondo scocca.
series10_event8=L'ultima gara del campionato CSAI Formula Abarth e quindi anche l'ultima possibilità per vincerlo. L'Eau Rouge è probabilmente la curva più impressionante, emozionante e pericolosa del mondo intero. Ma avrai a che fare anche con il resto del circuito: ben sette lunghi chilometri.
series100=Congratulazioni! Hai superato con successo tutte le sfide e sei riuscito a portare a termine la carriera di Assetto Corsa! Hai dimostrato di essere un pilota virtuale con ottime qualità di guida e un talento fuori dal comune. Non à da tutti raggiungere questo traguardo! Ma la sfida non finisce qui. Con i prossimi contenuti aggiuntivi che verranno rilasciati, nuove imprese e nuovi successi ti aspettano!
series11=Il Trofeo Ferrari 599XX. </br></br> Questa è una serie dedicata, aperta solo ai possessori dell'esclusivo programma XX della Ferrari. Alcuni piloti professionisti sono stati invitati e verranno tenuti d'occhio. Al migliore tra questi potrà essere offerto un sedile in uno dei team Ferrari GT.</br></br> Conquista<strong> 36 punti nel campionato</strong> per prendere posto in una GT Ferrari.
series11_event1=Non è facile guidare una vettura così potente per le strette curve di Magione. Gomme di mescola morbida con basse pressioni interne possono sicuramente aiutarti. Potresti anche avere bisogno di attivare il traction control, per domare l'eccesso di potenza e trovare un pò di trazione.
series11_event2=La Ferrari 599XX EVO arriva alla prima velocissima chicane in discesa del circuito di Vallelunga a più di 250km/h... è davvero veloce! Dovrai essere abile ed audace, o abbastanza pazzo, per montare un assetto che ti permetta di percorrere la prima curva a pieno gas, ma in seguito ti mancherà sicuramente trazione nelle lunghe curve più lente. Forse è meglio trovare un compromesso e utilizzare un setup bilanciato.
series11_event3=Lunghe curve veloci. Il Mugello consiste in questo. La 599XX EVO è un'ottima vettura, ma avrai bisogno di abituarti alla sua aerodinamica attiva. Entra in una curva dolcemente e appena perderai la traiettoria allora stringi di più la linea e lascia che l'elettronica entri in azione. Il risultato ti sorprenderà.
series11_event4=Il Nurburgring GP è caratterizzato da curve che hai già affrontato in tutti gli altri circuiti, ma combinate assieme in un unico tracciato. Lenti tornanti dove ti mancherà trazione e curve estremamente veloci dove aderenza e stabilità sono importanti. Dovrai essere fortunato per trovare il giusto compromesso nel setup della vettura.
series11_event5=Imola non è un tracciato semplice per le vetture molto potenti. Per fare un buon giro dovrai necessariamente saltare sui cordoli, ma questo può essere un problema quando si dispone di 750 cavalli di potenza... Forse è giunto il momento di usare il manettino per selezionare uno dei vari livelli di traction control.
series11_event6=Oramai dovresti aver capito come funzionano l'elettronica e l'aerodinamica attiva della 599XX. Se non ti creano disagio e sei capace di trarne vantaggio, allora Silverstone può essere un pista favorevole a questa vettura. Il clima è freddo ma su questo tracciato le gomme si surriscaldano facilmente, quindi pensa due volte a quale mescola utilizzare.
series11_event7=Sguinzaglia i 750 cavalli nei lunghi rettilinei di Monza e preparati a superare i 300km/h! Fai attenzione però, perchè certe velocità richiedono lunghi spazi di frenata e le chicane di Monza sono molto strette ed impegnative. Tieni d'occhio anche il clima torrido, usa gomme a mescola dura.
series11_event8=Temperatura bassa, poca aderenza, alcune tra le più sorprendenti curve al mondo. Questa è Spa Francorchamps. Le gomme morbide dovrebbero darti buona aderenza, ma dureranno per tutta la gara? E' l'ultima prova del campionato, cerca di fare bene.
series12=Ferrari 458 Trofeo Advanced!</br></br> Un pilota del tuo livello non può partecipare a track days in eterno. E' ora di gareggiare contro altri piloti professionisti. Il Ferrari 458 Trofeo Advanced ti da la possibilità di partecipare a interi weekend di gara e a lunghe competizioni.</br></br> Conquista <strong> 30 punti nel campionato</strong> per farti notare dai team professionali.
series12_event1=La prima tappa del Trofeo Ferrari 458 S3 si tiene a Monza. Con una potenza di quasi 600 cavalli, bassa resistenza aerodinamica e gran accelerazione, questa vettura riesce a raggiungere notevoli velocità di punta. Anche se la vettura monta gomme slick, cerca di fare attenzione ai punti di frenata.
series12_event2=La bassissima altezza da terra della 458 S3 potrà crearti problemi nelle veloci e irregolari curve del Mugello. Meglio evitare i cordoli se non vuoi affrontare rischi enormi.
series12_event3=Il nuovo circuito di Silverstone possiede una superficie davvero liscia ed è perfetto per la Ferrari 458 S3. Ad ogni modo, alcune curve e chicane sono velocissime, quindi è richiesta la tua totale concentrazione.
series12_event4=La famosa Spa Francorchamps. Prova a non uscire dal tracciato percorrendo la Eau Rouge. Le curve restanti sono difficili ma non impossibili.
series12_event5=Imola è un tracciato molto tecnico. Fai particolare attenzione alla frenata in discesa prima della curva Rivazza. Forse è meglio sollevare il piede prima di entrare nella leggera curva a destra per poi premere a fondo il freno lasciando che l'ABS stabilizzi la vettura.
series12_event6=Il tracciato GP del Nurburgring potrà non essere venerato quanto il mitico Nordschleife, ma è comunque un percorso molto impegnativo. Con almeno 3 punti di sorpasso, avrai bisogno di una vettura stabile in frenata per riuscire a trarne vantaggio.
series13=Benvenuto al campionato Formula Abarth. </br></br> Questo è l'intero campionato comprensivo di weekend di gara. I tuoi avversari sono ancora più veloci e le condizioni del tracciato possono cambiare durante il weekend. </br></br> Conquista <strong> 60 punti nel campionato</strong> per fare bella figura agli occhi dei team professionali.
