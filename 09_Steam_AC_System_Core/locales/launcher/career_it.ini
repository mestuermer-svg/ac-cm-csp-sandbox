series22=Ben fatto! Ora sei un pilota di un team Mercedes e guiderai la loro SLS GT3!</br></br> La Mercedes SLS GT3 è una della più potenti e sensazionali vetture presenti nella serie. Gareggiare con una Mercedes avrà grandi ripercussioni sulla tua carriera.</br></br> Conquista almeno <strong> 60 punti nel campionato.</strong>
series22_event1=La Mercedes SLS GT3 è una vettura estremamente competitiva, fin dall'uscita dalla linea di costruzione. Faremo quindi solo qualche piccola modifica alla ricerca di un comportamento migliore sul Nurburgring GP. Iniziamo con il montare gomme a mescola media e accorciando la 6° marcia di 2 click. Ala anteriore ad 1 e posteriore a 6. Bilanciamento della frenata a 70%. Molle anteriori a 100. Il motore ha così tanta coppia che senza traction control avresti grossi problemi, quindi settalo a un livello 5 o 6.
series22_event2=Con un motore che fornisce così tanta coppia ai bassi regimi, ora dovremo concentrarci sulla trazione all'uscita dei lenti tornanti di Vallelunga, Ali A-P rispettivamente a 1-6. Gomme a mescola media con pressione anteriore a 25 e posteriore a 24. Differenziale in coast a 35% e bilanciamento della frenata a 70%. Molle anteriori e posteriori a 100. Barra anti-rollio posteriore a 0. Con questo assetto potresti avere un leggero sottosterzo, ma la trazione sarà talmente efficiente che potresti non aver bisogno del traction control.
series22_event3=Le veloci varianti del circuito di Silverstone non si sposano completamente con le caratteristiche della nostra vettura. Proveremo a renderla più stabile sul veloce sinistra-destra delle Maggots, cercando qualche piccolo compromesso per il resto della pista. Ali A-P rispettivamente a 1-7. Molla anteriore a 110, barra anti-rollio posteriore a 0. Bilanciamento della frenata a 70%. Accorcia la 6° marcia di 1 click. Avrai bisogno del traction control per le curve lente, un livello di 6 o 7 può essere una buona scelta. Cerca di portare a casa un buon risultato.
series22_event4=Il Mugello è un altro tracciato caratterizzato da sequenze di curvi veloci, ma presenta anche lunghissimi rettilinei in salita. Proveremo ad attaccare nei rettilinei ed a difenderci nelle curve. Ala anteriore a 1 e posteriore a 5. Barra anti-rollio anteriore a 6, molle posteriori a 100. Altezza da terra anteriore a 2, posteriore a 0. Bilanciamento della frenata a 70%. Gomme a mescola dura sono obbligatorie con questa temperatura calda. Sii prudente durante i primi giri e ricorda di guidare con precisione nelle curve veloci.
series22_event5=Ad Imola la nostra vettura potrebbe fare davvero bene se riuscissi a ottenere una buona guidabilità passando sui cordoli. Proveremo un assetto con alta deportanza per avvantaggiarci della potenza e coppia del nostro motore e mantenere la vettura a terra quando salteremo sui cordoli. Ala anteriore a 1 e posteriore a 8. Gomme a mescola media con una pressione posteriore a 21. Molle anteriori a 110 e barra anti-rollio posteriore a 0. Compressione dell'ammortizzatore posteriore a 7 e compressione veloce a 30. Bilanciamento della frenata a 69%. Sii aggressivo sui cordoli ma cerca di atterrare con il volante ben centrato.
series22_event6=E' il momento di sfruttare tutta quella potenza. Monza è sinonimo di accelerazione e velocità di punta. La gomma a mescola dura è obbligatoria qui, con un pressione delle anteriori a 29. Ala anteriore su 0 e posteriore su 2. Bilanciamento di frenata a 71%. Molle anteriori a 120, posteriori a 105, barra anti-rollio posteriore a 0. Con una vettura ben bilanciata e una velocità di punta superiore a 270km/h, non molti avversari potranno darci filo da torcere.
series22_event7=La prossima gara a Spa è la nostra ultima chance per vincere il campionato! Partiremo con l'assetto utilizzato al Mugello, cercando di migliorarlo per questa pista. Ali A-P rispettivamente a 1-5. Barra anti-rollio anteriore a 6, molle posteriori a 100. Altezza anteriore a 2 e quella posteriore a 0. Bilanciamento della frenata a 70%. La temperatura è bassa, quindi monteremo le gomme a mescola media. Sii prudente durante i primi giri e ricorda di guidare con precisione nelle curve veloci.
