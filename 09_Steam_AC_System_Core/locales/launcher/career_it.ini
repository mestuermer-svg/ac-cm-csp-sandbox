series2=Congratulazioni per aver sbloccato la Novice Series 2! </br></br>Hai fatto bene durante la prima serie quindi ora è arrivato il momento di guidare macchine a trazione posteriore. La BMW produce alcune delle più pregiate sportcar che ti aiuteranno a migliorare la tua tecnica di guida poiché non sono solamente veloci e emozionanti, ma anche facili da guidare se portate al limite. <br/><br/> Vinci almeno <strong>2 medaglie di bronzo e una di argento</strong> per completare con successo questa serie.
series2_event1=Sei appena entrato nel mondo della BMW ed hai ora la possibilità di gareggiare contro alcune delle più famose macchine di questo marchio. Facciamo qualche giro in casa delle auto tedesche, il circuito del Nurburgring. Per entrare nel BMW Challenge dovrai raggiungere i 1200 punti nel seguente time attack: sei pronto?
series2_event2=Un club BMW sta organizzando delle divertenti gare tra i suoi iscritti. Visto che hai dimostrato grandi abilità, sei stato invitato a partecipare come ospite e ti è stata consegnata una BMW Z4 35is. Non è la BMW più veloce tra quelle in griglia, ma può difendersi nei lunghi rettilinei di Monza.
series2_event3=Seconda gara del club BMW. Hai a disposizione la piccola ma leggendaria M3 E30. Quest'auto ha una grande agilità ma è carente di potenza. Il Nurburgring GP non ha lunghi rettilinei, quindi potresti avere delle possibilità contro auto più moderne.
series2_event4=Hai provato la madre di tutte le M3 ed ora è giunto il momento di guidare il modello più recente. Il telaio è fantastico e il rombante V8 fornisce una potenza tremenda. Fai del tuo meglio, anche se realisticamente ci aspettiamo che tu salga sul podio.
series2_event5=Anche se la nuova M3 porta questo nome, molti pensano che la più leggera, più corta e più agile 1M series Coupé sia la vera discendente della M3 originale. Ha meno potenza, ma la maggior coppia e il motore turbo possono renderla più nervosa se portata al limite. Hai le qualità per raggiungere un altro podio?
series2_event6=Che risultato sensazionale! La BMW Motorsport ti stava tenendo d'occhio ed ora ti sta offrendo la possibilità ti provare una vera auto da corsa! La gloriosa BMW Z4 GT3 è a tua disposizione per un time attack. Fanne buon uso.
series20=Benvenuto nel team McLaren GT3!</br></br> Il programma endurance McLaren GT3 promuove i migliori giovani piloti con la partecipazione ad un intero campionato endurance.</br></br> Il team si aspetta almeno <strong> 60 punti nel campionato.</strong>
series20_event1=Il campionato endurance inizia con il Nurbugring GP. Il tuo ingegnere di pista suggerisce che per questo primo evento la tua McLaren MP4-12C GT3 abbia un assetto stabile. Utilizza gomme a mescola media e abbassane la pressione di 2 click. Ala posteriore a 6 ed accorcia leggermente il rapporto finale delle marce. Cerca di concludere la gara senza danni, perché il campionato è lungo e potrai spingere davvero solo quando ti sarai abituato al comportamento di questa vettura.
series20_event2=Vallelunga può essere visto come un tracciato stop-and-go. Proviamo a fare un assetto per una guida più aggressiva. Ala anteriore su 1 e posteriore su 5. Abbassa la pressione delle gomme anteriori di 2 click e quelle posteriori di un solo click. Irrigidisci la barra anti-rollio posteriore di un click e forse vorrai spostare il bilanciamento della frenata di un click verso il posteriore. Prova una modifica alla volta e vediamo il risultato. Se hai problemi in uscita dalle curve lente, prova a utilizzare un livello 6 o 7 di traction control.
series20_event3=Silverstone ha alcune curve molto impegnative ed è nota per essere aggressiva sul consumo degli pneumatici. Monta gomme a mescola media con pressioni standard. Dato che qui la velocità di punta non è importante tanto quanto l'aderenza ad alte velocità, ti suggerisco di tenere le ali sui valori standard. Forse irrigidire di 2 click la barra anti-rollio anteriore può stabilizzare la vettura. Se dovessi avere problemi di frenata entrando in curva, muovi il bilanciamento dei freni di 2 click verso l'anteriore. Anche questa volta accorcia di un click il rapporto finale delle marce.
series20_event4=Il Mugello è un circuito faticoso per le gomme, pilota ed assetto. Se la temperatura è troppo alta, potresti dover usare gomme a mescola dura. Utilizza ala anteriore a 0 e posteriore a 4 per ottimizzare la velocità di punta sul lungo rettilineo. Abbassa le molle anteriori di 2 click e quelle posteriori di 4 click per far lavorare meglio il diffusore. Setta il differenziale in power a 20% per avere una vettura più veloce e controllabile nelle curve lunghe. Il bilanciamento della frenata a 73 stabilizzerà la vettura in frenata. Accorcia di un click la 6° marcia.
series20_event5=Imola è un circuito molto difficile. Gli ammortizzatori dovranno lavorare bene per poter saltare sui cordoli mantenendo una certa stabilità. Abbassa la pressione delle gomme di 2 click. Ammortizzatori: estensione anteriore a 12, compressione a 15. Compressione posteriore a 5 e compressione veloce a 30. Corsa posteriore a 70. Barra anti-rollio posteriore a 0. Differenziale in power a 40%. Accorcia di un click il rapporto finale delle marce.
series20_event6=Monza consiste in velocità di punta e agilità nelle lente chicane. Partiamo con ali A-P rispettivamente a 0-1. Altezza delle sospensioni anteriori a 24 e quelle posteriori a 21. Utilizza gomme a mescola dura con pressioni anteriori a 29 e posteriori a 27. Occhio al surriscaldamento. Barra anti-rollio anteriore a 7, posteriore a 0. Porta il bilanciamento della frenata a 71 per maggior stabilità entrando in curva. Fai attenzione alla partenza della gara perché è facile essere coinvolti in incidenti alla prima chicane.
series20_event7=Spa è un tracciato completo di curve lente e veloci tanto quanto Silverstone, ma qui vanno aggiunte delle fantastiche colline e la necessità di raggiungere un'alta velocità di punta a fronte di lunghissimi rettilinei. Inizia con ala anteriore a 0 e posteriore a 4. Barra anti-rollio anteriore a 7, per incrementare la stabilità. Forse dovrai montare gomme a mescola dura e in tal caso abbassa le pressioni di 3 click. Riduci di un click la 6° marcia e porta il bilanciamento della frenata a 72%.
series21=Benvenuto nel team ufficiale McLaren GT3!</br></br> Il programma McLaren GT3 Extreme richiede dedizione totale lungo tutta la stagione endurance. Durante i weekend di gara dovrai dare il massimo anche nelle sessioni di pratica e qualifica.</br></br> Il team si aspetta almeno<strong> 60 punti nel campionato.</strong>
