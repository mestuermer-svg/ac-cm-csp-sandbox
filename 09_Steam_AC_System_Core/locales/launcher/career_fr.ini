series19_event2=Vallelunga est un circuit assez sûr, permettant des réglages plus risqués pour repousser la vitesse de pointe ainsi que dans les virages. Réglez les ailes avant et arrière sur 0-4. Réglage de la répartition de freinage sur 74 % car la voiture est toujours un peu nerveuse au freinage. Taux de la roue avant sur 200 et ARB avant sur 6. Les sorties de virage peuvent tout de même s'avérer problématiques, mieux vaut donc définir le contrôle de traction sur le niveau 5-7.

series19_event3=Silverstone est un circuit très difficile, mieux vaut privilégier la sécurité. Je suggère de régler les ailes avant et arrière sur 1-6, l'ARB avant sur 8 et la répartition de freinage avant sur 74. Il fait froid, vous devriez donc pouvoir courir avec des pneus moyens, mais il reste le risque de surchauffe. Si vous rencontrez des problèmes, mettez des pneus durs et baissez la pression de 3 crans.

series19_event4=Sur Mugello, il faut gérer le train arrière particulièrement nerveux du véhicule tout en optimisant la vitesse dans les virages moyens. Commençons par régler les ailes avant et arrière sur 1-6. Nous allons tenter de rigidifier l'ensemble pour mieux charger les pneus. Course de déplacement avant sur 40. ARB avant sur 10, hauteur avant sur 8. Course de déplacement arrière sur 70. Taux de roue arrière sur 90, train arrière sur 20. ARB arrière sur 6. Pneus durs 24-25 à l'avant et à l'arrière. Allez-y doucement lors du premier tour, laissez les pneus chauffer correctement avant de mettre la gomme.

series19_event5=Comme toujours avec Imola, il faut travailler sur l'amortissement pour mieux négocier les bordures. Réglez les ailes avant et arrière sur 1-6. Course de déplacement arrière sur 70. ARB avant sur 6, et arrière sur 0. Amortisseur de butée arrière sur 10, réglages de bosse rapide sur 34 et rebond rapide arrière sur 25. 74 % pour la répartition de freinage avant. Pneus moyens sur 23-22 à l'avant et à l'arrière. Un contrôle de traction de 7 fera parfaitement l'affaire.

series19_event6=Le moteur de la BMW est formidable, et nous devrions optimiser l'aérodynamisme en abaissant l'aile arrière autant que possible. Réglez l'aérodynamisme sur 0-3 à l'avant et à l'arrière. Privilégiez les pneus durs, avec une pression de 29-25 à l'avant et à l'arrière. Une répartition de freinage avant de 79 % pour stabiliser la voiture autant que possible lors des freinages. ARB sur 5, taux de roue avant sur 190. Hauteur avant sur 10, hauteur arrière sur 28, ARB arrière sur 0. Rapport de vitesse plus long défini sur 10-47. Niveau de commande de traction sur 8.

series19_event7=Voici la dernière course sur Spa Francorchamps. Nous devons impérativement obtenir un bon résultat, quitte à faire des réglages un peu risqués. Gardons les pneus moyens et réglons les ailes avant et arrière sur 0-4. Avec un contrôle de traction de 7, vous maîtriserez mieux les rotations de vos roues en sortie de virage. Réglez le taux de vos roues avant sur 200 pour mieux entrer dans les virages et rester stable lors des freinages. Hauteur avant sur 6 et arrière sur 26 pour maintenir l'activité du diffuseur. Enfin, réglage de la répartition de freinage sur 74 % à l'avant. La voiture ne sera pas facile à manier, mais vous irez très vite ! C'est parti !

series19_name=Série BMW Z4 GT3 Extrême
series1_event1=La petite Abarth 500 EsseEsse est une voiture d'entrée de gamme. Pour des courses amusantes et sans risques. Entraînez-vous au contre la montre du circuit Vallelunga Club pour vous préparer à votre première course.

series1_event2=Le club Abarth local organise une petite course simple. Affichez vos talents dans cette compétition rapide en trois tours.

series1_event3=Vous avez gagné la confiance des autres coureurs. Un ami vous offre son Alfa Romeo Giulietta QV pour un contre la montre au circuit Magione, prouvez-lui que vous en êtes digne !

series1_event4=Vous avez été formidable, et vous allez pouvoir faire chauffer l'Alfa Romeo Giulietta QV dans une course locale à Magione. Méfiez-vous des pilotes locaux, leurs petites Abarths sont équipées de pneus, de suspensions et de moteurs haut de gamme. À vous de faire vos preuves dans cette course en 5 tours.

series1_event5=Le circuit Magione a la particularité d'être en terre battue. Vous allez pouvoir tester une BMW M3 E30 tunée sur une surface en terre offrant beaucoup moins d'adhérence. Attention aux points de freinage et au survirage.

series1_name=Série Novice 1
series2=Bravo, la deuxième série Novice est débloquée ! </br></br>Vous avez bien réussi la première série, le moment est venu de monter en grade et de piloter de vrais véhicules à propulsion. BMW produit des voitures de sport haut de gamme qui, en plus d'être rapides et trépidantes, sont faciles à pousser à l'extrême limite pour parfaire sa technique. </br></br>Gagnez<strong> 2 médailles de bronze et 1 médaille d'argent</strong> pour réussir cette série.

series20=Bienvenue dans l'équipe McLaren GT3 !</br></br> Le programme d'endurance McLaren GT3 donne une chance aux meilleurs nouveaux pilotes dans une saison de championnat d'endurance complète.</br></br> L'équipe compte sur vous pour obtenir au moins<strong> 60 points lors du championnat.</strong>

series20_event1=C'est le début du championnat d'endurance Nürburgring GP. Votre technicien de course vous suggère d'opter pour des réglages sûrs sur votre McLaren MP4 12C GT3 pour la première course. Utilisez des pneus moyens et réduisez la pression de chacun d'entre eux de 2 crans. Réglez votre aile arrière sur 6 avec un rapport de dernière vitesse légèrement inférieur. Essayez de ne pas endommager la voiture, le championnat est long et nous monterons en puissance à mesure que vous prendrez vos marques.

series20_event2=Vallelunga est un circuit de type stop-and-go. Tentons un réglage plus agressif. L'aile avant sur 1 et arrière sur 5. Pression des pneus avant 2 crans en dessous et 1 cran en dessous à l'arrière. 1 cran au-dessus pour l'ARB arrière, et pourquoi pas 1 cran au-dessus pour la répartition de freinage arrière. Essayez un réglage à la fois. Si vous avez des problèmes à sortir des virages lents, utilisez un contrôle de traction de 6 ou 7.

series20_event3=Silverstone comporte des virages très difficiles à négocier et a tendance à brûler les pneus. Maintenez la pression par défaut sur le réglage moyen. Il est moins important d'aller très vite sur ce circuit que d'avoir de l'adhérence à grande vitesse. Par conséquent, je vous recommande de conserver les réglages d'aérodynamisme par défaut. Peut-être 2 crans au-dessus pour l'ARB avant afin de stabiliser la voiture. Si vous rencontrez toujours des problèmes pour freiner en entrant dans les virages, rajoutez 2 crans à la répartition de freinage avant. Finissez par un cran en-dessous pour le rapport de dernière vitesse.

series20_event4=Mugello est un circuit difficile, tant du point de vue des pneus, du pilote et des réglages. Si la température est trop élevée, il est sans doute préférable d'opter pour des pneus durs. Réglez l'aile avant et arrière sur 0-4 pour optimiser la vitesse de pointe en ligne droite. Avec un taux de roue inférieur de 2 crans à l'avant et de 4 crans à l'arrière, vous abaisserez la voiture et améliorerez le fonctionnement du diffuseur. Réglez la puissance différentielle sur 20 % pour accélérer la voiture et la rendre plus maniable dans les virages longs. Avec une répartition de freinage réglée sur 73, votre voiture sera stabilisée lors des freinages. Réduisez le sixième rapport d'un cran.

series20_event5=Imola est un circuit assez difficile. Les amortisseurs nécessitent des réglages poussés pour pouvoir rester stables entre les bordures. Réduisez la pression des pneus moyens de 2 crans. Amortisseur de rebond avant sur 12, rebond avant sur 15. Butée arrière sur 5. Butée rapide arrière sur 30. Course de déplacement arrière sur 70. ARB arrière sur 0. Puissance différentielle sur 40 %. Rapport de dernière vitesse un cran en-dessous.

series20_event6=Sur Monza, vous devrez optimiser la vitesse de pointe tout en sachant négocier les chicanes lentement. Commençons par 0-1 pour les ailes avant et arrière. une hauteur de suspension de 24-21 à l'avant et à l'arrière. Utilisez des pneus durs avec des pressions de 29-27 à l'avant et à l'arrière. Attention au risque de surchauffe. ARB avant sur 7. ARB arrière sur 0. Augmentez la répartition de freinage avant à 71 pour plus de stabilité en entrée de virage. Attention au début de la course, les accidents sur la première chicane sont nombreux.

series20_event7=Spa est un circuit complet pourvu de virages à la fois lents et rapides, très similaire à Silverstone mais offrant en prime des collines époustouflantes et des lignes droites sur lesquelles se lancer à toute vitesse. Commencez par régler vos ailes avant et arrière sur 0-4. Puis l'ARB sur 7 pour reprendre de la stabilité. Vous devrez peut-être utiliser des pneus durs, auquel cas vous devrez réduire la pression de 3 crans. 1 cran en-dessous pour un rapport plus court sur la sixième vitesse. Répartition de freinage avant de 72 %.

series20_name=Série McLaren MP4 GT3
series21=Bienvenue dans l'écurie d'usine McLaren GT3 !</br></br> Le programme McLaren GT3 Extreme requiert un investissement total sur une saison d'endurance complète. Lors des week-ends de course, vous devrez prendre le dessus dans la compétition comme dans les séances d'entraînement et de qualification.</br></br>L'équipe compte sur vous pour obtenir au moins<strong> 60 points lors du championnat.</strong>

