series27_name=Ferrari 458 GT2 Extrême
series28=L'apogée du sport automobile !</br></br> Les superbes voitures de course d'hier sont toujours puissantes et flamboyantes. Grâce à la passion de leurs propriétaires, elles sont toujours là aujourd'hui, pilotées par des professionnels respectant leur valeur et connaissant leurs limites.</br></br>Obtenez<strong> 3 médailles de bronze, 2 médailles d'argent et 1 médaille d'or</strong>.

series28_event1=La Classic Team Lotus vous a demandé de piloter sa Lotus type 49 parfaitement conservée. Cette voiture est un véritable exploit technique dans l'histoire de la F1. Sa puissance et sa légèreté sont exceptionnelles. Étonnamment, il est possible d'effectuer des drifts dans les virages, mais faites attention aux distances de freinage. La vitesse de pointe élevée et l'absence d'ABS vous contraindront à commencer votre freinage beaucoup plus tôt que d'habitude.

series28_event2=Piloter laClassic Team Lotus type 49 est certainement une expérience très enrichissante. Mais imaginez-vous derrière le volant à Monza en 1967. Bien que similaire, le circuit n'avait pas de chicanes de ralentissement à l'époque. Fermez les yeux et faites un voyage dans le passé, à une époque où il était très dangereux de piloter mais chacun était libre de... enfin vous avez compris.

series28_event3=Avec la Ferrari 312T, Niki Lauda et Clay Regazzoni ont conquis le championnat en 1975, faisant la gloire des pilotes et du constructeur. Aujourd'hui, prenez le volant de cette machine de légende et revivez ces affrontements épiques.
series28_event4=Le programme client Lotus Exos se rend à Silverstone pour une séance d'essai. Ils est demandé aux pilotes professionnels de les essayer avant de les confier aux clients propriétaires. Poussez la Lotus Exos jusqu'à l'extrême limite et impressionnez les clients potentiels.

series28_event5=Vos performances récentes sur l'Exos 125 à Silverstone ont convaincu l'écurie Lotus de vous convier à une course, au volant d'une Lotus Exos 125 S1 tunée. La course aura lieu sur le circuit de Mugello, et vous aurez un week-end devant vous pour régler la voiture et vous surpasser. Bonne chance !
series28_event6=La Classic Team Lotus est impressionnée par vos dernières performances. Elle est prête à vous confier une voiture d'une valeur inestimable. La Lotus 98T pilotée par Ayrton Senna en 1985, à la célèbre époque des turbos ayant produit les Formules 1 les plus puissantes, capables de dépasser les 1 000 chevaux pendant les qualifications. Seuls les meilleurs peuvent rester maîtres d'une telle voiture en la poussant jusqu'à la limite. Ferez-vous la différence ?
series28_name=Formule
series2_event1=Vous venez d'entrer dans le monde de BMW, et allez pouvoir vous mesurer à certains des véhicules les plus emblématiques de la marque. Je vous propose de vous entraîner en plein cœur du sport automobile allemand, au Nürburgring. Pour rejoindre le défi BMW, vous devez obtenir au moins 1 200 points au contre la montre suivant : êtes-vous prêt ?

series2_event2=Le club BMW club organise des courses pour divertir ses membres. Étant donné le talent dont vous faites preuve, vous avez été invité, avec en prime une BMW Z4 35is à conduire. Bien qu'elle se mesure à d'autres BMW plus rapides qu'elle, ses performances sont tout à fait honorables sur les grandes lignes droites de Monza.

series2_event3=Voici la deuxième course en club BMW. Vous êtes au volant de la petite mais légendaire M3 E30, une voiture extrêmement maniable mais à la puissance limitée. Le Nürburgring GP présentant peu de lignes droites, vous avez toutes vos chances face aux véhicules plus récents.

series2_event4=Après avoir piloté la légende des M3, passons à sa variante la plus rapide, caractérisée par un châssis extraordinaire et un V8 tonitruant à la puissance fulgurante. À vous de jouer - nous espérons vous voir monter sur le podium.

series2_event5=La M3 porte certes un nom emblématique, mais pour de nombreux amateurs, la digne héritière de la M3 originale est la série 1M Coupé, plus légère, plus courte et plus maniable. Moins puissante, elle dispose pourtant de plus de couple, avec un turbo qui s'avère plus difficile à gérer à pleine vitesse. Serez-vous capable de monter à nouveau sur le podium ?

series2_event6=Quelle performance époustouflante ! Vos exploits n'ont pas échappé à BMW Motorsport, qui vous propose de faire un tour d'essai dans une vraie voiture de course ! La superbe BMW Z4 GT3 est à vous le temps d'un contre la montre. Faites-en bon usage.

series2_name=Série Novice 2
series3=Félicitations ! Vous venez de faire votre entrée en troisième série Novice. </br>Un célèbre petit fabricant autrichien a suivi vos performances sur BMW. KTM, dont la réputation n'est plus à faire en matière de deux roues, est également à l'origine de l'un des bolides les plus extrêmes et les plus avancés du moment. La KTM X-Bow R est à vous le temps de disputer une série de courses.</br></br>Gagnez<strong> 2 médailles de bronze et 1 médaille d'argent</strong> pour impressionner les ingénieurs de KTM.

series3_event1=Bienvenue dans l'univers des voitures ultra-légères. La KTM X-BOW-R est considérée comme étant l'une des machines les plus survoltées de sa catégorie. Vous allez pouvoir tester sa maniabilité et ses performances sur l'un des circuits les plus difficiles : l'Autodromo « Enzo e Dino Ferrari » d'Imola.

series3_event2=KTM organise une course pour ses membres. En tant qu'invité, vous avez reçu une KTM X-BOW R. Classez-vous au moins à la troisième place pour gagner cette voiture et prendre part au défi X-BOW R !

series3_event3=Vous venez de démontrer votre talent au circuit Vallelunga Club, et vous êtes mûr pour la catégorie Grand Prix. La X-BOW R est taillée sur mesure pour le circuit romain. Le virage Campagnano est parfait pour les dépassements, ne l'oubliez pas !

series3_event4=Dernière chance de gagner votre propre X-BOW R. La piste courte du Nürburgring n'a aucun secret pour vous. Ne manquez pas cette opportunité d'être vainqueur !

series3_event5=Vous êtes désormais propriétaire d'une X-BOW R et pouvez défier les adversaires se mesurant à vous. À moins que vous n'ayez peur, évidemment...

series3_name=Série Novice 3
series4=Bienvenue à la quatrième série Novice.</br></br>Vos performances incroyables au volant de la KTM n'ont pas laissé indifférent. La X-BOW est formidable et innovante, mais la marque est spécialisée en véhicules légers.<strong>Lotus</strong> veut s'offrir vos services, mais vous allez devoir perfectionner votre conduite sur moteur central.</br></br>Gagnez<strong> 3 médailles de bronze et 1 médaille d'argent </strong>dans cette série.

series4_event1=Lotus. Peu de marques peuvent rivaliser avec son histoire légendaire. On vous propose d'essayer son modèle de course léger d'entrée de gamme. Si vos performances sont bonnes, vous pourrez participer à de nombreux évènements Lotus en tant que pilote invité.

series4_event2=Bravo ! Vous pouvez passer à l'Exige 240R, au maniement très similaire. Mais attention, elle va beaucoup plus vite ! Vos adversaires sont de grands amateurs de Lotus, certains sont même pilotes professionnels. La tâche ne sera pas facile.
series4_event3=Une course de club se tient au circuit international de Silverstone. Pour la plupart des amateurs, l'Evora n'est qu'un véhicule Gran Turismo, mais avec une Lotus Evora S2 légèrement tunée, vous serez armé pour combattre et imposer votre style.

series4_event4=Les ingénieurs de Lotus veulent tester les limites de la Lotus Exige S. Un nom loin d'être inconnu, mais le châssis flambant neuf est désormais pourvu d'un puissant V6. Mettez le pied au plancher dans ce contre la montre et poussez cette voiture à l'extrême limite.

series4_event5=Grâce à vos excellentes performances lors du contre la montre, vous avez décroché le droit de piloter une Lotus Exige V6 Cup le temps d'une course. Vos adversaires sont expérimentés et produiront du haut niveau. Ils ne vous feront aucun cadeau.

series4_event6=Comme chaque année, le Trofeo Lotus 2-11 fait escale au circuit Magione. Vous êtes convié, mais attention. La 2-11 est pourvue d'un différentiel ouvert, ce qui peut faire énormément patiner la roue arrière intérieure dans les virages serrés du circuit italien. Vous serez ralenti et userez vos pneus si vous ne faites pas attention. Il est essentiel que votre technique soit irréprochable.

series4_event7=Les ingénieurs de Lotus croient en vous pour faire évoluer leur voiture GTC. On vous demande d'effectuer un contre la montre au volant d'une voiture de course Lotus Evora GTC flambant neuve sur le circuit très difficile d'Imola. Il fait très chaud, attention à la surchauffe. Réglez votre véhicule en fonction de vos besoins et repoussez les limites !

series4_name=Série Novice 4
series5=Félicitations, vous venez de passer à la première série intermédiaire !</br></br>Avec d'aussi bonnes performances pour une marque telle que Lotus, il est logique que vous attiriez l'attention... Malgré tout, quand on décroche son téléphone et qu'on tombe sur McLaren à l'autre bout du fil, difficile de garder son sang froid. </br></br>Gagnez<strong> 2 médailles de bronze et 1 médaille d'argent</strong> et prouvez que vous êtes à la hauteur !

series5_event1=Un club de course Supersport organise des compétitions d'amateurs sur divers circuits européens. McLaren a besoin d'un conducteur expert en course de rue pour repousser les limites de sa nouvelle McLaren MP4 12C et promouvoir les qualités de ce superbolide. La première course aura lieu sur le circuit de Vallelunga.

series5_event2=La deuxième course Supersport a lieu à Mugello. Ce circuit italien, propriété de Ferrari, est l'un des plus difficiles avec ses longs virages rapides montants et descendants. La simple présence d'une McLaren sur le circuit de Ferrari ne laisse pas indifférent.

series5_event3=La série Supersport arrive sur le circuit de Nürburgring. Les fabricants allemands devraient être présents en nombre avec leurs bolides habituels, avec deux surprises en prime.

series5_event4=Silverstone n'a plus de secrets pour McLaren. Ce circuit comporte pourtant des séquences gauche-droite très rapides qui pousseront la voiture dans ses retranchements. Attention aux véhicules britanniques, plus légers, qui useront moins leurs pneus et seront susceptibles de revenir en fin de course.

series5_event5=Monza est un sanctuaire de vitesse, avec les lignes droites les plus rapides de tous les circuits de Formule 1. Dans la McLaren, votre cadence sera vertigineuse, mais n'oubliez pas qu'avec des pneus règlementaires, mieux vaut soigner ses distances de freinage. On m'a aussi confié que des Ferraris pourraient participer.

series5_name=Série Intermédiaire 1
series6=Deuxième série intermédiaire !</br></br>Ça ne va faire que s'améliorer, désormais. Mercedes Benz vous offre l'une des voitures les plus emblématiques de tous les temps. L'AMG SLS doit être pilotée par quelqu'un capable de la pousser au-delà de ses limites. En serez-vous capable ? </br></br>Gagnez<strong> 2 médailles de bronze et 1 médaille d'argent</strong> pour terminer la série des Flèches d'Argent.

series6_event1=Mercedes Benz organise des courses de club ouvertes pour ses clients. La marque vous offre une Mercedes SLS AMG toute neuve. Premier évènement, le Nürburgring GP.

series6_event2=C'est sur le circuit d'Imola que se tiendra le deuxième évènement du club Mercedes. La SLS AMG est une voiture très performante, mais Imola est toujours aussi dangereux : faites très attention entre les bordures.

series6_event3=Il fait généralement froid sur le circuit de Silverstone. N'oubliez pas de chauffer vos pneus tout en évitant la surchauffe dans les virages les plus rapides.

series6_event4=Spa Francorchamps est un circuit exceptionnel. Puissance, anticipation, habileté et adhérence y sont les maîtres mots. Aucun problème pour la Mercedes SLS AMG, qui devrait dominer le parcours entre vos mains. Mais vos adversaires sont coriaces et connaissent bien Spa.

series6_event5=Aucun circuit n'a de lignes droites plus longues que Monza. Un circuit sur lequel la SLS AMG peut filer à cœur joie.

series6_name=Série Intermédiaire 2
series7=Bravo ! La troisième série intermédiaire est débloquée.</br></br>Ferrari ! La plus grande marque automobile du monde. Elle se fait assez rare en compétition, mais il lui arrive d'envoyer l'élite des pilotes la représenter... et vous êtes l'heureux élu ! C'est le moment où jamais de vous faire remarquer. </br></br>Gagnez<strong> 2 médailles de bronze et 2 médailles d'argent.</strong>

series7_event1=Un célèbre magazine automobile a suivi votre parcours et souhaite vous recruter pour effectuer ses essais de voitures exotiques. C'est là une opportunité formidable de rencontrer les fabricants de ces véhicules. Un premier essai est prévu à Imola sur la superbe Ferrari 458 Italia.

series7_event2=Un essai collectif de superbolides est organisé à Monza. L'excellente maniabilité de la Ferrari 458 jouera en votre faveur, mais vous allez vous mesurer à d'autres véhicules ultra-performants de puissance équivalente ou même supérieure. Et comme vous le savez, sur Monza, la puissance, ça compte.

series7_event3=Les pneus surchauffent rapidement sur Spa, mais heureusement, la température ambiante faible leur permet en général de refroidir. Reste qu'il ne sera pas évident de faire 4 tours de ce long parcours avec des pneus de course de rue.

series7_event4=Ce circuit, détenu par Ferrari, est très éprouvant pour les pneus, la voiture et le pilote. Les équipes du Trofeo Ferrari sont venues vous regarder. Si vous les impressionnez, vous aurez peut-être droit à une saison dans le Trofeo Ferrari 458 S3.

series7_name=Série Intermédiaire 3
series8=Bienvenue au Trofeo national Lotus léger.</br></br>Bien qu'il soit agréable de disputer des courses entre amateurs, rien ne vaut un championnat entier face à d'autres pilotes chevronnés à bord de voitures similaires. </br></br>Obtenez<strong> 20 points dans le championnat</strong> pour débloquer la série suivante.

series8_event1=Le Trofeo national Lotus léger commence à Magione. Ses virages en épingle et ses chicanes conviennent parfaitement à la très agile Lotus 2-11. Mais attention à son différentiel arrière ouvert. Ne forcez pas trop dans les sorties si vous ne voulez pas voir apparaître des granules ou des boursouflures au niveau des pneus arrières.

series8_event2=Monza est un autre circuit idéal pour la Lotus 2-11. Ses chicanes sont taillées sur mesure pour la maniabilité de cette voiture. Attention tout de même à bien rabaisser l'aile arrière pour réussir vos aspirations et vos dépassements sur les grandes lignes droites. Une déportance basse peut nuire fortement à la manœuvrabilité d'un véhicule au niveau d'Ascari et de Parabolica.

series8_event3=L'un des circuits les plus difficiles du monde. Slalomez entre les bordures, freinez sur des surfaces inégales, négociez des virages en dévers. Ce parcours est un véritable piège à chaque virage, et vos adversaires n'ont qu'une envie, c'est de vous voir cartonner... à vous de les décevoir. 
series8_event4=Mugello n'est qu'une succession de virages rapides et de collines élevées. Un circuit ultra-rapide qui requiert de la précision et du courage. Il s'agit de la dernière course de la série, réussissez-la pour rester en tête de classement !
series8_name=Trofeo Lotus léger
series9=Le Trofeo Ferrari 458 est débloqué !</br></br> Un pilote de votre envergure ne peut pas se contenter de courses en amateur. Le moment est venu pour vous d'affronter d'autres gentleman-drivers. Le Trofeo Ferrari 458 est l'une des courses à marque unique les plus prestigieuses du monde, les opportunités au sein d'équipes professionnelles étant nombreuses pour les pilotes. </br></br>Obtenez<strong> 15 points dans le championnat</strong> pour impressionner les écuries.

series9_event1=Le Trofeo Ferrari 458 S3 commence à Monza. Avec quasiment 600 chevaux, peu de résistance aérodynamique et beaucoup d'accélération, cette voiture atteint des vitesses de pointe impressionnantes. Surveillez bien vos distances de freinage, même avec des pneus slick.

series9_event2=Le faible poids de la 458 S3 peut poser problème dans les virages rapides et cahoteux de Mugello. Restez loin des bordures pour minimiser les risques.

series9_event3=Le nouveau circuit de Silverstone offre une surface parfaitement lisse, idéale pour la Ferrari 458 S3. Mais vous irez très vite dans certains virages et chicanes, et devrez faire preuve d'une concentration totale.

series9_event4=Le célèbre circuit de Spa Francorchamps. Évitez les sorties de piste dans le virage Eau Rouge. Les autres virages sont difficiles mais pas impossibles.

series9_event5=Imola est un circuit très technique. Soyez prudent dans la zone de freinage descendante du virage Rivazza. Il est peut-être préférable d'accélérer légèrement du côté droit avant d'attaquer la descente, puis de piler à l'aide de l'ABS pour stabiliser la voiture.

series9_event6=Le Nürburgring GP n'offre certes pas la même ambiance, et n'est pas aussi long que le Nordschleife, mais il n'en reste pas moins un parcours difficile. Avec au moins 3 points de dépassement, il est essentiel de disposer d'une voiture restant stable lors des freinages.

series9_name=Trofeo Ferrari 458
