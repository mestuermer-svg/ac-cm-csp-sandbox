[TEXT]
series1=Bienvenue au mode Carrière Assetto Corsa.<br/><br/> Vous vous voyez sans doute déjà au volant d'une Ferrari 458 GT2, mais vous avez encore du chemin à faire avant de devenir pilote professionnel. Commencez pas une jolie petite Abarth 500 EsseEsse. La petite Abarth n'est certes pas très rapide en ligne droite, mais elle négocie habilement les virages serrés. Saurez-vous exploiter son potentiel au maximum en tirant pleinement parti de la traction avant ? <br/><br/>Gagnez au moins<strong> 3 médailles de bronze</strong> pour passer à la série suivante.
series10=Bienvenue au championnat Formula Abarth. </br></br>Ce championnat de monoplace est une étape cruciale pour tout pilote. Faites de bonnes performances et votre place au sein d'une équipe professionnelle est quasiment assurée. </br></br>Obtenez<strong> 40 points dans ce championnat</strong> pour impressionner les écuries.

series10_event1=La championnat CSAI Formula Abarth commence à Magione. Ce circuit très étroit paraît facile à mémoriser, mais il est bien trop cahoteux pour une voiture monoplace. Vous allez sans doute devoir surélever la voiture et installer des suspensions plus souples pour mieux négocier les bosses, les ondulations et les bordures.

series10_event2=Le circuit de Vallelunga offre de nombreuses opportunités de dépassement, mais aussi de se faire dépasser. Deux virages contiennent aussi des surprises nécessitant une ligne de freinage non conventionnelle. Trouvez la ligne qu'il vous faut pour gagner jusqu'à une demi-seconde par tour.

series10_event3=Mugello est l'un des circuits les plus difficiles. Les longs virages rapides requièrent de la déportance, alors que les très grandes lignes droites exigent une vitesse soutenue. À vous de trouver le bon équilibre. Évitez les bordures, car même si elles semblent basses, elles peuvent fortement déstabiliser la voiture à grande vitesse.

series10_event4=La Nürburgring GP est un autre parcours très technique. Des épingles en descente à négocier en 1ère aux chicanes en ligne droite à pleine vitesse, tout est une question de précision et de courage dans les accélérations et les dépassements.

series10_event5=Imola est surnommé le petit Nürburgring. Pour gagner du temps, il faut négocier les bordures à pleine vitesse, bien qu'elles soient difficiles et rabaissées. Même si vous parvenez à effectuer un tour parfait, tiendrez-vous le temps d'une course ?

series10_event6=Silverstone est un circuit complet, offrant des virages lents en épingle comme des virages et des chicanes négociables à pleine vitesse sur le 5ème ou le 6ème rapport ! Des courbes que seuls les pilotes les plus talentueux, les mieux préparés et les plus courageux sauront aborder sans décélérer.

series10_event7=Un circuit très rapide nécessitant un appui bas et des stratégies d'aspiration pour réussir. Rabaissez la voiture pour améliorer les performances du diffuseur, mais évitez les bordures pour ne pas endommager le soubassement.

series10_event8=Dernière course du championnat CSAI Formula Abarth, dernière chance de remporter la saison. Le virage Eau Rouge est sans aucun doute le plus impressionnant, le plus palpitant et le plus dangereux du monde. Sans parler des 7 km restants.

series10_name=Trofeo Formula Abarth
series11=Le Trofeo Ferrari 599XX.</br></br> Le Trofeo 599XX est une série dédiée et uniquement réservée aux propriétaires du programme XX exclusif de Ferrari. Certains pilotes professionnels sont également conviés et observés de près. Les meilleurs ont une chance de décrocher une place à bord d'un engin produit par les équipes Ferrari GT. </br></br>Obtenez<strong> 36 points dans le championnat</strong> pour passer derrière le volant d'une Ferrari GT.

series11_event1=Il n'est pas évident de manier une voiture aussi puissante dans les virages serrés de Magione. Vous feriez mieux d'adopter des pneus mous avec une pression faible. Vous devrez aussi sans doute activer le contrôle de traction pour maîtriser tout excédent de puissance et reprendre le contrôle.

series11_event2=La Ferrari 599XX EVO arrive dans la première chicane descendante extrêmement rapide de Vallelunga à plus de 250 km/h... Ça va vite ! Si vous avez le courage, ou plutôt l'inconscience, de régler votre véhicule dans l'optique de foncer dans ce virage, vous n'aurez plus assez de traction sur les courbes plus lentes et plus longues. Mieux vaut faire un réglage équilibré, stable et complet.

series11_event3=Des virages longs et rapides, voilà ce qui caractérise Mugello. La 599XX EVO est une voiture très performante, à condition de comprendre et de faire confiance à son aérodynamisme actif. Entrez dans un virage en douceur, puis quand vous sentez l'avant dériver, continuez de tourner et laissez le système électronique comprendre qu'il vous faut plus d'adhérence à l'avant. Vous serez surpris du résultat.

series11_event4=Le Nürburgring GP est un condensé de tous les virages que vous avez connus jusqu'à présent, des épingles lentes avec très peu de traction aux virages ultra-rapides nécessitant de l'adhérence et de la stabilité à l'avant. Bon courage pour trouver le bon réglage.

series11_event5=Imola est difficile à négocier pour les voitures puissantes. Il est essentiel de raser les bordures à pleine vitesse pour faire un bon temps, ce qui peut aussi s'avérer problématique quand on développe plus de 750 chevaux depuis le train arrière... Pensez à tourner votre manettino pour sélectionner le niveau de contrôle de traction adéquat.

series11_event6=Vous devez à présent connaître le fonctionnement du système électronique 599XX et de l'aérodynamisme actif. Si vous êtes satisfait de leur fonctionnement et que vous savez les utiliser, le circuit de Silverstone conviendra parfaitement à cette voiture. Il fait froid  mais la piste fait surchauffer les pneus, donc choisissez-les avec soin.

series11_event7=Déchaînez 750 chevaux de puissance sur les lignes droites de Monza et préparez-vous à largement dépasser les 300 km/h ! Mais attention, à une telle vitesse, des distances de freinage très longues sont nécessaires, et les chicanes de Monza sont très étroites et difficiles à négocier. Et faites attention à la chaleur étouffante, mieux vaut privilégier les pneus durs.

series11_event8=Il fait froid, l'adhérence est faible, les virages sont les plus époustouflants du monde. Bienvenue à Spa Francorchamps. Avec des pneus mous, vous aurez plus d'adhérence, mais pour combien de temps ? C'est la dernière course de la saison, ne ratez pas votre coup.

series11_name=Trofeo Ferrari 599XX Evo
series12=Voici le Trofeo Ferrari 458 Advanced !</br></br> Un pilote de votre envergure ne peut pas se contenter de courses en amateur. Le moment est venu pour vous d'affronter d'autres gentleman-drivers. Le Trofeo Ferrari 458 Trofeo Advanced dure un week-end entier et  vous permet de disputer des courses longues. </br></br>Obtenez<strong> 30 points dans le championnat</strong> pour impressionner les écuries présentes.

series12_event1=Le Trofeo Ferrari 458 S3 commence à Monza. Avec quasiment 600 chevaux, peu de résistance aérodynamique et beaucoup d'accélération, cette voiture atteint des vitesses de pointe impressionnantes. Surveillez bien vos distances de freinage, même avec des pneus slick.

series12_event2=Le faible poids de la 458 S3 peut poser problème dans les virages rapides et cahoteux de Mugello. Restez loin des bordures pour minimiser les risques.

series12_event3=Le nouveau circuit de Silverstone offre une surface parfaitement lisse, idéale pour la Ferrari 458 S3. Mais vous irez très vite dans certains virages et chicanes, et devrez faire preuve d'une concentration totale.

series12_event4=Le célèbre circuit de Spa Francorchamps. Évitez les sorties de piste dans le virage Eau Rouge. Les autres virages sont difficiles mais pas impossibles.

series12_event5=Imola est un circuit très technique. Soyez prudent dans la zone de freinage descendante du virage Rivazza. Il est peut-être préférable d'accélérer légèrement du côté droit avant d'attaquer la descente, puis de piler à l'aide de l'ABS pour stabiliser la voiture.

series12_event6=Le Nürburgring GP n'offre certes pas la même ambiance, et n'est pas aussi long que le Nordschleife, mais il n'en reste pas moins un parcours difficile. Avec au moins 3 points de dépassement, il est essentiel de disposer d'une voiture restant stable lors des freinages.

series12_name=Trofeo Ferrari 458 Advanced
