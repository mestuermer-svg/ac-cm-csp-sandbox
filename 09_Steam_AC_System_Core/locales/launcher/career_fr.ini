series21_name=McLaren MP4 GT3 Extrême
series22=Bravo ! Vous venez d'intégrer l'équipe Mercedes SLS GT3 !</br></br> La Mercedes SLS GT3 est l'une des voitures les plus puissantes et impressionnante de la série. Piloter une Mercedes, c'est l'assurance de faire une belle carrière.</br></br> Obtenez au moins<strong> 60 points dans le championnat.</strong>

series22_event1=La Mercedes SLS GT3 est une voiture très performante, tout droit sortie d'usine. Nous n'apporterons que quelques petites modifications pour améliorer ses performances dans le Nürburgring GP. Commencez par des pneus moyens et baissez la 6ème vitesse de 2 crans. Aérodynamisme réglé sur 1-6 à l'avant et à l'arrière. Répartition de freinage de 70 %. Taux de la roue avant sur 100. Le couple du moteur est si puissant que vous aurez des problèmes sans contrôle de traction, mieux vaut donc définir celui-ci sur 5 ou 6.

series22_event2=Avec un couple aussi élevé et un régime moteur aussi faible, nous devons miser sur la traction dans les virages lents de Vallelunga. Réglage des ailes sur 1-6. Pneus moyens avec une pression de 25-24 à l'avant et à l'arrière. Différentiel libre sur 35 % et répartition de freinage sur 70 %. Taux de roue avant sur 100 et arrière sur 100 également. ARB arrière sur 0. Ce réglage vous fera peut-être sous-virer, mais la traction sera excellente et vous dispensera peut-être même de contrôle de traction.

series22_event3=La rapidité du circuit de Silverstone n'est pas très adaptée aux caractéristiques de notre voiture. Nous allons tenter de la sécuriser sur les virages rapides gauche-droite de Maggots, tout en faisant le moins de compromis possible sur le reste du parcours. Ailes réglées sur 1-7 à l'avant et à l'arrière. Taux de roue avant sur 110, ARB arrière sur 0. Répartition de freinage de 70 %. 1 cran en-dessous pour la 6ème vitesse. Vous allez devoir contrôler votre traction dans les virages lents : je vous suggère le niveau 6 ou 7. Tâchez de bien vous classer.

series22_event4=Mugello est un autre circuit rapide aux virages survoltés. Mais il comporte aussi de très longues lignes droites montantes. Nous allons tenter une conduite offensive sur les lignes droites, et défensive dans les virages. Ailes sur 1-5 à l'avant et à l'arrière. ARB avant sur 6, taux de roue arrière sur 100. Hauteur avant de 2, et arrière de 0. Répartition de freinage sur 70 %. Les pneus durs sont indispensables par temps chaud. Allez-y tranquille lors des premiers tours et prenez les virages rapides avec douceur.

series22_event5=Le circuit d'Imola peut correspondre à notre voiture, à condition de bien négocier les bordures. Essayons un réglage avec une forte déportance pour mieux profiter de notre puissance, de notre couple et plaquer la voiture au sol tout en fonçant entre les bordures. Ailes 1-8 à l'avant et à l'arrière. Pneus moyens avec une pression de 21 à l'arrière. Taux de roue avant de 110 et ARB arrière sur 0. Butée arrière sur 7 et butée rapide sur 30. Répartition de freinage sur 69 %. Passez rapidement entre les bordures mais essayez de redresser le volant en sortie.

series22_event6=Mettons toute cette puissance à contribution. Monza rime avec accélération et grande vitesse. Mieux vaut augmenter la pression avant à 29 pour durcir les pneus. Ailes avant et arrière sur 0-2. Répartition de freinage sur 71 %. Taux de roue avant sur 120, taux de roue arrière sur 105, ARB arrière sur 0. Avec une voiture bien équilibrée et plus de 270 km/h de vitesse de pointe, peu de voitures seront en mesure  de nous suivre.

series22_event7=Spa constitue notre dernière chance de remporter le championnat ! Commençons par le réglage Mugello et voyons si nous pouvons apporter des améliorations. Ailes sur 1-5 à l'avant et à l'arrière. ARB avant sur 6, taux de roue arrière sur 100. Hauteur avant sur 2, et arrière sur 0. Répartition de freinage sur 70 %. Il fait froid, tentons les pneus moyens. Allez-y tranquille lors des premiers tours et accélérez dans les virages rapides.

series22_name=Série Mercedes SLS GT3
series23=Félicitations ! Vous venez de débloquer la Mercedes SLS GT3 Extreme !</br></br> Préparez-vous à une saison d'endurance complète comportant des week-ends de course avec séances d'entraînement et de qualification. L'écurie Mercedes SLS GT3 va avoir besoin de votre collaboration.</br></br> Obtenez au moins<strong> 60 points dans le championnat.</strong>

