series26_name=Série Ferrari 458 GT2
series27=Série Ferrari 458 GT2 Extreme.</br></br> Votre patience et votre investissement dans les petits Trofeos de Ferrari a fini par porter ses fruits. Vous venez de réaliser un rêve en devenant pilote professionnel Ferrari.</br></br> L'écurie s'attend à marquer au moins<strong> 60 points dans le championnat.</strong>
