series16=Hypervoitures niveau 1 débloqué !</br></br> Les propriétaires d'hypervoitures sont bien évidemment très fiers de leurs véhicules. Non contents de collectionner ces voitures pour leur valeur, certains les apprécient également sur la piste. Ils demandent souvent à des pilotes professionnels de les essayer et de les pousser à leur limite, mais seulement sur invitation. Vous avez de la chance. </br></br>Obtenez<strong> 3 médailles de bronze et 2 médailles d'argent</strong> pour terminer cette saison.

series16_event1=La Ferrari F40 est une supervoiture emblématique que certains considèrent toujours comme étant la dernière et la meilleure du genre. Cette version S3 en particulier comporte un moteur réglé en usine à 600 chevaux, avec des pneus slick. Ni ABS, ni contrôle de traction. Qui, entre vous et la voiture, dominera l'autre ?

series16_event2=Pur produit de la recherche-développement de Ferrari, la 599XX est un véritable laboratoire de course, et très rapide, de surcroît. Avec une puissance de 750 chevaux et pourvue du système d'aérodynamisme actif, elle constitue un adversaire de taille. Le circuit Mugello, détenu par Ferrari, est idéal pour cette voiture.

series16_event3=Avec sa puissance inégalée, son aérodynamisme actif et ses pneus slick adhérents, la Ferrari 599XX EVO est l'une des voitures les plus rapides à avoir foulé le bitume du Nordschleife. Il faut être fou pour se mesurer à ce bolide sur ce long parcours. Le Grand Prix  du Nûrburgring, en plus d'être très difficile, constitue une excellente attraction pour tous les amateurs d'hypervoitures.

series16_event4=La Pagani Zonda est déjà l'une des voitures les plus convoitées du monde. La version Zonda R sublime ce qu'il y a de meilleur chez Pagani. Elle est légère, très puissante et colle au bitume. Vous n'aurez jamais vu une telle vitesse sur Silverstone. Mais pourrez-vous affronter d'autres voitures similaires ?

series16_event5=La Pagani Zonda R est si rapide dans les montées et les descentes d'Imola que vous risquez d'en être étourdi. Et les autres hypervoitures qui sont à vos trousses n'arrangeront rien !

series16_event6=Après la très extrême Zonda R, personne ne pensait que Pagani pouvait produire des véhicules homologués en allant encore plus loin. Grosse erreur. La Pagani Huayra dépasse aisément les 300 km/h sur les lignes droites de Monza. Ses 4 volets aérodynamiques indépendants la ralentiront-ils suffisamment avant d'attaquer les chicanes étroites ?

series16_event7=Le plus célèbre des fabricants de voitures de sport prolonge sa légende avec une hypervoiture baptisée LaFerrari. Cette merveille incroyable se base sur une technologie hybride pour déployer 963 chevaux, avec un aérodynamisme actif et un châssis détrônant tous les autres véhicules de cette catégorie. À vous de lui faire honneur dans cette lutte de titans à travers les virages de Spa Francorchamps.

series16_name=Hypervoitures
series17=Bienvenue à la série GT Advanced !</br></br> Vos excellentes performances au volant de diverses voitures vous ont bâti une solide réputation de gentleman driver. Plusieurs équipes détenant des voitures GT3 et même GT2 recherchent des pilotes tels que vous pour conduire leurs bolides. </br></br> Ramassez au moins<strong> 3 médailles de bronze et 2 médailles d'argent </strong>pour impressionner les équipes GT.

series17_event1=Vous avez l'opportunité de piloter la BMW Z4 GT3 au Nürburgring GP. Figurant parmi les GT3 les plus puissantes, la BMW est parfois nerveuse lors des freinages. Freinez en ligne droite et utilisez sa puissance pour faire des sorties rapides.

series17_event2=L'équipe BMW Z4 GT3 vous propose à nouveau une place, cette fois sur le circuit Vallelunga. Le couple élevé de la BMW est idéal pour les accélérations après les épingles de Vallelunga. Si vos pneus s'usent trop vite, réglez votre niveau de traction en conduisant.

series17_event3=Une équipe McLaren MP4 GT3 vous propose de courir sur le circuit de Silverstone à bord de sa voiture. La McLaren est un véhicule très performant, quoique le turbo et la maniabilité extrêmement réactive peuvent s'avérer dangereux. Mieux vaut opter pour un réglage sûr, qui vous ralentira au début mais stabilisera la voiture à mesure que les pneus s'useront.

series17_event4=Voici encore une course à bord de l'ultra-rapide McLaren MP4 GT3, cette fois à Mugello. Ne sous-estimez pas les virages longs et rapides de ce circuit, qui sollicitent énormément les pneus. Mieux vaut relever un peu l'aile arrière par prudence, plutôt que de se contenter d'une aile basse qui vous ferait aller plus vite mais risquerait de vous envoyer tournoyer.

series17_event5=Votre vitesse a impressionné l'équipe Mercedes SLS GT3, et ils vous proposent de piloter leur voiture sur le circuit d'Imola. La Mercedes est très puissante, surtout à bas et moyen régime. Les bordures d'Imola peuvent déstabiliser la voiture et lui faire perdre en traction, et mieux vaut par conséquent régler la traction de manière optimale.

series17_event6=Monza est le circuit rêvé pour la très puissante Mercedes SLS. Même si les courses précédentes n'ont pas été parfaites, vous pouvez désormais rattraper votre retard et marquer des points essentiels. Visez la victoire !

series17_event7=La Scuderia Glickenhaus ne s'adresse habituellement qu'à des pilotes chevronnés, mais elle a décidé de faire une exception. Spa Francorchamps est un circuit très technique. La voiture de course P4/5 Competizione offre beaucoup d'adhérence, mais sa vitesse de pointe laisse à désirer. Il est quasiment impossible de gagner, mais arriverez-vous quand même à vous classer ?

series17_name=Série GT Advanced
series18=Bienvenue à la série BMW GT3 !</br></br> BMW vous souhaite la bienvenue dans son équipe d'endurance GT3. Vous allez passer la saison entière au volant d'une Z4 GT3, avec le soutien du fabricant. </br></br> L'équipe compte sur vous pour obtenir<strong> 60 points lors du championnat.</strong>

series18_event1=La BMW Z4 GT3 est clairement une voiture conquérante. Elle est très sensible aux différents réglages, et pour les premières courses, nous allons privilégier une maniabilité sûre. 1-6 pour les ailes avant et arrière. Réglage de la répartition de freinage sur 74 % à l'avant. Taux de la roue avant sur 200, ARB sur 8. Hauteur inférieure avant sur 7 et arrière sur 30. Différentiel libre sur 60 %. Avec ces réglages, la voiture devrait être suffisamment stable et rapide pour la première course.

series18_event2=Vallelunga est un circuit assez sûr, permettant des réglages plus risqués pour repousser la vitesse de pointe ainsi que dans les virages. Réglez les ailes avant et arrière sur 0-4. Réglage de la répartition de freinage sur 74 % car la voiture est toujours un peu nerveuse au freinage. Taux de la roue avant sur 200 et ARB avant sur 6. Les sorties de virage peuvent tout de même s'avérer problématiques, mieux vaut donc définir le contrôle de traction sur le niveau 5-7.

series18_event3=Silverstone est un circuit très difficile, mieux vaut privilégier la sécurité. Je suggère de régler les ailes avant et arrière sur 1-6, l'ARB avant sur 8 et la répartition de freinage avant sur 74. Il fait froid, vous devriez donc pouvoir courir avec des pneus moyens, mais il reste le risque de surchauffe. Si vous rencontrez des problèmes, mettez des pneus durs et baissez la pression de 3 crans.

series18_event4=Sur Mugello, il faut gérer le train arrière particulièrement nerveux du véhicule tout en optimisant la vitesse dans les virages moyens. Commençons par régler les ailes avant et arrière sur 1-6. Nous allons tenter de rigidifier l'ensemble pour mieux charger les pneus. Course de déplacement avant sur 40. ARB avant sur 10, hauteur avant sur 8. Course de déplacement arrière sur 70. Taux de roue arrière sur 90, train arrière sur 20. ARB arrière sur 6. Pneus durs 24-25 à l'avant et à l'arrière. Allez-y doucement lors du premier tour, laissez les pneus chauffer correctement avant de mettre la gomme.

series18_event5=Comme toujours avec Imola, il faut travailler sur l'amortissement pour mieux négocier les bordures. Réglez les ailes avant et arrière sur 1-6. Course de déplacement arrière sur 70. ARB avant sur 6, et arrière sur 0. Amortisseur de butée arrière sur 10, réglages de bosse rapide sur 34 et rebond rapide arrière sur 25. 74 % pour la répartition de freinage avant. Pneus moyens sur 23-22 à l'avant et à l'arrière. Un contrôle de traction de 7 fera parfaitement l'affaire.

series18_event6=Le moteur de la BMW est formidable, et nous devrions optimiser l'aérodynamisme en abaissant l'aile arrière autant que possible. Réglez l'aérodynamisme sur 0-3 à l'avant et à l'arrière. Privilégiez les pneus durs, avec une pression de 29-25 à l'avant et à l'arrière. Une répartition de freinage avant de 79 % pour stabiliser la voiture autant que possible lors des freinages. ARB sur 5, taux de roue avant sur 190. Hauteur avant sur 10, hauteur arrière sur 28, ARB arrière sur 0. Rapport de vitesse plus long défini sur 10-47. Niveau de commande de traction sur 8.

series18_event7=Voici la dernière course sur Spa Francorchamps. Nous devons impérativement obtenir un bon résultat, quitte à faire des réglages un peu risqués. Gardons les pneus moyens et réglons les ailes avant et arrière sur 0-4. Avec un contrôle de traction de 7, vous maîtriserez mieux les rotations de vos roues en sortie de virage. Réglez le taux de vos roues avant sur 200 pour mieux entrer dans les virages et rester stable lors des freinages. Hauteur avant sur 6 et arrière sur 26 pour maintenir l'activité du diffuseur. Enfin, réglage de la répartition de freinage sur 74 % à l'avant. La voiture ne sera pas facile à manier, mais vous irez très vite ! C'est parti !

series18_name=Série GT BMW Z4 GT3
series19=Bienvenue à la série BMW GT3 extrême !</br></br> BMW vous souhaite la bienvenue dans son équipe GT3 d'endurance. Vous allez prendre les commandes d'une Z4 GT3 pour l'ensemble de cette saison, avec le soutien du fabricant. De plus, vous serez responsable des séances d'entraînement et de qualification lors du week-end de course.</br></br> L'équipe compte sur vous pour obtenir<strong> 60 points lors du championnat.</strong>
