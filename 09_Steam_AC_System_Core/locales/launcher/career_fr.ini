series23_name=Mercedes SLS GT3 Extrême
series24=Vous êtes pilote de l'écurie BMW GT2 !</br></br> Un bel exploit pour tout pilote professionnel. La voiture vieillit un peu, mais elle reste bonne pour la compétition, et l'équipe a bon espoir de vous voir vous dépasser.</br></br> Faites une bonne performance d'au moins<strong>60 points </strong>pour les satisfaire.

series24_event1=Comme vous le savez sans doute, notre voiture a enchaîné les victoires et nous avons un réglage de base qui fonctionne très bien. Nous allons vous laisser vous familiariser avec ce réglage lors de la première course, puis vous suggérer des petites modifications pouvant correspondre à votre style de pilotage. Réglez les ailes avant et arrière sur 2-4. Rapport de vitesse sur 10/50 et 6ème vitesse sur 34/31. Tous les pneus moyens avec une pression de 21.

series24_event2=Commençons par le réglage du Nürburgring GP, mais pour Vallelunga, nous suggérons un cran au-dessus pour l'ARB avant et 1 cran au-dessus pour la 6ème vitesse. Il est facile d'anticiper les réactions de la voiture dans les épingles lentes de Vallelunga, mais bien que ce soit amusant, mieux vaut limiter le survirage et optimiser la traction pour faire de meilleurs temps.

series24_event3=Recommencez avec le réglage du Nürburgring GP. Puis optez pour une 6ème vitesse légèrement plus longue à 25/31. Si vous souhaitez plus d'adhérence des pneus, je suggère un alignement de -3,8 à l'avant et de -3 à l'arrière. Attention aux blocages lors des freinages, qui peuvent entraîner des méplats pour vos pneus. Il se peut également que la voiture devienne plus nerveuse sur les bordures.

series24_event4=Mugello est truffé de virages à grande vitesse, ce qui fait frotter la suspension sur la butée sur une période prolongée. Nous allons utiliser le réglage de Silverstone et travailler sur la flexibilité des butées d'amortisseur pour stabiliser la voiture entre les bordures. Définissez la butée d'amortisseur avant sur 130 et la butée d'amortisseur arrière sur 100. Il se peut que vous rencontriez des problèmes de surchauffe. Utilisez un alignement moins négatif et ajustez votre style de conduite. En cas de persistance du problème, utilisez des pneus durs sans toutefois oublier qu'ils n'ont pas fait leurs preuves avec ce réglage sur ce circuit.

series24_event5=Le réglage de Mugello devrait faire l'affaires ici à Imola, avec seulement une ou deux modifications, principalement au niveau des amortisseurs. Butée rapide sur 60 devant, et 40 derrière. Rebond rapide de 140 à l'avant, 85 à l'arrière. Rebond de 20 à l'arrière. Course de déplacement arrière sur 80. La voiture reste un peu cahoteuse, donc maîtrisez votre puissance sur les bordures.

series24_event6=Le circuit de Monza ne nécessite que très peu de résistance aérodynamique. Commencez par le réglage par défaut et définissez les ailes sur 0-2 à l'avant et à l'arrière. Pneus moyens sur 28-21 à l'avant et à l'arrière. ARB arrière sur 0. Comme d'habitude, faites attention au freinage pour éviter les méplats. Si vous souhaitez prendre un peu plus de risques, abaissez l'aile arrière jusqu'à 1 et équilibrez avec plus d'ARB à l'avant.

series24_event7=La dernière course de la saison se déroule sur Spa Francorchamps. Nous suggérons le réglage de base du Nürburgring GP avec un alignement de -3,8 à l'avant et de -3 à l'arrière. Utilisez une 6ème vitesse plus longue de 25/31.

series24_name=Série BMW M3 GT2
series25=Vous êtes pilote de l'écurie BMW GT2 !</br></br> Un bel exploit pour tout pilote professionnel. La voiture vieillit un peu, mais elle reste bonne pour la compétition, et l'équipe a bon espoir de vous voir vous dépasser.</br></br> Faites une bonne performance d'au moins<strong>60 points </strong>pour les satisfaire.

series25_event1=Notre technicien de course préfère améliorer la voiture au fil de la saison plutôt que de la régler spécifiquement pour chaque circuit. Un pilote de votre expérience ne devrait avoir aucun mal à la prendre en main tout en faisant des commentaires constructifs après chaque course. Nous allons commencer par le Nürburgring GP avec des pneus moyens à 21 de pression, un rapport de dernière vitesse d'un cran en-dessous, des ailes par défaut et un ARB arrière de 2. N'oubliez pas que ce moteur n'a plus de puissance au-dessus de 7 000 t/min., il convient donc de passer la vitesse lorsque les indicateurs clignotent.
series25_event2=Le réglage du Nürburgring était bien, mais il manquait un peu de traction. Reprenons cette base en améliorant la traction pour Vallelunga. Chargez le réglage du Nürburgring GP et réduisez l'ARB jusqu'à 0. Alignement de -3,0 à l'avant pour que le train avant adhère en milieu de virage. Taux de roue avant de 120 pour de l'adhérence au freinage. 1 cran au-dessus pour la 6ème vitesse, valeur de 25/24.

series25_event3=Silverstone requiert une vitesse constante, ce qui devrait très bien correspondre à notre voiture. Commençons par le réglage de Vallelunga. 5ème rapport sur 23/26. Taux de roue arrière sur 110. Hauteur avant sur 6, hauteur arrière sur 2. Amortisseur de butée arrière sur 30, rebond rapide arrière sur 97. La voiture devrait désormais être plus stable entre les bordures. Si le réglage fonctionne, nous le conserverons pour Mugello.

series25_event4=La voiture fonctionne plutôt bien. Pour Mugello, on va partir comme d'habitude avec le réglage Silverstone. Ajoutons un tout petit peu de course de déplacement à l'avant pour aider le train avant dans les virages longs. Valeur de 40. Taux de roue arrière sur 105. Voilà qui devrait suffire. Les pneus moyens risquent de surchauffer sur ce circuit. Vous devriez pouvoir éviter la surchauffe, mais en cas de problème grave, on sera peut-être obligé d'opter pour des pneus durs.

series25_event5=Notre réglage Mugello devrait désormais bien correspondre à Imola. Des pneus moyens seront parfaits. Attention au virage Tosa tant que les pneus sont froids. Vous pourriez avoir des problèmes de traction. En cas de problème de traction persistant, définissez la pression du pneu arrière sur 1 ou 2 crans en-dessous. Notre réglage de base est de mieux en mieux.

series25_event6=Monza est un circuit très particulier. Nous allons tenter de créer aussi peu de résistance aérodynamique que possible, sans que l'équilibre de la voiture n'en soit affecté. Réglez les ailes avant et arrière sur 0-2. La déportance sera renforcée à l'avant, bloquant la course de déplacement pour limiter la sensibilité au tangage. Hauteur avant sur 15, course de déplacement avant sur 30 et butée d'amortisseur avant sur 150. ARB avant sur 10. Pneus moyens sur 26-22. Rapport de dernière vitesse de 10/34, 6ème vitesse sur 27/28. En cas de problème de maniabilité persistant, réglez l'aile arrière sur 3.

series25_event7=Pour la dernière course de la saison à Spa, nous allons nous baser sur le dernier réglage effectué à Imola. Seuls les réglages des rapports vont changer, pour s'adapter aux lignes droites de ce circuit. Chargez le réglage Imola et définissez le rapport de vitesse sur 10/34. Cela devrait suffire. L'équipe souhaite aussi vous remercier d'avoir contribué à créer des réglages pour les voitures de nos clients. Bravo !

series25_name=BMW M3 GT2 Extrême !
series26=Pilote officiel Ferrari 458 GT2 !</br></br> Votre patience et votre investissement dans les petits Trofeos de Ferrari a fini par porter ses fruits. Vous venez de réaliser un rêve en devenant pilote professionnel Ferrari.</br></br> L'écurie s'attend à marquer au moins<strong> 60 points dans le championnat.</strong>

