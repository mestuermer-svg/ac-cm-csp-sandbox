series23_event6=是时候来让马力全开了，Monza赛道代表着全力加速和最高速度的表现。我们需要用上硬轮胎，将前胎压提高到29、前后定风翼设定为0-2、煞车偏差值设定为71%、前轮转速设定为120、后轮则是105，后ARB为0。有了调校平衡并能超过270km/h的最高速度下，没有多少其他车款能和我们相抗衡。
series23_event7=Spa赛道是我们夺冠的最后一个机会了! 我们可以先采用Mugello赛道的设定来检视能否在成绩上有所突破。前后定风翼设定为1-5、前ARB为6、后轮转速设定为100、前高度设定为2、后高度为0、煞车偏差值为70%。气候寒冷，我们可以冒险一试中等轮胎。在第一圈的时候放轻松，面对快速弯道的时候请平稳地驾驶。
series24=成为BMW GT2车队的车手!</br></br> 这对一位专业车手来说是一项伟大的成就。虽然这辆车目前有点老旧，但它依然充满竞争力，车队也非常期待你的优异表现。</br></br> 请为车队收集至少<strong> 60点积分，</strong>这会是展现你价值的表现机会。
series24_event1=你或许略有所闻，我们的车款拥有辉煌的成功历史和健全的基本设定，我们明白这些设定能车体完美运作。我们会先让你在第一个赛道上熟悉一下基本设定值，接着再根据你的驾驶风格来做一些细部微调。前后定风翼设定为2-4、最终齿轮比设定为10/50、第6齿轮比设定为34/31、中等轮胎胎压设定为21。
series24_event2=让我们先以Nurburgring GP赛道的设定开始，不过为了符合Vallelunga赛道的状况，我建议将前ARB调高1，且第6齿轮比也调高1。这台车在Vallelunga的慢速发夹弯过弯状态都在我们的掌控之中，虽然操控起来很有趣，但为了获得更好的成绩，你仍应该防止过度转向的情况，并最大化车体牵引操控。
series24_event3=再次从Nurburgring GP赛道的设定开始吧。用稍微长一点的第6齿轮比，定为25/31。如果你需要更多的车胎咬合力，我会建议-3.8的前倾角和-3的后倾角。要注意避免在煞车时的死锁状态，以防止磨平你的车胎胎面，同时也避免这辆车在路缘时的不安定性。
series24_event4=Mugello赛道拥有大量的高速弯道，这会让悬吊系统长时间撞击在缓冲器上。我们将会使用Silverstone赛道的设定并着手调整缓冲弹簧的系数，来让这辆车在驶经路缘时能更加平稳。将前缓冲器系数设定为130、后缓冲器系数设定为100。你可能会遭遇轮胎过热的问题，减少一些负倾角并调整你的驾驶习惯来避免这个问题。如果这问题一直发生，试试看使用硬轮胎，不过请记住，这个设定并未经过此复合式赛道的严苛状态测试。
series24_event5=我们只需要做一些微调，就能让Mugello赛道的设定适用于Imola赛道，主要在调整阻尼器的设定。将前快速阻尼设定为60、后阻尼设定为40。前快速回弹阻尼器设定为140、后快速回弹阻尼器设定为85。后回弹阻尼器设定为20。后悬吊系统位移距离设定为80。让这辆车保持些微的弹性，然后看看你能在路缘上发挥这辆车多少马力吧。
series24_event6=我们需要最小化空气阻力来面对Monza赛道。以默认设定为基础，将前后定风翼调整为0-2、前后中等轮胎设定为28-21、后ARB为0。同样地，请小心操作你的煞车以避免磨平胎面。如果你想要大胆一点，可以尝试将后定风翼降为1，再将前ARB调高一些来平衡整体性能。
series24_event7=Spa Francorchamps是此赛季的最后一个赛道。我们建议以Nurbrugring GP的设定为基础，并将前倾角设定为-3.8、后倾角设定为-3。使用大一点的第6齿轮比，可以调整为25/31。
series25=成为BMW GT2车队的车手!</br></br> 这对一位专业车手来说是一项伟大的成就。虽然这辆车目前有点老旧，但它依然充满竞争力，车队也非常期待你的优异表现。</br></br> 请为车队收集至少<strong> 60点积分，</strong>这会是展现你价值的表现机会。
series25_event1=相较于针对每一个赛道规划出不同的设定，我们的工程师反而亟欲要在这赛季之中提升车体的稳定性。像你这么一位有经验的车手，想必能克服车辆操控性的问题，也能在一场又一场的竞赛后，针对车辆性能的提升提出有效的意见回馈。我们会先从Nurburgring GP设定开始，搭配胎压21的中等轮胎，减少一刻度的最终齿轮比，默认的定风翼设定，后ARB设定为2。记得，当引擎在超过7000转速之后会失去真正的马力，所以当看到灯号闪烁时，务必要换档。
series25_event2=Nurburgring的设定还算不错，不过缺少了一些牵引力的调整。我们会以同样的设定来着手，并针对Vallelunga赛道做出牵引力的改进。加载Nurbrugring GP的设定，将后ARB降低为0，用-3.0的前负倾角来增加一些前端咬合力。前轮转速设定为120，来帮助煞车咬合性。增加一刻度的第6齿轮比，采用25/24的系数。
series25_event3=Silverstone赛道的过弯速度特性非常适合我们的跑车。让我们先从Vallelunga的设定开始，将第5齿轮比设定为23/26、后轮转速设定为110、前高度设定为6、后高度设定为2、后压缩阻尼设定为30、后快速回弹阻尼设定为97。这样的设定能让我们在驶经路缘时有较好的稳定性。如果此设定运作良好，我们也会将之用在Imola赛道。
series25_event4=这辆车的设定目前运作良好，为了适应Mugello赛道，照惯例，让我们先以Silverstone的赛道设定开始。先增加一些前悬吊系统位移距离来帮助车体前端面对长弯道，将数值调整为40，后轮转速率调整为105，这样的设定应该就足够了。中等轮胎在此赛道应该会有过热情况，你应该能掌控车胎过热的情况，但为了预防更糟的可能问题，选用硬胎应该是更好的决定。
series25_event5=到目前为止，我们针对Mugello赛道的设定已经足以对付Imola的跑道了。中等轮胎会是最好的选择。如果车胎温度低，在Tosa弯道时请多加留意。你可能会遭遇一些牵引力的问题，如果这个状况持续发生，你可以试着把后胎胎压降低1到2个刻度。坦白说，我们的基本设定已经非常的棒了。
series25_event6=Monza是一条特殊的赛道，我们会尽可能地将空气阻力降到最低，同时不影响车辆整体的平衡性。将前后定风翼设定为0-2。如此一来这辆车的前部就会有较多的向下压力，降低前车的位移并限制仰角灵敏度。前高度设定为15、前悬吊位移距离设定为30、前缓冲器系数设定为150、前ARB设定为10、中等轮胎设定为26-22、最终齿轮比设定为10/34，第6齿轮比设定为27/28。如果你在操控性上仍遭遇问题，试着将后定风翼设定为3。
series25_event7=面对此赛季最后的赛道Spa，我们将会采用在Imola开发的最新设定。我们要做的只有调整齿轮比来让车辆更适应此赛道的长直线跑道。加载Imola的设定并将最终齿轮比设定为10/34，这样就很完美了。车队非常感谢你付出的努力，我们共同为这辆客制化车型创造出了非常棒的设定值，干得好!
