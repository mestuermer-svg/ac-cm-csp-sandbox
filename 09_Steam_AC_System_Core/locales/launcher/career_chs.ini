series1_event1= 小型的Abarth 500 EsseEsse是一款入门型车辆。同时有良好的乐趣和安全的操控性。在Vallelunga俱乐部赛道上进行计时赛训练，同也时为您的第一场比赛做好准备。
series1_event2=本地的Abarth俱乐部正在组织一个小型单人比赛。在这快节奏的3圈比赛展现你的车技。
series1_event3= 您赢得了其他汽车爱好者的信任。一个朋友提供他的Alfa Romeo Giulietta QV给您在Magione赛道进行计时赛，让他知道您值得如此！
series1_event4= 你做得很好，所以你现在有机会把美丽的Alfa Romeo Giulietta QV开向本地的Magione赛道。注意此地的对手，他们似乎有准备一些Abarths赛车，而且拥有更好的轮胎，悬掉系统且升级了引擎。在这5圈比赛中向他们展现你的实力吧。
series1_event5= Magione赛道的特色之一是满满的沙尘。您现在有机会尝试驾驶BMW M3 E30在这个充满尘土且低抓地力的赛道上。注意剎车时机和过弯问题。
series2=成功解锁初级系列赛2！ </br></br> 你在第一个系列赛中做得很好，所以现在是时候让你毕业并驾驶一些正统的后轮驱动车了。这些BMW出品的顶尖超跑，不仅快速而且振奋人心，而且还可以帮助您提高驾驶技术。</br></br> 赢得 <strong> 2 枚铜牌1 枚银牌</strong> 来完成此系列赛。
series20=欢迎来到McLaren GT3车队!</br></br> McLaren GT3耐力车队计划在耐力赛冠军赛赛季中提拔表现最佳的车手。</br></br> 车队认为你需要在冠军赛中收集到<strong> 60点积分 </strong>。
series20_event1=耐力冠军系列赛开始于Nurbugring GP赛道。您的车队工程师建议设定您的McLaren MP4 12C GT3进行第一场比赛。使用中等轮胎，并将其胎压降低2左右。后定风翼设定为6，且最终齿轮比设定的较短。先尝试安全地驾驶。赛程很长，我们可以在你一步步适应车辆后，再进行反攻。
series20_event2=Vallelunga赛道会有更多停停走走的状况。让我们在设定上的调整更加激进一些。 前定风翼设计为1、后定风翼设计为5、前轮胎压降低2 、后轮胎压降低1 、后ARB提高1、也许你也需要将煞车偏差设定提高1。最好一次调整一个部分，并同时观察结果。 如果在通过慢速弯道时遇到问题，尝试将牵引力控制设定在6或7看看。
series20_event3=Silverstone赛道有一些非常棘手的弯道和容易使轮胎过热的路面。请将胎压维持在预设的中等设定。由于最高速度在这里不如高速抓地力那么重要，建议您保留预设的空气动力设定。也许将前ARB提高2会让车辆更稳定。如果在弯道煞车时遇到问题, 也许你也需要将煞车偏差设定提高2。也建议再次尝试将最终齿轮传动比缩短一点。
series20_event4=Mugello赛道是对轮胎，驾驶技术和设定调整上的难关。如果轮胎温度太高，可能需要在这里使用硬质轮胎。使用0-4前后定风翼设定来强化长直线上的最高速度。将前轮转速降低2点，后轮转速降低4点，可以令差速器发挥更大作用。使用20% 动力差速器可以令车辆通过长弯道时更加迅速。煞车偏差直设定于73可令车辆在煞车时更加稳定。 6号齿轮也可再缩短1点。
series20_event5=Imola是个非常棘手的赛道。车辆的阻尼会为了能稳定越过赛道的路缘需要承受很大的工作量。中等胎压降低2 ，设定前回传阻尼12、前阻尼15、后阻尼5、后快速阻尼30、后位移距离70、后ARB 0、动力差速器40%。 最终齿轮比再缩短1点。
series20_event6=称霸Monza赛道的关键是最高速度和应对慢速弯道上的敏捷性.。开始将前后定风翼设定为0-1。前后悬吊系统设定为24-21 。使用硬轮胎且前后胎压设定在29-27。同时请注意过热问题。前ARB 设定 7、后ARB 设定 0。提高前煞车偏差值至71可提高煞车稳定性。在比赛开始时要注意，在第一个弯道中，很容易发生事故。 
series20_event7=SPA是一个完整的赛道，忽快忽慢的弯道，非常像Silverstone赛道，但有着更惊人高低起伏，还有要求速度极高的上坡。开始将前后定风翼设定为0-4。前ARB 设定 7以增加稳定性。你会需要使用到硬轮胎，并降低3点胎压.。第6齿轮比缩短1点。调整前煞车偏差值至72%
