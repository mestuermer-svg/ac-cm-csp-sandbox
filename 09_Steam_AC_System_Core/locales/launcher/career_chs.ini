series1=欢迎来到 Assetto Corsa 生涯模式.<br/><br/> 驾驶Ferrari 458 GT2将不再只是梦想!但是在成为一位专业车手之前，还是得先做好一些准备工作。先从小巧的Abarth 500 EsseEsse开始上手吧。小巧的Abarth也许直线的极速不高,但是应对狭小的弯道却是十分灵敏.您能发挥它的极限，并善用前轮驱动系统的优势吗?<br/><br/> 赢得 <strong>3枚铜牌</strong>以上，即可晋级下个系列赛。
series10=欢迎来到Abarth方程式冠军杯。</br></br> 这项单人乘坐车种的冠军赛事是对车手最重要的考验之一。在这项赛事中表现杰出的选手往往可以得到职业车队的青睐。</br></br> 得到<strong>40个积分 </strong>让职业车队对你留下深刻的印象吧。.
series10_event1=CSAI Abarth方程式冠军赛将从马焦内开始。极为狭小的赛道是此赛场的特色，同时对单坐式赛车来说它的路面也是十分崎岖。为了应对崎岖的赛道和路障，您或许要调高您的车身，并设法让悬吊系统更加柔软。
series10_event2=Vallelunga 赛道很容易实现你来我往的超车场面。同时在赛场上也藏有一些"小秘密"，您可以尝试一些不寻常的驾驶路线来发现它。 找出此秘密路线有机会使您每一圈的成绩快上个半秒。
series10_event3=Mugello也许是难度最高的赛道之一。长而弯曲的赛道考验车辆的下压力,但同时具备极长的直线赛道而对最高速度有不低的要求。您必须从中取得平衡。尽可能避免碰撞路障，它会严重破坏你的驾驶速度。
series10_event4=纽柏林GP也是一个讲究技巧赛道。无论是下坡的发夹弯或是上坡路线的减速弯，五花八门的地形让您从1档狂飙至5档。胆大心细就是赢得赛场最好的诀窍。
series10_event5=人们常称Imola赛道为小纽柏林。如果要征服此赛道，你会需要尝试跳过这些路缘，但这并不是一件容易的事。如果要跑出完美的成绩，你也许要冒一些风险，但你有可能整场比赛都这样有惊无险吗?
series10_event6=Silverstone可谓应有尽有。从低档速的发夹弯一路狂飙至6档的减速弯! 如果想从容地面对这个疯狂的赛道，驾驶技术、车辆调校、还有坚定的勇气三者都缺一不可。
series10_event7=想在这个极速赛道上取得成功，必须得保持够低的下压力并制定优秀的滑流战术。将车身调的较低可以让分流器发挥更好的作用，但也请注意与路缘保持距离，并避免刮伤底盘。
series10_event8= CSAI Abarth方程式冠军赛的最后一场赛事,也是在本赛季取胜的最后机会.。奥罗赫很可能这世上最刺激、最惊险、最引人入胜的赛道。您将面对足足长达七公里赛道的挑战。
series11=Ferrari 599XX 锦标赛。</br></br> 599XX锦标赛是一项限定车种的系列赛,仅开放于. 拥有限定XX法拉利方程式车种的车手。一部分专业车手也会受邀并被仔细审视。其中表现最优秀的便有可能成为Ferrari GT车队的一员。 </br></br> 收集<strong> 系列赛中36点积分</strong>取得成为法拉利车手的机会。
series11_event1=驾驶如此强劲的车种在弯道狭窄的Magione赛道可不是一件简单的事。材质较软的聚合轮胎和较低的胎压将能起上大用。同时您也得控制好车辆的牵引力, 在消化过剩的马力的同时增加牵引力。
series11_event2=Ferrari 599XX EVO在Vallelunga赛道将会迎来时速高达250km的下坡路段，就是这么快!如果你一开始就打算全速冲刺，很可能马上就会在过弯中失去控制，你要不是真的胆识过人就会显得有些愚蠢。最好以良好的稳定性为目的去调整车辆的配置。
series11_event3=又快又长又弯，这就是Mugello。599XX EV是辆极为优秀的跑车,但前提先是必须对它的空气动力设计十分了解且自信。在过弯时，当你发现车头有些上倾，请尝试再多打一下方向盘，电子系统会侦测到你需要更强的前抓地力。结果会让你感到惊喜的。
series11_event4=Nurburgring GP可以说是将你以往所经历过赛道中之难关集大成的赛道。慢速发夹弯考验着车辆的牵引力，同时又有要求高稳定性与抓地力的极速弯道。找出最合适的车辆设定吧，祝你好运。
series11_event5=使用高马力的车辆挑战伊莫拉可不容易。我们了解跃过路缘的跑法可以在此赛道取得良好的成绩，但在750制动马力的情况下，这就是个大难题了…也许现在就是使用manettino旋扭的好时机了，利用它选出最合适的牵引力控制等级吧。
series11_event6=现在你必须学习如何利用599XX的电子系统去控制它的空气动力功能了。 如果你想要好好试试这项功能，Silverstone是一个很好的选择。此地气温虽不高，但路面却容易使轮胎过热，所以在调整相关设定的时候，请务必三思而行。
series11_event7=750制动马力将在Monza的直线赛道上解放，准备好见识超过300公里极速了吗! 不过请当心，在如此的高速之下，也会需要有更长的煞车距离，所以蒙札赛场上那些狭小的弯道就会变得十分棘手。同时也请注意在这炎热的天气下，轮胎的选用也十分重要。
series11_event8=冰冷的温度、平滑的路面还有世上最险峻的弯角，这就是Spa Francorchamps赛道。软轮胎可以给予更好的抓地力，但也可能无法完整坚持到整场比赛。 这是本赛季最后一场比赛了，请拿出最好的表现。
series12=Ferrari 458专业锦标赛!</br></br>像你这样等级的车手没必要再去赛道体验日了。是时候去和其他车手来场绅士的较量了。Ferrari 458专业锦标赛会让你有机会挑战满满的赛程。</br></br>在系列赛中收集 <strong>30点积分</strong>让专业车队对你留下深刻印象吧。
series12_event1=Ferrari 458 S3 锦标赛开始于蒙札赛道。拥有着近600制动马力, 低空气阻力,还有极快的加速力，这辆车可以达到令人惊艳的最高速度。最好注意一下煞车的距离，即便你使用的是光滑的轮胎。
series12_event2=458 S3极低的底盘会让你在崎岖的Mugello赛道上造成麻烦。最好尽可能地避开路缘，以防陷入危险。
series12_event3=新的银石赛道拥有完美的光滑路面同时也是展现Ferrari 458 S3实力最好的舞台。 当然，面对这些又快又急的弯角依然需要你的全神贯注。
series12_event4=著名的斯帕-弗朗科尔尚赛。尝试在此赛道上通过鼎鼎大名名的爱罗格弯吧。此赛场上弯道虽是公认的困难，但也不是完全不可战胜。
series12_event5=Imola是一个十分讲究技术的赛道。请特别留意下坡路段的Rivazza弯。也许在进入下坡以前可以试着利用ABS制动系统稳定你的车辆。
series12_event6=The Nurburgring GP赛道也许就是个更长但也更没特色的Nordschleife赛道，但它的难度同样不低。你会需要稳定性够高的车辆，才能够在在最后的三个关键超车点如鱼得水。
