series16=顶级超跑赛 等级1 已解锁!</br></br>顶级超跑的车主一定对他的车子感到十分自豪。一部分的车主之所以收藏它们不仅仅只是因为它们的价值，更是享受驾驶看见它们在赛场上奔驰的快感。他们也常常会邀请专业车手去驾驶这些顶级跑车，见识这些车子的最大极限，不过言归正传，要收到邀请可不容易。想想你也是挺幸运的，是吧。</br></br> 至少<strong>收集3个铜牌与2两枚银牌 </strong>来完成这个赛季。.
series16_event1=Ferrari F40， 爱好者认为它是有史以来最棒的模拟动力超跑，也是最具标志性意义的超级跑车。这款特定的S3版本使用的是超过600制动马力的平跑引擎并搭配着光滑的车轮，而且无ABS与牵引力控制系统。你能有办法发挥出它的极限吗？
series16_event2=根据Ferrari的开发计划与相关研究得出，599XX是实验车型中最快的跑车之一。配备750制动马与动态空气动力系统，它的驾驶难度也堪称地狱等级。所属Ferrari的Mugello车道是对这辆跑车来说最完美的赛场。
series16_event3=惊人的马力、空气动力系统及超高抓地力的光头胎，这些条件使得Ferrari 599XX EVO成为Nordschleife赛道上最快记录的保持者之一。驾驶这辆车奔驰在这个赛场上会令每个车手如痴如狂。Nurburgring GP赛道对于超跑爱好者来说不仅是一项挑战，更带着令人着迷的魔力。
series16_event4= Pagani Zonda已称得上世界上最受欢迎的跑车之一。Zonda R version拥有全部Pagani跑车所包含的魅力，并且有过之而无不及。重量轻，马力强大，赛道特制化。你完全无法想象银石赛道上能够出现如此速度。但是你有办法驾驭这样的跑车吗？
series16_event5= Pagani Zonda R能以极快的速度穿梭在Imola中各处高低起伏的赛道，如果你不能全神贯注，保证会被搞得晕头转向。再想象一下，在这种情况下还有其他超跑作为你的对手，请尽力克服一切迈向胜利吧！
series16_event6=经过挑战极限的Zonda R之后，没有人认为Pagani在可合法上路的条件下创造出更加极端的跑车。但他们错了。Pagani Huayra可以在Monza的直线跑道上轻松达到300公里。 其中最具特色的4个可独立活动的空气动力襟翼能否在狭窄的减速弯中发挥出它应有的效用呢？
series16_event7=最著名的跑车制造商传说将以名为LaFerrari的超跑传承下去。这项令人难以置信的技术奇迹采用混合动力技术实现963的制动马力，配上活动空气动力系统和新式底盘研发，令其他超跑望尘莫及。为了证明这一点，请在Spa Francorchamps赛道上的这场巨星之战中，拿出你最好的成绩吧。
series17=欢迎来到GT专业系列赛!</br></br> 您驾驶各种跑车的出色表现，使您成为一位著名的绅士车手。GT3甚至GT2的跑车车队正在寻找像您这样的车手与他们的跑车同场竞赛。</br></br> 收集至少<strong> 3枚铜牌与2枚银牌</strong>让GT车队为您留下深刻印象。
series17_event1=您现在有机会在Nurburgring GP赛道上驾驶BMW Z4 GT3赛车。作为最强大的GT3跑车之一，这台BMW在剎车时会需要比较大的空间。在直线跑道上抓好煞车时机，并使用它强大的马力快速通过赛道。
series17_event2=BMW Z4 GT3车队又给您了一次驾驶机会，本次挑战的是Vallelunga赛道。BMW强大的扭距十分适合加速通过Vallelunga 赛场上的慢速发夹弯。如果您因为磨损的轮胎而遇到麻烦，请在驾驶时调整牵引力控制等级。
series17_event3= McLaren MP4 GT3车队将提供您车辆参与银石赛道上的比赛。 McLaren是一辆性能非常强大的跑车，但它的涡轮引擎和双面刃般的操作特性也十分危险。最好选择一种较安全的设定，虽然起始速度会比较慢，但后面在轮胎磨损时会更加稳定。
series17_event4=又一场驾驶McLaren MP4 GT3超跑的比赛，本次将挑战的是Mugello赛道 。赛场中的长弯道会对轮胎造成很大的压力，所以请不要低估这方面的影响。最好使用一个作用比较大的后翼版会安全一些，会好过为了速度却牺牲掉过弯的稳定性。
series17_event5=Mercedes SLS GT3车队对您的速度印象深刻。他们为您提供车辆参与Imola赛道的比赛。Mercedes跑车非常强大，特别是在引擎位于低至中段的转速的时候。伊莫拉赛道的路缘会破坏汽车的稳定性，失去牵引力，所以请安排好牵引力控制的相关设定。
series17_event6=Monza对强大的Mercedes SLS来说可是最完美的赛道。如果你先前的战绩不太好，这会是反攻的最好机会，可藉此夺得重要的积分。前去赢取胜利吧!
series17_event7=Scuderia Glickenhaus一般只邀请经验丰富的车手，但这次他们愿意开个例外。 Spa Francorchamps是一条高难度的赛。P4 / 5 Competizione赛车有强大的抓地力，但在最高速度上却差强人意。虽然取得胜利几乎是不可能的，但也许你还是可以取得一个不错的成绩。
series18=欢迎来到 BMW GT3 系列赛!</br></br> BMW欢迎您来到他们的GT3耐力车队。您将车厂的支援下驾驶Z4 GT3一整个赛季。</br></br> 车队认为你需要在冠军赛中收集到<strong> 60点积分 </strong>。
series18_event1=BMW Z4 GT3绝对是一款经典的冠军车种。该车对设定的改动非常敏感，所以在第一场比赛中，我们将尝试着重于安装上的更改，这有助于我们在未来的比赛中有个安全的驾驶环境。前后翼设定为1-6 。煞车偏差设定为74％ 。前轮转速设定200，前 ARB 设为 8。车前高度调低为7，车后高度调低为30。 差速器设为60%.。这可以让车辆在第一次的比赛兼具速度与稳定性。
series18_event2=Vallelunga是一个相对安全的赛道，我们可以尝试一些更加极端的设定来提高最高速度和转弯速度。将前后翼设定为0-4。 煞车偏差设定为74％ 让车辆在煞车时保持一定惯性。前轮转速设定200，前 ARB 设为 6。你在通过转角时可能依然会发生问题，故最好将牵引力控制设定在5-7级。
series18_event3=Silverstone是个非常困难的赛道，最好以安全为上。建议前后翼设定为1-6、煞车偏差设定为74％、前ARB设定为8. 天气很冷，所以你应该拿出适中的轮胎参加比赛，但还是会有过热的风险。如果您发现遇到问题，请移到难度设定位置，尝试降低3点的难度。
series18_event4=我们需要解决我们车辆后期控制问题，同时在Mugello赛程中期达到良好的速度。前后翼设定为1-6。我们将尝试使用非常硬的设定来更好地驱动轮胎。前位移距离设定40、 前 ARB 设定 10、前高度设定8 、后位移距离设定 70、后车轮转速设定90、后高度设定20、后ARB 设定6。使用前后硬轮胎24-25。在第一圈时先慢着点开，让轮胎热好身，然后开始加速。
series18_event5=像平常一样，在Imola赛道上，车辆的阻尼为了应对赛道路缘会起到很大的作用。前后翼设定为1-6、后位移距离设定 70、前 ARB 设定 6、后 ARB 设定。后压缩阻尼设定10 、快速阻尼设定34、 后快速回弹阻尼设定25。煞车偏差设定为74％。使用前后中等轮胎24-25。牵引力控制等级设为7应该是最为完美。.
series18_event6=BMW有着神奇的引擎，我们只需要尝试优化空气动力与尽可能在维持正常驾驶的情况调低后定风翼。空气动力设定为0-3、轮胎胎压设为29-25、煞车偏差设定为79％来加强煞车时的稳定度。前 ARB 设定 5,、前车轮转速设定190、前车辆高度设定10, 、后车辆高度设定28、后 ARB 设定0。最终齿轮比设为10-47. 牵引力控制等级设为8。
series18_event7=最后一场比赛将在 Spa Francorchamps赛道。我们希望能取得一个很好的结尾，也许我们可以在设定上冒险一下。使用中等轮胎, 前后翼设定为0-4。牵引力控制等级设为7 会有助于脱离车轮转速低的情况。前车轮转速设为 200有助于煞车时的稳定性，前车辆高度设定16、后车辆高度设定26有助于差速器的运作， 最后煞车偏差可设定为79％。这台车可能不好驾驭，但非常快速。上吧!
