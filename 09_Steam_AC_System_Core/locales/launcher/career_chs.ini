series27_event3=Silverstone赛道的过弯速度特性非常适合我们的跑车。让我们先从Vallelunga的设定开始，将第5齿轮比设定为23/26、后轮转速设定为110、前高度设定为6、后高度设定为2、后压缩阻尼设定为30、后快速回弹阻尼设定为97。这样的设定能让我们在驶经路缘时有较好的稳定性。如果此设定运作良好，我们也会将之用在Mugello赛道。
series27_event4=这辆车的设定目前运作良好，为了适应Mugello赛道，照惯例，让我们先以Silverstone的赛道设定开始。先增加一些前悬吊系统位移距离来帮助车体前端面对长弯道，将数值调整为40，后轮转速率调整为105，这样的设定应该就足够了。中等轮胎在此赛道应该会有过热情况，你应该能掌控车胎过热的情况，但为了预防更糟的可能问题，选用硬胎应该是更好的决定。
series27_event5=到目前为止，我们针对Mugello赛道的设定已经足以对付Imola的跑道了。中等轮胎会是最好的选择。如果车胎温度低，在Tosa弯道时请多加留意。你可能会遭遇一些牵引力的问题，如果这个状况持续发生，你可以试着把后胎胎压降低1到2个刻度。坦白说，我们的基本设定已经非常的棒了。
series27_event6=Monza是一条特殊的赛道，我们会尽可能地将空气阻力降到最低，同时不影响车辆整体的平衡性。将前后定风翼设定为0-2。如此一来这辆车的前部就会有较多的向下压力，降低前车的位移并限制仰角灵敏度。前高度设定为15、前悬吊位移距离设定为30、前缓冲器系数设定为150、前ARB设定为10、中等轮胎设定为26-22、最终齿轮比设定为10/34，第6齿轮比设定为27/28。如果你在操控性上仍遭遇问题，试着将后定风翼设定为3。
series27_event7=面对此赛季最后的赛道Spa，我们将会采用在Imola开发的最新设定。我们要做的只有调整齿轮比来让车辆更适应此赛道的长直线跑道。加载Imola的设定并将最终齿轮比设定为10/34，这样就很完美了。车队非常感谢你付出的努力，我们共同为这辆客制化车型创造出了非常棒的设定值，干得好!
series28=赛车领域的巅峰!</br></br> 过往传奇的方程式赛车如今依然在赛场上发出耀眼的光芒和震耳欲聋的咆哮。感谢那些车主们的热情，让那些赛车如今依然驰骋在赛道上，能驾驶这些车辆的只有真正专业的车手，而这些车手的价值和不断挑战极限的热情值得我们给予最大的敬意。</br></br> 收集<strong> 3 枚铜牌、2枚银牌和1枚金牌</strong>。
series28_event1=经典车队Lotus想要你去试驾他们保存良好的跑车Lotus type 49。这辆车是F1历史上最高的技术成就之一，它的马力惊人且车体非常的轻。你可以在弯道处神奇地甩尾，但请留意煞车距离。强大的最高速度和无ABS的设计，这意味着相较于你过往的驾驶习惯，你应该要提早开始踩煞车。
series28_event2=驾驶经典车队的Lotus type 49无疑是一场眼界大开的体验，但想象一下，在1967年的时候开着这台车在Monza赛道上驰骋的画面。虽然这个赛道和过去没有差多少，一样没有慢速弯道，不过闭上你的眼睛想象一下，回到那个年代，那时在赛车场上充满了危险还有... 嗯，你懂，安全至上。
series28_event3=回到1975年，Ferrari 312T这台车曾在Niki Lauda和Clay Regazzoni手中为Ferrari车队赢得双料F1世界车手冠军和世界车队冠军。如今，你可以在Imola赛道上驾驶这辆车竞速，并透过这台传奇跑车的轮下威力来体验那些史诗的战役。
series28_event4=Lotus Exos的客户团队来到了Silverstone，他们要进行一场测试赛。他们需要专业的车手来展示一下这辆跑车，以便让真正的买家出现前调整到最佳状态。把Lotus Exos的性能推到极致，并让所有的潜在客户为之惊艳吧。
series28_event5=你在Silverstone驾驭Exos 125的表象让Lotus车队印象深刻，他们决定邀请你担任客座车手，驾驶调校过的Lotus Exos 125 S1参与一场赛事。赛道选定在Mugello，你会有一整个周末的竞赛时程，好让我们把这辆跑车调整到最佳状态，拿出你最好的表现，祝你好运!
series28_event6=经典车队Lotus对你新近的表现印象深刻，他们认为你足以驾驭Lotus潜力无穷的车款。Lotus 98T在1985年的驾驶车手是Ayrton Senna，在那个以涡轮闻名的时代，造就了最强大的F1跑车，在排位赛的情况下跑出了1000的制动马力。只有最优秀的车手能掌控如此凶猛的车款，并将其潜力发挥到极限，也许你就是那个万中选一的人。
series2_event1=你刚加入了BMW车队的世界，接下来你有很多机会和这个厂牌最具指标性的车辆一较高下。让我们先在德国跑车的故乡Nurburgring赛道进行一些训练吧。要加入BMW挑战之前，你必须先在下列时间竞速赛中收集至少1200点积分： 准备好了吗?
series2_event2=BMW俱乐部正在为车队成员规划有趣的竞赛。由于你展现了高超的驾驶技术，俱乐部决定邀请你作为嘉宾，并提供你一辆BMW Z4 35is。它或许不是BMW最快的车，但足以让你在Monza赛场上的长直线车道占有一定的优势。
series2_event3=这是第二场BMW俱乐部的竞赛。这辆娇小但充满传奇色彩的M3 E30现在是你的了。这辆车具有绝佳的灵敏度，但马力却不太够。Nurburgring GP赛场正好有一些长程直线车道，如此一来你就有机会和其他现代车款拼搏一场了。
series2_event4=你已经试过了所有M3车系的前代车款了，现在是时候让你驾驭最新一代的车辆了。这辆车有着梦幻般的底盘，它强而有力的V8引擎有着惊人的马力。拿出你最好的表现，老实说，我们期待你至少能站上领奖台。
series2_event5=虽然M3享有盛名，但许多人仍相信更轻量、更短小敏捷的1M系列双门轿跑车才是传统M3车系的真正继承者。它的马力虽然较低，但却有更强的扭距和涡轮引擎，这让它在挑战极限的时候更有竞争力。你准备好再次站上领奖台了吗?
series2_event6=表现得太优秀了! BMW的竞赛车部门已经开始注意你了。他们打算邀请你参与一次试驾，开的是真的竞赛用车! 你现在可以开着这辆辉煌的BMW Z4 GT3来参加时间竞速赛。好好驾驭它吧。
series3=恭喜! 你现在可以参加初级系列赛3了。</br> 一间来自澳洲、小规模但很有名的制造商正在观察你驾驶BMW的情况。KTM以赛车闻名，同时也创造了今日极限赛事上最具竞争性的强大武器。KTM X-Bow R现在可以让你用来参加整个系列赛了。</br></br> 赢得 <strong> 2枚铜牌和1枚银牌 </strong> 来让KTM工程师团队留下深刻印象。
series3_event1=欢迎来到超轻量车的世界。KTM X-BOW-R被认为是这类型中最让人激动不已的车款。现在你有机会见识到这辆车惊异的操控表现，并驾驭它在最具挑战性的赛场上：Imola的Autodromo "Enzo e Dino Ferrari"赛道。
series3_event2=KTM正在为其团队成员安排竞赛。你受邀成为嘉宾了，同时你也能驾驶KTM X-BOW R。至少获得第三名的成绩来获得这辆车，并赢得参加X-BOW R挑战赛的资格。
series3_event3=你最近在Vallelunga俱乐部赛道展现出了高超的技巧，现在是时候来挑战GP赛道了。对Roman赛道来说，X-BOW R是最完美的车型。Campagnano弯道是你用来超车的绝佳位置，谨记在心吧!
series3_event4=这是赢取X-BOW R的最后一关了。Nurburgring的短赛道对你来说已经不成问题了。别浪费这个好机会，把这辆车带走吧!
series3_event5=你现在已经拥有自己的X-BOW R了，你可以自由挑战这辆车原本的车手。除非...你懂的，看你有没有勇气了...
series4=欢迎来到初级系列赛4。</br></br> 你在KTM的优秀表现已经让不少人感到惊艳。X-BOW是此类车款的代表作，这是其他缺乏轻量车型历史的厂牌所望其项背的。<strong> Lotus</strong> 车队需要你为其效劳，你需要增进自己在中型引擎车辆的驾驶技术。</br></br> 在此系列赛中赢得<strong> 3枚铜牌和1枚银牌</strong>。
series4_event1=Lotus车队，鲜少有其他厂牌能挑战这个充满传奇历史的伟大车队。你现在有机会驾驶他们入门级轻量化赛车了，如果你表现出色，还有机会能成为Lotus车队的客座车手并参加他们的赛事。
series4_event2=表现得很好! 现在你可以专业并驾驶有着相似操控性的Exige 240R。但请注意，虽然你能快速适应这辆车的操控性，但它却有更快的速度! 你的对手都是一些经验丰富的Lotus死忠爱好者，当然其中也有一些专业车手，这项挑战不太轻松喔。
series4_event3=有车队正在举办赛事，地点位于Silverstone International。大部分的死忠车迷觉得Evora不过是台过气的老跑车，不过经过微调的Lotus Evora S2将会是你强大的武器，能帮助你对抗其他竞争者，顺便好好给他们上一课。
series4_event4=Lotus的工程师想要测试Lotus Exige S的极限。这辆车的名称虽然很眼熟，但它有着全新的底盘并附挂了强大的V6引擎。你可以自行决定要不要参加这场时间竞速赛，并将这辆车的潜力发挥到极致，看看它有多少能耐。
series4_event5=经过了这场精彩的时间竞速赛，你现在已经被邀请担任Lotus Exige V6奖杯竞赛的客座车手。你的对手们经验丰富，请小心应付他们的小手段还有高超的技术。
series4_event6=Lotus 2-11年度锦标赛造访了Magione。你被受邀参加此场盛会，先别兴奋过头，2-11是一辆有着开放差动齿轮的车，这会让它的后内轮在面对像Italian赛道的狭弯时易于失控旋转。如果你不多加留意的话，这个情况会让你的车速降低并耗损你的轮胎。你需要用正确的操控技术来驾驭它。
series4_event7=Lotus车队的工程师认为你是最好的人选，能帮助他们让GTC车型有更强大的进化。你被受邀驾驶全新的Lotus Evora GTC赛车来参与一场时间竞速赛，赛道则是难度相当高的Imola。当天气候炎热，请小心过热问题。请依照情况适时调整车体设定，然后放手追求极限吧!
series5=恭喜，你现在能参加专业系列赛1了!</br></br>当你为知名车厂Lotus驾驶车辆并有精彩的表现，其他英国车厂会将目光投注在你身上也不足为奇了... 对了，等你电话响起时，McLaren就在电话的另一头等着和你通话，我知道这情况一定很难让人冷静下来。</br></br> 赢得 <strong> 2枚铜牌和1枚银牌</strong> 并展现出你能操控一切的实力吧!
series5_event1=一个超跑俱乐部正在欧洲各处的赛道为爱好者们举办竞速赛事。麦拉伦汽车需要一位经验丰富的街头跑车车手来驾驶他们的新款McLaren MP4 12C，他们需要你发挥这辆车的潜力，并让世人的注意力都集中在它不凡的价值上。第一场比赛将会在Vallelunga赛道举行。
series5_event2=第二场超跑竞赛会在Mugello举办。这条意大利赛道的主人是知名厂牌Ferrari，这条赛道也是最严苛的赛场之一，它有着长而快速的弯道，赛道中也充满着上坡和下坡。驾着McLaren单枪匹马闯入Ferrari的赛场，这会是一项令人亢奋的挑战。
series5_event3=超跑系列赛移动到了Nurburgring GP赛道来举办，预计德国车厂会带着他们众多的知名超跑现身，也许还会带来更多惊喜。
series5_event4=Silverstone可以说是McLaren的老家了。虽然这个赛道有一些非常快速的连续左右弯来考验每台车辆的极限，不过有些英国来的轻量跑车仍能保持车胎的健全直到终点，最好睁开双眼注意这些对手。
series5_event5=Monza是竞速的王国，有着最快直线的方程式赛道。驾驭着McLaren的车款，你可以达到不可思议的最高速度，不过请记得，你使用的仍是街道用胎，所以请留意煞车距离。对了，我们听说有一些少见的Ferrari车款将会现身此赛事。
series6=专业系列赛2!</br></br>现在的状态可说是扶摇直上了。Mercedes Benz要提供你一辆指标性的跑车。AMG SLS需要一位足以发挥其极限的驾驶者。你能胜任此要务吗?</br></br> 赢得 <strong> 2枚铜牌和1枚银 </strong> 来完成银箭系列赛。
series6_event1=Mercedes Benz正在为他们的客户筹办一场开放式的竞赛。他们会提供你一辆全新的Mercedes SLS AMG。第一场赛事将在Nurburgring GP举办。
series6_event2=Imola赛道是Mercedes俱乐部赛事的第二个场地。SLS AMG是一辆非常适合此赛道的跑车，不过Imola依然是个危险的场地，当你飞越路缘的时候，请千万多留点神。
series6_event3=Silverstone赛道有着典型的寒冷气候。请确保你的车胎有做足暖胎工作，但在高速弯道的时候也请掌握好车胎过热的情况。
series6_event4=Spa Francorchamps是个惊奇的赛道。你需要足够的马力、预期性的操控、灵敏度和抓地力来对付这个赛场。Mercedes SLS AMG具备了上述的每个特性，加上你的驾驶技术，足以在此赛道上耀眼夺目。不过对手们也不是省油的灯，每个车手都热爱在Spa的竞赛。
series6_event5=再也找不到比Monza拥有更长直线距离的赛道了。如果说SLS AMG需要个地方伸展筋骨，那这里就是了。
series7=做得好! 你解锁了专业系列赛3。</br></br>Ferrari! 世界上最有价值的车厂。他们通常都不会带着他们的跑车和车手来参加赛道体验日的，不过如果他们这么做了，他们一定会挑选最杰出的... 就是你! 这是你一生中最值得好好把握的机会。</br></br> 赢得 <strong> 2枚铜牌和2枚银牌。</strong>
series7_event1=一家知名的跑车杂志正在关注你的表现，他们希望你能为他们测试一款国外的跑车。这是你的大好机会，也许你会因此受到国外车厂的注目。第一场测试安排在Imola，你要驾驶的是令人惊艳的Ferrari 458 Italia。
series7_event2=一场集体超跑测试赛将在Monza举办。Ferrari 458杰出的超控特性必定能帮助你在这场赛事创出佳绩，不过场上仍有许多超跑能和这辆车并驾齐驱，甚至有更强大的马力，当然你明白这一点，在Monza赛道，马力就是一切。
series7_event3=Spa是一个很容易让车胎发生过热情况的赛道。幸好大部分的时间里，此赛道的环境温度够低，足以让车胎降温。不过此赛道的四圈竞赛对街胎来说仍是个非常严苛的挑战。
series7_event4=这是Ferrari厂牌拥有的赛道，对轮胎、车辆和车手来说，是个非常严苛的环境。一些来自Ferrari锦标赛的团队也在此地观察你的表现。拿出你的实力，说不定你能获选参加Ferrari 458 S3锦标赛。
series8=欢迎来到国际Lotus轻量级锦标赛。</br></br>和其他的爱好者一起在小型赛道体验日竞速是一件很棒的事，不过真正重要的还是和其他拥有天份的车手用相似的车款一较高下，并赢得真正的冠军奖杯。</br></br> 收集 <strong> 20点冠军赛积分 </strong> 以解锁下一个系列赛。
series8_event1=国际Lotus轻量级锦标赛在Magione展开了。Magione的慢速发夹弯和减速弯最适合让灵巧的Lotus 2-11发挥了。不过请留意你的开放式后差动齿轮，如果你不想让你的后胎遭遇磨纹和起泡问题的话，就不要在出弯处用力过猛。
series8_event2=Monza又是一个对Lotus 2-11来说非常棒的赛道。减速弯的地方刚好能让这辆车的灵巧性完美发挥。同样地，你需要将后定风翼设定得很低，以利于在长直线距离时争取气洞空间并趁机超车。后车身的低下压力设定可以让这辆车在Ascari和Parabolica赛道变得更加刁钻。
series8_event3=这是全世界最严苛的赛道之一。飞越各种不同的高起路缘、在不平坦的路面煞车，以及在高低差弯道过弯。这个赛道就是想尽办法要你在每个弯道处搞砸。你的对手们一定很期待看到你发生这种状况... 让他们的期待落空吧。
series8_event4=各种快速弯道和大型爬坡道，这就是Mugello赛道的形容。在这个高速的赛道里，需要的是精准度和勇气。这是此系列赛的最后一场竞赛了，也是你最后能让自己站上排行榜顶端的机会!
series9=Ferrari 458锦标赛解锁了!</br></br> 像你这种水平的车手不用再去赛道体验日了。是时候迈出步伐并参加一场正规的赛事，和其他有头有脸的车手一较高下了。Ferrari 458锦标赛是世界上最具有魅力的统一规格竞赛之一，同时也有许多专业团队在此物色优秀车手。</br></br> 收集 <strong> 15点冠军赛积分 </strong> 来让专业车队留下深刻印象吧。
series9_event1=Ferrari 458 S3锦标赛在Monza展开了。这辆车有着接近600匹制动马力、低空气阻力和强大的加速力，能达到令人瞠目结舌的最高速度。虽然这辆车搭载的是光头胎，你最好还是多留意煞车距离。
series9_event2=458 S3的极低车高会让你在Mugello赛道的快速颠簸弯道处遭遇一些麻烦。如果你不想冒更大的风险，那就最好避开路缘的部份。
series9_event3=全新的Silverstone赛道有着完美的平坦路面，这对Ferrari 458 S3来说是最完美的赛场。然而，有些弯道和减速弯还是非常快速，需要你更强的专注力来面对。
series9_event4=知名的Spa Francorchamps赛道。试着在通过Eau Rouge弯道时保持在路面上。至于其他的弯道一样充满难度，不过并非无法超越。
series9_event5=Imola是一个充满技术成份的赛道。在通过Rivazza弯道的下坡煞车路段时请多加留意。或许在进入下坡段之前先采取轻微的右摆过度转向然后再使用ABS煞车来稳定车身，会是一个较好的策略。
series9_event6=Nurburgring GP或许没有像另一条更长的赛道Nordschleife一样有着耀眼的光芒，但它仍是一条严峻的赛场。你需要在煞车状况下有够高稳定性的车辆，才能取得赛道中至少三个超车点的绝对优势。