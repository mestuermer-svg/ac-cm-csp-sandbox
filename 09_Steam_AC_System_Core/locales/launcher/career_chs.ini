series22=做得好!你成为Mercedes SLS GT3车队的车手了!</br></br>Mercedes SLS GT3是这个系列赛中最强大且令人惊艳的车款之一。和Mercedes的跑车竞赛会是你未来生涯最美好的事迹。</br></br> 请在冠军赛中收集至少<strong> 60点积分。</strong>
series22_event1=Mercedes SLS GT3根据出厂设定就是一辆性能非常强大的跑车。我们只要做一些简单的微调，让它能在Nurburgring GP赛道上获得更好的表现。使用中等轮胎，并降低2点第6齿轮比。空气动力设定为1-6。 煞车偏差值设定为70%。前轮转速设定为100。这款引擎的扭矩强大，建议你将牵引力控制设定在5或6，否则你很容易遇到牵引力控制的问题。
series22_event2=由于在低转速的时候会有太大的扭矩，在Vallelunga赛道内的慢速弯道时，你必须专心在牵引力的操控上。定风翼设定为1-6。中等轮胎的前后胎压设定为25-24。差速器设为35%，煞车偏差值设定为70%。前轮转速设定为100，并将后轮转速同样设定为100，后ARB为0。你可能会觉得这样的设定有些不够，但牵引力表现将会非常优秀，你甚至不用担心牵引力控制设定。
series22_event3=有鉴于我们车款的特性并不能在Silverstone赛道的快速弯道中发挥最好效果，我们将尽量让车体在快速通过Maggots弯道区的时候保持安定性，并尽可能做出最小的妥协来面对赛道的其他弯道区。前后定风翼设定为1-7、前轮转速设定为110、后ARB为0、煞车偏差值70%、第6齿轮比缩短1点。你需要微调牵引力控制以面对慢速弯道，建议设定为6或7。跑出个好成绩吧。
series22_event4=Mugello也是一个拥有快速弯道区的赛道，不过它同时也有一条很长的直线爬坡道。我们将会在该直线道采取进攻策略，并在弯道处采防守姿态。前后定风翼设定为1-5、前ARB为6、后轮转速设定为100、前高度设定为2、后高度设定为0、煞车偏差值设定为70%。在酷热气候下你绝对需要硬轮胎。在第一圈的时候放轻松，面对快速弯道的时候请平稳地驾驶。
series22_event5=只要你能顺利驾驶过路缘，那Imola会是一条适合我们跑车的赛道。我们将会采用高下压力的设定，藉此来发挥我们车款的马力和扭矩，让车体在路缘跳跃时能保持一定的贴地。前后定风翼设定为1-8、中等轮胎后胎压设定为21、前轮转速设定为110、后ARB设定为0、后阻尼设定为7、后快速阻尼设定为30、煞车偏差值设定为69%。面对路缘时大胆进攻，但在着地时请保持轮胎的操控性。
series22_event6=是时候来让马力全开了，Monza赛道代表着全力加速和最高速度的表现。我们需要用上硬轮胎，将前胎压提高到29、前后定风翼设定为0-2、煞车偏差值设定为71%、前轮转速设定为120、后轮则是105，后ARB为0。有了调校平衡并能超过270km/h的最高速度下，没有多少其他车款能和我们相抗衡。
series22_event7=Spa赛道是我们夺冠的最后一个机会了! 我们可以先采用Mugello赛道的设定来检视能否在成绩上有所突破。前后定风翼设定为1-5、前ARB为6、后轮转速设定为100、前高度设定为2、后高度为0、煞车偏差值为70%。气候寒冷，我们可以冒险一试中等轮胎。在第一圈的时候放轻松，面对快速弯道的时候请平稳地驾驶。
series23=恭喜! 你解锁了Mercedes SLS GT3 极限赛!</br></br>在你面前的将是一整季的考验，包括了在赛季周末的练习和排位赛。Mercedes SLS GT3工作团队需要你的全力付出。</br></br> 请在冠军赛中收集至少<strong> 60点积分。</strong>
series23_event1=Mercedes SLS GT3根据出厂设定就是一辆性能非常强大的跑车。我们只要做一些简单的微调，让它能在Nurburgring GP赛道上获得更好的表现。使用中等轮胎，并降低2点第6齿轮比。空气动力设定为1-6。 煞车偏差值设定为70%。前轮转速设定为100。这款引擎的扭矩强大，建议你将牵引力控制设定在5或6，否则你很容易遇到牵引力控制的问题。
series23_event2=由于在低转速的时候会有太大的扭矩，在Vallelunga赛道内的慢速弯道时，你必须专心在牵引力的操控上。定风翼设定为1-6。中等轮胎的前后胎压设定为25-24。差速器设为35%，煞车偏差值设定为70%。前轮转速设定为100，并将后轮转速同样设定为100，后ARB为0。你可能会觉得这样的设定有些不够，但牵引力表现将会非常优秀，你甚至不用担心牵引力控制设定。
series23_event3=有鉴于我们车款的特性并不能在Silverstone赛道的快速弯道中发挥最好效果，我们将尽量让车体在快速通过Maggots弯道区的时候保持安定性，并尽可能做出最小的妥协来面对赛道的其他弯道区。前后定风翼设定为1-7、前轮转速设定为110、后ARB为0、煞车偏差值70%、第6齿轮比缩短1点。你需要微调牵引力控制以面对慢速弯道，建议设定为6或7。跑出个好成绩吧。
series23_event4=Mugello也是一个拥有快速弯道区的赛道，不过它同时也有一条很长的直线爬坡道。我们将会在该直线道采取进攻策略，并在弯道处采防守姿态。前后定风翼设定为1-5、前ARB为6、后轮转速设定为100、前高度设定为2、后高度设定为0、煞车偏差值设定为70%。在酷热气候下你绝对需要硬轮胎。在第一圈的时候放轻松，面对快速弯道的时候请平稳地驾驶。
