series16=Supersportwagen Level 1 freigeschaltet!</br></br> Besitzer von Supersportwagen sind natürlicherweise sehr stolz auf ihre Autos.  Manche von ihnen sammeln diese Autos nicht nur des Wertes wegen, sie fahren sie auch gern auf der Rennstrecke. Oft bitten sie professionelle Fahrer, ihre Autos zu fahren und an ihre Grenzen zu bringen, doch nur auf ausdrückliche Einladung. Du kannst dich sehr glücklich schätzen.</br></br> Gewinne <strong> 3 Bronze- und 2 Silbermedaillen</strong>, um diese Saison abzuschließen.

series16_event1=Der Ferrari F40, eine echte Supersportwagen-Ikone, und für einige noch immer für der letzte und beste analoge Supersportwagen, der je gebaut worden ist. Diese spezielle S3-Version hat einen ab Werk getunten Motor und Slicks. Kein ABS, keine Traktionskontrolle. Kannst du die Grenzen dieses Autos finden, oder stößt du vorher an deine eigenen?

series16_event2=Der 599XX kommt direkt aus Ferraris Forschungs- und Entwicklungsprogramm und ist ein echtes Rennlabor auf Rädern und dazu noch extrem schnell. Mit 750 PS und aktiver Aerodynamik es er auf der Rennstrecke eine unwiderstehliche Herausforderung. Ferraris Mugello-Rennstrecke ist für diesen Wagen wie gemacht.

series16_event3=Die enorme Leistung, die aktive Aerodynamik gepaart mit den Slicks machen den Ferrari 599XX EVO zu einem der schnellsten Autos, die je die Nordschleife gefahren sind. Doch keiner ist so verrückt, diesen Wagen auf dem gesamten Ring zu fahren. Ein Rennen auf der Nürburgring GP-Strecke ist mehr als eine Herausforderung und zieht Supersportwagen-Liebhaber von nah und fern an.

series16_event4=Der Pagani Zonda ist bereits eines der begehrenswertesten Autos der Welt. Der Zonda R nimmt alles, was wir an Paganis Autos lieben, zum Quadrat. Leicht, leistungsstark, für Rennen gemacht. Du glaubst gar nicht, wie schnell man eine Runde in Silverstone fahren kann. Doch kannst dich auch gegen andere Wagen dieses Kalibers behaupten?

series16_event5=Der Pagani Zonda R fährt so schnell durch die am Hang gelegenen Passagen von Imola, dass dir ganz schwindelig wird, wenn du nicht aufpasst. Und dann stell dir noch vor, dass um dich herum andere Supersportwagen verbissen um den Sieg ringen!

series16_event6=Nach dem extremen Zonda R hat niemand Pagani zugetraut, etwas noch extremeres und gleichzeitig straßentaugliches zu schaffen. Das war ein Irrtum. Der Pagani Huayra kommt auf den Geraden von Monza ganz locker bis auf 300km/h. Können die 4 voneinander unabhängigen, aktiven Aerodynamikklappen ihn schnell genug für die engen Schikanen abbremsen?

series16_event7=Die Legende des berühmtesten Sportwagenherstellers wird mit dem Supersportwagen namens LaFerrari fortgesetzt. Dieses unglaubliche technische Wunder erzeugt mittels Hybrid-Technologie 963 PS, und zusammen mit der aktiven Aerodynamik und dem hochmodernen Chassis könnte er andere Supersportwagen alt aussehen lassen. Beweise im Kampf der Titanen in Spa Francorchamps, dass dem wirklich so ist.

series16_name=Supersportwagen
series17=Willkommen bei der GT Advanced Series!</br></br> Deine hervorragende Leistung mit verschiedenen Autos hat dir einen Ruf als Gentleman-Rennfahrer eingebracht. Verschiedene Teams mit GT3- und sogar GT2-Wagen sind auf der Suche nach Fahrern wie dir.</br></br> Gewinne mindestens <strong>3 Bronze- und 2 Silbermedaillen</strong>, um die GT-Teams zu beeindrucken.

series17_event1=Du hast die Gelegenheit, den BMW Z4 GT3 auf der Nürburgring GP-Strecke zu fahren. Der BMW ist einer der leistungsstärksten GT3-Wagen und kann daher beim Bremsen etwas unruhig werden. Bremse auf Geraden und nutze die Leistung, um schnell herauszubeschleunigen.

series17_event2=Das BMW Z4 GT3-Team bietet noch einmal den Fahrersitz an, diesmal auf der Vallelunga-Rennstrecke. Das üppige Drehmoment dieses BMW ist perfekt für das Herausbeschleunigen aus den langsamen Haarnadelkurven von Vallelunga. Wenn die Abnutzung der Reifen dir Probleme bereitet, solltest du während der Fahrt die Tranktionskontrolle anpassen.

series17_event3=Ein McLaren MP4 GT3-Team bietet dir ihren Wagen für ein Rennen in Silverstone an. Der McLaren ist ein extrem starkes Auto, doch der Turbo und das rasiermesserscharfe Handling können gefährlich sein. Fahre besser ein sicheres Setup. Es mag anfangs zwar etwas langsam sein, doch wenn sich die Reifen wird es sich als stabiler erweisen.

series17_event4=Noch ein Rennen mit dem blitzschnellen McLaren MP4 GT3, dieses Mal in Mugello. Die langen, schnellen Kurven ziehen die Reifen in Mitleidenschaft, was du nicht unterschätzen solltest. Stell den Heckflügel lieber einen Klick höher ein und sei auf der sicheren Seite, statt mit einem flachen Flügel einen Dreher hinzulegen.

series17_event5=Das Mercedes SLS GT3-Team war von deinem Tempo beeindruckt. Sie bieten dir ihren Wagen für das Rennen in Imola an. Der Mercedes ist sehr leistungsstark, besonders bei langsamen bis mittleren Geschwindigkeiten. Die Kerbs von Imola können das Auto destabilisieren und zu Traktionsverlust führen, weshalb du mit der Traktionskontrolle arbeiten solltest.

series17_event6=Monza ist die perfekte Rennstrecke für den extrem leistungsstarken Mercedes SLS. Selbst wenn du mit den vorigen Rennen Probleme hattest, bietet sich dir hier die perfekte Gelegenheit, um ein paar wichtige Punkte aufzuholen. Fahre um den Sieg!

series17_event7=Die Scuderia Glickenhaus setzt eigentlich nur Fahrer mit Erfahrung ein, doch sie sind bereit, eine Ausnahme zu machen. Spa Francorchamps eine technisch sehr anspruchsvolle Rennstrecke. Der P4/5 Competizione hat massenhaft Grip, jedoch keine sehr gute Höchstgeschwindigkeit. Ein Sieg ist wohl nicht zu schaffe, aber kannst du eine gute Platzierung herausfahren?

series17_name=GT Advanced Series
series18=Willkommen bei der BMW GT3 Series!</br></br> BMW heißt dich in seinem GT3-Ausdauerteam willkommen. Du wirst eine ganze Saison lang mit Werksunterstützung einen Z4 GT3 fahren.</br></br> Das Team denkt, dass du <strong>60 Punkte in der Meisterschaft</strong> holen solltest.

series18_event1=Der BMW Z4 GT3 ist definitiv ein fantastisches Siegerauto. Beim Z4 macht sich schon die kleinste Änderung im Setup sehr stark bemerkbar, weshalb wir in diesem ersten Rennen nur Anpassungen vornehmen, die uns in Zukunft ein sicheres Handling garantieren. 1-6 Front-/Heckflügel. Bremsbalance 74% vorn. Federrate vorn auf 200, Stabilisator vorn auf 8. Höhe vorn auf 7 und hinten auf 30. Differential-Sperrwert im Freilauf auf 60%. Damit sollte der Wagen schnell genug und stabil für das erste Rennen sein.

series18_event2=Vallelunga ist eine relativ sichere Rennstrecke, daher können wir ein etwas gewagteres Setup für mehr Höchst- und Kurvengeschwindigkeiten fahren. Stell Front-/Heckflügel auf 0-4. Bremsbalance 74% vorn, da das Auto beim Bremsen immer etwas unruhig wird. Federrate vorn auf 200 und Stabilisator vorn auf 6. Du hast damit in Kurvenausfahrten vielleicht immer noch Probleme, also nutze die Traktionskontrolle auf Stufe 5-7.

series18_event3=Silverstone ist eine sehr schwierige Rennstrecke, geh lieber auf Nummer sicher. Ich empfehle 1-6 Front-/Heckflügel, Stabilisator vorn auf 8 und Bremsbalance 74% vorn. Das Wetter ist kalt, weshalb du das Rennen auf Mediums bestreiten können solltest, doch es gibt immer das Risiko, dass sie überhitzen. Wenn du merkst, dass du Probleme hast, dann wechsle auf harte Reifen und senke den Druck um 3 Klicks.

series18_event4=Wir müssen das unruhige Heck unseres Autos bändigen und dabei gute Geschwindigkeiten in den Kurven von Mugello erreichen. Beginnen wir mit 1-6 Front-/Heckflügel. Wir werden ein sehr steifes Setup ausprobieren, um die Reifen besser zu belasten. Federweg vorn auf 70. Stabilisator vorn auf 10, Höhe vorn auf 8. Federweg hinten auf 70. Federrate hinten auf 90, Höhe hinten auf 20, Stabilisator hinten auf 6. Harte Reifen 24-25 Front/Heck. Lass es auf der ersten Runde ruhig angehen, lass die Reifen richtig warm werden und greif dann an.

series18_event5=Wie gewöhnlich in Imola müssen wir alles daran setzen, die Kerbs abzufedern. Stell Front-/Heckflügel auf 1-6. Federweg hinten auf 70. Stabilisator vorn auf 6, hinten auf 0. Stoßdämpfer hinten auf 10, schnelle Kompression auf 34. Schneller Rücklauf hinten auf 25. Bremsbalance 74% vorn. Medium-Reifen auf 23-22 Front/Heck. Traktionskontrolle auf Stufe 7 sollte perfekt passen.

series18_event6=Der BMW hat einen fantastischen Motor, wir sollten nur die Aerodynamik zu optimieren versuchen, indem wir den Heckflügel so flach wie möglich einstellen. Stell die Aerodynamik auf 0-3 Front/Heck. Harte Reifen sind ein Muss, Druck 29-25 Front/Heck. Bremsbalance 79% vorn zum bestmöglichen Stabilisieren des Autos beim Bremsen. Stabilisator vorn auf 5, Federrate vorn 190. Höhe vorn 10, Höhe hinten 28, Stabilisator hinten 0. Längere Übersetzung im letzten Gang von 10-47. Traktionskontrolle auf Stufe 8.

series18_event7=Das letzte Rennen ist Spa Francorchamps. Wir sollten ein gutes Ergebnis herausfahren, vielleicht nehmen wir daher ein etwas riskanteres Setup. Behalte die Medium-Reifen mit 0-4 Front-/Heckflügel. Eine Traktionskontrolle auf Stufe 7 hilft beim Herausbeschleunigen aus Kurven. Federrate vorn auf 200 für gutes Einlenken und Stabilität beim Bremsen. Höhe vorn auf 6 und hinten auf 26, damit der Diffusor wirkt. Und schließlich Bremsbalance 74% vorn. Das Auto wird sich nicht leicht fahren lassen, aber es sollte schnell sein. Hol dir den Sieg!

series18_name=GT BMW Z4 GT3 Series
series19=Willkommen bei der BMW GT3 Extreme Series!</br></br> BMW heißt dich in seinem GT3-Ausdauerteam willkommen. Du wirst eine ganze Saison lang mit Werksunterstützung einen Z4 GT3 fahren. Zudem wirst du für das Training und das Qualifying am Rennwochenende verantwortlich sein.</br></br> Das Team denkt, dass du <strong>60 Punkte in der Meisterschaft</strong> holen solltest.

series19_event1=Der BMW Z4 GT3 ist definitiv ein fantastisches Siegerauto. Beim Z4 macht sich schon die kleinste Änderung im Setup sehr stark bemerkbar, weshalb wir in diesem ersten Rennen nur Anpassungen vornehmen, die uns in Zukunft ein sicheres Handling garantieren. 1-6 Front-/Heckflügel. Bremsbalance 74% vorn. Federrate vorn auf 200, Stabilisator vorn auf 8. Höhe vorn auf 7 und hinten auf 30. Differential-Sperrwert im Freilauf auf 60%. Damit sollte der Wagen schnell genug und stabil für das erste Rennen sein.

series19_event2=Vallelunga ist eine relativ sichere Rennstrecke, daher können wir ein etwas gewagteres Setup für mehr Höchst- und Kurvengeschwindigkeiten fahren. Stell Front-/Heckflügel auf 0-4. Bremsbalance 74% vorn, da das Auto beim Bremsen immer etwas unruhig wird. Federrate vorn auf 200 und Stabilisator vorn auf 6. Du hast damit in Kurvenausfahrten vielleicht immer noch Probleme, also nutze die Traktionskontrolle auf Stufe 5-7.

series19_event3=Silverstone ist eine sehr schwierige Rennstrecke, geh lieber auf Nummer sicher. Ich empfehle 1-6 Front-/Heckflügel, Stabilisator vorn auf 8 und Bremsbalance 74% vorn. Das Wetter ist kalt, weshalb du das Rennen auf Mediums bestreiten können solltest, doch es gibt immer das Risiko, dass sie überhitzen. Wenn du merkst, dass du Probleme hast, dann wechsle auf harte Reifen und senke den Druck um 3 Klicks.

series19_event4=Wir müssen das unruhige Heck unseres Autos bändigen und dabei gute Geschwindigkeiten in den Kurven von Mugello erreichen. Beginnen wir mit 1-6 Front-/Heckflügel. Wir werden ein sehr steifes Setup ausprobieren, um die Reifen besser zu belasten. Federweg vorn auf 70. Stabilisator vorn auf 10, Höhe vorn auf 8. Federweg hinten auf 70. Federrate hinten auf 90, Höhe hinten auf 20, Stabilisator hinten auf 6. Harte Reifen 24-25 Front/Heck. Lass es auf der ersten Runde ruhig angehen, lass die Reifen richtig warm werden und greif dann an.

series19_event5=Wie gewöhnlich in Imola müssen wir alles daran setzen, die Kerbs abzufedern. Stell Front-/Heckflügel auf 1-6. Federweg hinten auf 70. Stabilisator vorn auf 6, hinten auf 0. Stoßdämpfer hinten auf 10, schnelle Kompression auf 34. Schneller Rücklauf hinten auf 25. Bremsbalance 74% vorn. Medium-Reifen auf 23-22 Front/Heck. Traktionskontrolle auf Stufe 7 sollte perfekt passen.

series19_event6=Der BMW hat einen fantastischen Motor, wir sollten nur die Aerodynamik zu optimieren versuchen, indem wir den Heckflügel so flach wie möglich einstellen. Stell die Aerodynamik auf 0-3 Front/Heck. Harte Reifen sind ein Muss, Druck 29-25 Front/Heck. Bremsbalance 79% vorn zum bestmöglichen Stabilisieren des Autos beim Bremsen. Stabilisator vorn auf 5, Federrate vorn 190. Höhe vorn 10, Höhe hinten 28, Stabilisator hinten 0. Längere Übersetzung im letzten Gang von 10-47. Traktionskontrolle auf Stufe 8.

series19_event7=Das letzte Rennen ist Spa Francorchamps. Wir sollten ein gutes Ergebnis herausfahren, vielleicht nehmen wir daher ein etwas riskanteres Setup. Behalte die Medium-Reifen mit 0-4 Front-/Heckflügel. Eine Traktionskontrolle auf Stufe 7 hilft beim Herausbeschleunigen aus Kurven. Federrate vorn auf 200 für gutes Einlenken und Stabilität beim Bremsen. Höhe vorn auf 6 und hinten auf 26, damit der Diffusor wirkt. Und schließlich Bremsbalance 74% vorn. Das Auto wird sich nicht leicht fahren lassen, aber es sollte schnell sein. Hol dir den Sieg!

series19_name=BMW Z4 GT3 Extreme Series
series1_event1=Der kleine Abarth 500 EsseEsse ist ein Einsteigerauto.. Er macht Spaß und ist leicht zu beherrschen. Übe in diesem Zeitfahren auf der Vallelunga-Rennstrecke und bereite dich auf dein erstes Rennen vor.

series1_event2=Der örtliche Abarth-Klub veranstaltet ein kleines Rennen. Zeig in diesem rasanten Rennen über 3 Runden, was du drauf hast.

series1_event3=Du gewinnst das Vertrauen der anderen Autoliebhaber. Ein Freund leiht dir seinen Alfa Romeo Giulietta QV für ein Zeitfahren auf der Magione-Rennstrecke. Zeig ihm, dass du würdig bist!

series1_event4=Du warst sehr gut, und deshalb bekommst du die Gelegenheit, den wunderschönen Alfa Romeo Giulietta QV in einem regionalen Rennen in Magione zu fahren. Behalte die Ortsansässigen im Auge, sie scheinen bei ein paar Abarths die Reifen, Aufhängung und den Motor verbessert zu haben. Zeig ihnen, was du in einem Rennen über 5 Runden drauf hast.

series1_event5=Eines der Merkmale der Magione-Rennstrecke ist, dass es oft staubig ist. Du hast die Gelegenheit, eine getunten BMW M3 E30 auf einer staubigen Oberfläche mit verringertem Grip zu fahren. Achte auf deine Bremspunkte und das Übersteuern.

series1_name=Novice Series 1
series2=Herzlichen Glückwunsch zum Freischalten der Novice Series 2! </br></br>Du hast dich in der ersten Rennserie behauptet, also ist es jetzt Zeit, ein paar Autos mit richtigem Heckantrieb zu fahren. BMW produziert einige der besten Sportwagen, die nicht nur schnell und packend sind, sondern auch deine Fahrkünste verbessern können, weil sie sich leicht am Limit fahren lassen. </br></br> Gewinne <strong> 2 Bronze- und 1 Silbermedaille</strong>, um diese Rennserie erfolgreich abzuschließen.

series20=Willkommen im McLaren GT3-Team!</br></br> Das McLaren GT3-Ausdauerprogramm fördert die besten neuen Fahrer mit einer Ausdauermeisterschaft über eine ganze Saison.</br></br> Das Team erwartet mindestens <strong>60 Punkte in der Meisterschaft.</strong>

series20_event1=Die Ausdauermeisterschaft beginnt auf der Nürburgring GP-Strecke. Deine Renningenieure raten dir, im ersten Rennen ein sicheres Setup für deinen McLaren MP4 12C GT3 zu wählen. Fahre auf Medium-Reifen und verringere vorn und hinten den Druck um 2 Klicks. Benutze eine Heckflügel-Einstellung von 6 mit einer etwas kürzeren Übersetzung im letzten Gang. Versuche, das Auto sicher nach Hause zu fahren: Die Meisterschaft ist noch lang und wir können aggressiver fahren, wenn den Wagen besser kennst.

series20_event2=Vallelunga ist eher eine Stop-and-Go-Strecke. Lass uns ein etwas aggressiveres Setup ausprobieren. Frontflügel auf 1, Heckflügel auf 5. Reifendruck vorn 2 Klicks tiefer, hinten 1 Klick tiefer. 1 Klick mehr für den Stabilisator hinten und vielleicht möchtest du 1 Klick mehr Bremsbalance hinten. Versuche eins nach dem anderen aus und du wirst sehen. Wenn du bei der Ausfahr aus langsamen Kurven Probleme hast, stell die Traktionskontrolle auf 6 oder 7.

series20_event3=Silverstone hat ein paar sehr tückische Kurven und geht auf die Reifen. Behalte den Standarddruck der Medium-Reifen bei. Da es weniger auf Höchstgeschwindigkeit und mehr auf Grip bei hohen Geschwindigkeiten ankommt, empfehle ich dir für die Aerodynamik die Standardeinstellung. Vielleicht 2 Klicks mehr beim Stabilisator vorn. Wenn du weiterhin Probleme beim Bremsen in Kurven hast, dann verschiebe die Bremsbalance 2 Klicks nach vorn. Verkürze wieder die Übersetzung im letzten Gang um 1 Klick.

series20_event4=Die Mugello-Rennstrecke setzt Reifen, Fahrer und Setup gleichermaßen zu. Wenn die Temperatur zu hoch ist, musst du hier vielleicht harte Reifen aufziehen. Stelle die Front-/Heckflügel auf 0-4 ein, um die Höchstgeschwindigkeit auf der langen Geraden zu optimieren. Verringere die Federrate vorn um 2 Klicks und hinten um 4 Klicks, um das Auto abzusenken und die Wirkung des Diffusors zu erhöhen. Benutze für das Differential einen Sperrwert von 20%, um das Auto schneller und in langen Kurven besser zu machen. Eine Bremsbalance von 73 stabilisiert das Auto beim Bremsen. Übersetzung im 6. Gang um 1 Klick verkürzen.

series20_event5=Imola ist ein sehr tückischer Kurs. Die Stoßdämpfer müssen stark modifiziert werden, damit du beim Überfahren der Kerbs genug Stabilität hast. Senke den Druck der Mediums um 2 Klicks. Rücklauf vorn auf 12, Kompression vorn auf 15. Kompression hinten auf 5. Schnelle Kompression hinten auf 30. Federweg hinten auf 70. Stabilisator hinten auf 0. Differential-Sperrwert auf 40%. Übersetzung im letzten Gang um 1 Klick verkürzen.

series20_event6=In Monza dreht sich alles um die Höchstgeschwindigkeit und Wendigkeit in den langsamen Schikanen. Beginnen wir mit 0-1 Front-/Heckflügel. Die Aufhängungshöhe ist 24-21 Front/Heck. Benutze harte Reifen mit einem Druck von 29-27 Front/Heck. Achte auf Überhitzung. Stabilisator vorn auf 7. Stabilisator hinten auf 0. Erhöhe die Bremsbalance vorn auf 71 für mehr Stabilität beim Einlenken in Kurven. Nimm dich beim Rennstart in Acht, in der ersten Schikane kommt es oft zu Zusammenstößen.

series20_event7=Spa ist eine Strecke, die alles hat: Langsame und schnelle Kurven ähnlich wie in Silverstone, aber dazu noch mit fantastischen Hügeln und Hochgeschwindigkeitsgeraden. Beginne mit 0-4 Front-/Heckflügel. Stabilisator vorn auf 7, um etwas Stabilität zurückzugewinnen. Es kann sein, dass du harte Reifen brauchst, verringere in diesem Fall den Druck um 3 Klicks. Übersetzung im 6. Gang 1 Klick kürzer. Bremsbalance 72% vorn.

series20_name=McLaren MP4 GT3 Series
series21=Willkommen im McLaren GT3-Werksteam!</br></br> Das McLaren GT3 Extreme-Programm verlangt dir eine ganze Ausdauersaison lang deine volle Hingabe ab. An den Rennwochenenden kämpfst du nicht nur in den Rennen, sondern auch im Training und im Qualifying.</br></br> Das Team erwartet mindestens <strong>60 Punkte in der Meisterschaft.</strong>

