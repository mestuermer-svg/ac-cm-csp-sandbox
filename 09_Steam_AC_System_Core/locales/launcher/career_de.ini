series27_name=Ferrari 458 GT2 Extreme
series28=Der absolute Gipfel des Motorsports!</br></br> Die fantastischen Formelwagen der Vergangenheit glänzen und lärmen sie auch heute noch. Dank der Leidenschaft ihrer Besitzer fahren diese Autos auch heute noch Rennen mit Profifahrern im Cockpit, die diese Fahrzeuge respektieren und ihre Grenzen finden können.</br></br> Gewinne <strong>3 Bronze-, 2 Silber- und 1 Goldmedaille</strong>.

series28_event1=Das Classic Team Lotus bittet dich, ihren gut erhaltenen Lotus 49 zu fahren. Dieser Rennwagen ist eine der größten technischen Errungenschaften in der Geschichte der Formel 1. Die Leistung ist atemberaubend und das Auto ist extrem leicht. Überraschenderweise kannst du mit ihm durch Kurven driften, doch pass bei den Bremswegen auf. Hohe Geschwindigkeiten und fehlendes ABS bedeuten, dass du viel früher als gewohnt mit dem Bremsen anfangen solltest.

series28_event2=Für das Classic Team Lotus den Type 49 fahren zu können, wird dir die Augen öffnen. Doch kannst du dir vorstellen, diesen Wagen 1967 in Monza zu fahren. Die Strecke von heute ist der von damals sehr ähnlich, doch es gab eine Schikanen, in denen man langsamer fahren musste. Schließe deine Augen und reise zurück durch die Zeit in eine Ära, als Rennen gefährlich und ... "du weißt schon was" als ungefährlich galt.

series28_event3=Der Ferrari 312T hat 1975 mit Niki Lauda und Clay Regazzoni sowohl die Fahrer- als auch die Konstrukteursmeisterschaft für Ferrari gewonnen. Heute kannst du den Wagen in Imola fahren, und so am Steuer einer Legende das Gefühl vergangener Schlachten nachempfinden.

series28_event4=Das Lotus Exos-Kundenprogramm kommt für eine Testfahrt nach Silverstone. Lotus bittet Profifahrer, die Autos auf Herz und Nieren zu überprüfen, bevor ihre Kunden sie Probe fahren. Bring den Lotus Exos an seine Grenzen und sorge dafür, dass die potentiellen Kunden beeindruckt sind.

series28_event5=Deine letzte Vorstellung mit dem Exos 125 in Silverstone hat das Team von Lotus überzeugt, die als Gast zu einem Rennen mit dem Lotus Exos 125 S1 einzuladen. Das Rennen wird in Mugello stattfinden und du hast das ganze Rennwochenende Zeit, das richtige Setup für den Wagen zu finden, um im Rennen so gut wie möglich zu sein. Viel Glück!

series28_event6=Das Classic Team Lotus ist beeindruckt von deiner letzten Leistung. Sie denken, dass du der Aufgabe gewachsten bist, einen Wagen von unermesslichem Wert zu fahren. Den Lotus 98T, den Ayrton Senna 1985 gefahren ist. Die berühmte Turbo-Ära, in der die leistungsstärksten Formel-1-Autos entwickelt wurden, mit über 1000 PS im Qualifying-Konfiguration. Nur die Besten können ein so anspruchsvolles Auto am Limit beherrschen. Vielleicht bist du einer der Wenigen, die das Zeug dazu haben.
series28_name=Formel
series2_event1=Du hast soeben die Welt von BMW betreten und hast die Gelegenheit, gegen einige der markantesten Modelle dieses Herstellers zu fahren. Bestreiten wir unser Training in der Heimat der deutschen Autos, auf dem Nürburgring. Zur Teilnahme an der BMW Challenge musst du im folgenden Zeitfahren mindestens 1200 Punkte erreichen: Bist du bereit?

series2_event2=Der BMW-Klub organisiert zum Spaß Rennen für seine Mitglieder. Da du großes Talent bewiesen hast, wurdest du als Gastfahrer eingeladen und dir wird ein BMW Z4 35is zur Verfügung gestellt. Er ist zwar nicht der schnellste BMW im Feld, doch er kann sich auf den langen Geraden von Monza gegen die anderen behaupten.

series2_event3=Das zweite BMW-Klubrennen. Der kleine aber legendäre M3 E30 ist dein. Dieses Auto ist extrem agil, ihm fehlt es jedoch an Leistung. Auf der Nürburgring GP-Strecke bleiben dir einige der langen Geraden erspart, weshalb du vielleicht eine Chance gegen die modernen Autos haben könntest.

series2_event4=Du bist den allerersten M3 gefahren, jetzt ist es Zeit, den Neusten auszuprobieren. Das Chassis ist fantastisch und der donnernde V8 bringt eine enorme Leistung. Gib alles! Wir denken, dass du aufs Treppchen fahren kannst.

series2_event5=Auch wenn der M3 den Namen inne hat, glauben viele, dass das leichtere, kleinere und wendigere 1er M Coupé der wahre Nachfolger des ursprünglichen M3 ist. Es verfügt über weniger Leistung, hat aber ein größeres Drehmoment und der Turbomotor kann das Handling im Grenzbereich schwieriger machen. Hast du das Zeug dazu, erneut aufs Treppchen zu fahren?

series2_event6=Was für eine fantastische Leistung! Die Motorsportabteilung von BMW hat dich genau beobachtet. Sie bieten dir die Gelegenheit, eine Testfahrt in einem echten Rennwagen zu absolvieren! Du kannst ein Zeitfahren im glorreichen BMW Z4 GT3 bestreiten. Mach das Beste draus.

series2_name=Novice Series 2
series3=Glückwunsch! Du trittst nun in der Novice Series 3 an. </br>Ein kleiner, aber sehr bekannter österreichischer Hersteller hat dich beim Fahren der BMWs beobachtet. KTM, ist berühmt für seine Motorräder, doch dieser Hersteller hat auch einen der modernsten und extremen Rennwagen auf dem Markt geschaffen. Der KTM X-Bow R steht dir für eine Rennserie zur Verfügung.</br></br>Gewinne<strong> 2 Bronze- und 1 Silbermedaille</strong>, um die Ingenieure von KTM zu beeindrucken.

series3_event1=Willkommen in der Welt der Ultraleicht-Autos. Der KTM X-BOW-R gilt als eines der aufregendsten Autos seiner Sparte. Jetzt hast du die Gelegenheit, sein Handling und seine Leistung auf einem der anspruchsvollsten Rennstrecken zu erleben: auf dem Autodromo Enzo e Dino Ferrari in Imola.

series3_event2=KTM organisiert ein Rennen für seine Mitarbeiter. Du wurdest als Gast eingeladen und darfst einen KTM X-BOW R fahren. Erreiche mindestens den dritten Platz, um das Auto zu gewinnen und in der X-BOW R Challenge fahren zu können!

series3_event3=Du hast vor Kurzem dein Talent auf der Vallelunga-Klubrennstrecke unter Beweis gestellt, und jetzt ist es Zeit für die GP-Strecke. Der X-BOW R ist das perfekte Auto für diese italienische Rennstrecke. Behalte stets im Hinterkopf, dass man in der Campagnano-Kurve gut überholen kann!

series3_event4=Die letzte Chance, deinen eigenen X-BOW R zu gewinnen. Die Kurzstrecke des Nürburgrings birgt keinerlei Geheimnisse für dich. Lass dir diese Gelegenheit nicht entgehen!

series3_event5=Du bist nun Besitzer eines X-BOW R und kannst jetzt seine natürlichen Feinde herausfordern. Es sei denn, du hast auf einmal Angst ...

series3_name=Novice Series 3
series4=Willkommen bei der Novice Series 4.</br></br>Deine unglaubliche Leistung mit dem KTM hat für Aufsehen gesorgt. X-BOW ist ein einmaliges Fahrzeug vom Hersteller mit der längsten Tradition im Bau von Ultraleicht-Autos. <strong>Lotus</strong> sucht nach Fahrern und du musst an deiner Technik in Fahrzeugen mit Mittelmotor feilen.</br></br>Gewinne <strong>3 Bronze- und 1 Silbermedaille </strong> in dieser Rennserie.

series4_event1=Lotus. Nur wenige andere Marken können es mit der Legende Lotus aufnehmen. Du hast die Gelegenheit, ihren leichten Einsteiger-Sportwagen zu fahren, und wenn du das gut machst, wirst du vielleicht als Gast zu vielen Lotus-Events eingeladen.

series4_event2=Du warst großartig! Jetzt kannst du zum Exige 240R aufsteigen, der sich sehr ähnlich handhaben lässt. Doch pass auf: Auch wenn das Handling ähnlich ist, so ist er doch um einiges schneller! Deine Mitstreiter sind erfahrene Lotus-Enthusiasten und manche sind sogar professionelle Rennfahrer. Es wird nicht leicht.

series4_event3=Auf dem Silverstone International Layout findet ein Klubrennen statt. Die meisten Enthusiasten denken, dass der Evora nur ein Gran Turismo ist, doch mit einem leicht getunten Lotus Evora S2 solltest du deinen Kontrahenten im Wettbewerb zeigen können, wo es lang geht.

series4_event4=Die Ingenieure von Lotus wollen die Grenzen des Lotus Exige S austesten. Der Name mag vertraut sein, doch es handelt sich um ein brandneues Chassis mit einem leistungsstarken V6. Du musst in diesem Zeitfahren antreten und herausfinden, wozu dieses Auto im Stande ist, wenn man es an seine Grenzen bringt.

series4_event5=Nach dem großartigen Zeitfahren hast du einen Gastfahrer-Ausweis für ein Lotus Exige V6 Cup-Rennen erhalten. Die Fahrer haben viel Erfahrung, also mach dich auf miese Tricks und eine starke Konkurrenz gefasst.

series4_event6=Die Lotus 2-11 Trofeo wird jedes Jahr auf der Magione-Rennstrecke gefahren. Du hast ein Einladung erhalten, aber werd nicht überschwänglich. Der 2-11 hat ein offenes Differential und das kann dazu führen, dass innere Hinterrad in den engen Kurven der italienischen Rennstrecke wie verrückt durchdreht. Das kostet dich Geschwindigkeit und nutzt deine Reifen ab, wenn du nicht aufpasst. Du brauchst die richtige Technik beim Fahren.

series4_event7=Die Lotus-Ingenieure denken, dass du der Richtige bist, um bei der Weiterentwicklung ihres GTC-Wagens zu helfen. Du sollst auf der sehr schwierigen Strecke von Imola ein Zeitrennen in einem brandneuen Lotus Evora GTC-Rennwagen absolvieren. Die Tagestemperaturen sind sehr hoch, also achte auf Überhitzung. Passe das Setup an deine Bedürfnisse an und fahr bis ans Limit!

series4_name=Novice Series 4
series5=Glückwunsch zur Teilnahme an der Intermediate Series 1!</br></br>Wenn du für eine große Marke wie Lotus derart gut fährst, braucht man sich nicht wundern, dass auch andere britische Hersteller dich im Auge behalten ... Doch wenn plötzlich das Telefon klingelt und McLaren anfragt, ist es nicht gerade leicht, ruhig und gelassen zu bleiben. </br></br>Gewinne <strong>2 Bronze- und 1 Silbermedaille</strong>, und stelle unter Beweis, dass du all die leistungsstarken Autos beherrscht!

series5_event1=Ein Supersportwagen-Rennklub veranstaltet auf verschiedenen Strecken in Europa Rennen für Enthusiasten. McLaren braucht einen Fahrer, der ihren neuen McLaren MP4 12C bis an seine Grenzen fahren und die Qualitäten dieses Supersportwagens hervorheben kann. Das erste Rennen findet auf der Vallelunga-Rennstrecke statt.

series5_event2=Das zweite Supersportwagenrennen in Mugello. Ferraris Mugello-Rennstrecke ist einer der schwierigsten Kurse überhaupt mit seinen langen, schnellen Kurven, die teilweise am Hang gelegen sind. Ein McLaren auf Ferraris Rennstrecke ist an sich schon eine sehr emotionale Herausforderung.

series5_event3=Die Supersportwagen-Rennserie macht an der Nürburgring GP-Strecke halt. Stell dich ein auf ein großes Kontingent an deutschen Herstellern mit ihren üblichen Sportwagen, plus ein paar Überraschungen.

series5_event4=Silverstone sollte die Heimatstrecke von McLaren sein. Trotzdem hat der Kurs einige sehr schnelle Links-Rechts-Abfolgen, die den Wagen an seine Grenzen bringen könnten. Einige andere britische Sportwagen schaffen es vielleicht, ihre Reifen schonend zu fahren. Achte gegen Ende des Rennens auf diese potentielle Gefahr.

series5_event5=In Monza ist Geschwindigkeit Trumpf. Die Formel-1-Strecke mit den schnellsten Geraden. In einem Auto wie dem McLaren kann man unglaubliche Höchstgeschwindigkeiten erreichen, doch vergiss nicht, dass du noch auf für die Straße zugelassenen Reifen fährst, also denk an deine Bremswege. Es wird zudem gemunkelt, dass ein paar seltene Ferraris dabei sein könnten.

series5_name=Intermediate Series 1
series6=Die Intermediate Series 2!</br></br>Ab jetzt wird es immer nur noch besser. Mercedes Benz bietet dir eines der ikonischsten Autos aller Zeiten an. Der AMG SLS kann nur von jemandem mit Erfahrung an seine Grenzen gefahren werden. Bist du dieser Aufgabe gewachsen?</br></br>Gewinne <strong>2 Bronze- und 1 Silbermedaille</strong>, um die Silberpfeil-Rennserie abzuschließen.

series6_event1=Mercedes Benz veranstaltet einige offene Klubrennen für ihre Kunden. Sie bieten dir einen brandneuen Mercedes SLS AMG an. Das erste Event findet auf der Nürburgring GP-Strecke statt.

series6_event2=Imola ist der Schauplatz des zweiten Mercedes-Klubrennens. Der SLS AMG ist ein extrem starker Sportwagen, doch Imola ist so gefährlich wie eh und je, also gib besonders beim Überfahren der Kerbs Acht.

series6_event3=In Silverstone ist es in der Regel kalt. Sorge dafür, dass deine Reifen stets auf Temperatur sind, aber vermeide Überhitzen in den sehr schnellen Kurven.

series6_event4=Spa Francorchamps ist eine fantastische Rennstrecke. Für sie braucht man Motorleistung, zuverlässiges Handling, Wendigkeit und Grip. Der Mercedes SLS AMG hat all das und mit deinem Können solltest du auf diesem Kurz glänzen. Doch die Konkurrenz ist sehr stark, jeder liebt es, in Spa Rennen zu fahren.

series6_event5=Keine Strecke hat längere Geraden als Monza. Wenn es einen Kurs gibt, auf dem der SLS AMG sich so richtig austoben kann, dann dieser.

series6_name=Intermediate Series 2
series7=Gut gemacht! Du hast die Intermediate Series 3 freigeschaltet.</br></br>Ferrari! Die wertvollste Automarke der Welt. Ferrari nimmt mit ihren Fahrern und Autos normalerweise nicht an Tagesrennen Teil, doch wenn sie es einmal tun, dann wählen sie nur die Besten ... und sie haben dich auserkoren! Das ist eine einmalige Gelegenheit, sich hervorzutun.</br></br>Gewinne <strong>2 Bronze- und 2 Silbermedaillen.</strong>

series7_event1=Ein namhaftes Automagazin hat deine Entwicklung beobachtet und möchte, dass du für sie exotische Autos testest. Das ist eine fantastische Gelegenheit für dich, denn so werden die Hersteller der exotischen Autos auf dich aufmerksam. Der erste Test ist mit dem fantastischen Ferrari 458 Italia in Imola angesetzt.

series7_event2=Ein umfassender Supersportwagentest wird in Monza abgehalten. Das hervorragende Handling des Ferrari 458 wird dir in diesem Rennen ganz sicher helfen, doch die anderen Supersportwagen haben genauso viel oder sogar noch mehr Leistung, und du weißt ja, wie wichtig Leistung in Monza ist.

series7_event3=Spa ist eine Strecke, die Reifen schnell zum überhitzen bringen kann. Zum Glück ist die Umgebungstemperatur meist so niedrig, dass die Reifen ausreichend gekühlt werden. Trotzdem sind 4 Runden mit herkömmlichen Reifen auf diesem langen Kurs eine Herausforderung.

series7_event4=Die Strecke befindet sich im Besitz von Ferrari und verlangt Reifen, Auto und Fahrer alles ab. Einige Teams aus der Ferrari Trofeo sind hier und haben ein Auge auf dich geworfen. Wenn du dich hier gut schlägst, kannst du vielleicht eine Saison in der Ferrari 458 S3 Trofeo fahren.

series7_name=Intermediate Series 3
series8=Willkommen bei der National Lotus Lightweight Trofeo.</br></br> In kleinen Tagesrennen gegen andere Enthusiasten anzutreten ist nett, doch das eigentliche Ziel ist, in einer Meisterschaft gegen talentierte Fahrer in vergleichbaren Autos anzutreten.</br></br> Erziele <strong>20 Punkte in der Meisterschaft</strong>, die nächste Rennserie freizuschalten.

series8_event1=Die National Lotus Lightweight Trofeo startet in Magione. Die sehr langsamen Haarnadelkurven und Schikanen von Magione sind perfekt für den wendigen Lotus 2-11. Doch nimm dich vor dem offenen Heckdifferential in Acht. Beschleunige nicht zu stark aus Kurven heraus, um deine Hinterreifen nicht zu stark in Mitleidenschaft zu ziehen.

series8_event2=Monza ist noch ein sehr guter Kurs für den Lotus 2-11. Die Schikanen sind perfekt für die Wendigkeit dieses Autos.  Doch du brauchst trotzdem einen sehr niedrig eingestellten Heckflügel, damit du auf den langen Geraden aus dem Windschatten heraus überholen kannst. Geringer Abtrieb am Heck kann das Handling des Autos in der Ascari und der Parabolica sehr schwierig gestalten.

series8_event3=Einer der anspruchsvollsten Rennstrecken der Welt. Springe über die zahlreichen, hohen Kerbs, bremse auf unebener Oberfläche und bewältige tückische Kurven. Diese Strecke versucht konstant, dich aus der Fahrbahn zu werfen. Und das würde deinen Kontrahenten nur Recht sein ... also tu ihnen nicht diesen Gefallen.

series8_event4=Schnelle Kurven und große Hügel, das ist die Essenz von Mugello. Eine sehr schnelle Rennstrecke, die Präzision und Mut erfordert. Es ist das letzte Rennen der Serie und deine letzte Chance, deine Spitzenplatzierung zu halten!

series8_name=Lotus Lightweight Trofeo
series9=Du hast die Ferrari 458 Trofeo freigeschaltet!</br></br> Ein Fahrer deines Niveaus kann nicht immer nur Tagesrennen bestreiten. Es ist Zeit, dich mit anderen Gentleman-Rennfahrern zu messen. Die Ferrari 458 Trofeo ist eines der faszinierendsten Einzelhersteller-Events der Welt und viele professionelle Teams suchen nach guten Fahrern.</br></br> Erziele <strong> 15 Punkte in der Meisterschaft</strong>, um die Profiteams zu beeindrucken.

series9_event1=Die Ferrari 458 S3 Trofeo startet in Monza. Dank fast 600 PS, geringem aerodynamischem Widerstand und rasanter Beschleunigung erreicht dieser Sportwagen beeindruckende Höchstgeschwindigkeiten. Behalte immer deinen Bremsweg im Kopf, auch wenn du auf Slicks fährst.

series9_event2=Die sehr geringe Höhe des 458 S3 kann dir in den schnellen, unebenen Kurven von Mugello Schwierigkeiten bereiten. Halte dich von den Kerbs fern, wenn du kein großes Risiko eingehen willst.

series9_event3=Die neue Silverstone-Strecke hat eine absolut glatte Oberfläche und ist wie gemacht für den Ferrari 458 S3. Doch einige Kurven und Schikanen sind extrem schnell, weshalb höchste Konzentration erforderlich ist.

series9_event4=Das berühmte Spa Francorchamps. Versuche einfach nur, in der Eau Rouge nicht aus der Kurve zu fliegen. Die restlichen Kurven sind zwar schwierig, aber nicht unmöglich zu durchfahren.

series9_event5=Imola ist eine sehr technische Rennstrecke. Achte besonders auf den bergab gelegenen Bremsbereich der Rivazza. Vielleicht ist es besser, vor dem abschüssigen Abschnitt in der leichten Rechtskurve vom Gas zu gehen und dann zu bremsen und das Auto per ABS zu stabilisieren.

series9_event6=Die Nürburgring GP-Strecke mag nicht die majestätische Aura der längeren Nordschleife haben, doch sie ist dennoch sehr anspruchsvoll. An den mindestens 3 Stellen für Überholmanöver brauchst du ein beim Bremsen stabiles Auto, um einen Vorteil herauszufahren.

series9_name=Ferrari 458 Trofeo
