series24=Du fährst für das BMW GT2-Werksteam!</br></br> Das ist ein großer Erfolg für jeden professionellen Rennfahrer. Das Auto ist inzwischen in die Jahre gekommen, doch es kann immer noch mithalten und das Team erwartet vollen Einsatz von dir.</br></br> Eine starke Leistung mit mindestens <strong>60 Punkten </strong>wird genug sein.

series24_event1=Wie du bestimmt weißt, hat unser Auto eine gute Erfolgsserie und wir haben ein Grundsetup, von dem wir wissen, dass es funktioniert. Wir lassen dich dieses Grundsetup im ersten Rennen kennen lernen und schlagen dann kleine Änderungen vor, die zu deinem Fahrstil passen. Stell Front-/Heckflügel auf 2-4. Übersetzung im letzten Gang von 10/50 und im 6. Gang 34/31. Mediums vorn und hinten mit einem Druck von 21.

series24_event2=Wir starten mit dem Setup für die Nürburgring GP-Strecke, doch für Vallelunga empfehlen wir 1 Klick mehr für den Stabilisator vorn und eine um 1 Klick längere Übersetzung im 6. Gang. Das Auto ist berechenbar in den langsamen Haarnadelkurven von Vallelunga, doch auch wenn es Spaß macht, solltest du für bessere Rundenzeiten das Übersteuern einschränken und die Traktion maximieren.

series24_event3=Starte wieder mit dem Setup für die Nürburgring GP-Strecke. Fahre eine etwas längere Übersetzung im 6. Gang von 25/31. Wenn die Reifen etwas mehr Biss haben sollen, empfehle ich einen Radsturz von -3,8 vorn und von -3 hinten. Pass auf, dass die Reifen beim Bremsen nicht blockieren, um am Reifen keine Flachstelle zu erzeugen. Zudem könnte das Auto auf den Kerbs unruhiger werden.

series24_event4=Mugello hat zahlreiche Hochgeschwindigkeitskurven, bei denen die Aufhängung bis zum Anschlag belastet wird. Wir werden das Silverstone-Setup benutzen und die Federrate der Packers anpassen, um das Auto auf den Kerbs stabiler zu machen. Packerrate vorn auf 130 und Packerrate hinten auf 100. Es kann sein, dass du Probleme mit Überhitzung bekommst. Benutze einen weniger negativen Radsturz und passe deinen Fahrstil an. Wenn das Problem fortbesteht, dann nimm harte Reifen, doch denk daran, dass dieses Setup nicht für eine solche harte Mischung auf dieser Strecke getestet worden ist.

series24_event5=Das Mugello-Setup sollte hier in Imola gut funktionieren mit nur ein paar Modifikationen, hauptsächlich an den Stoßdämpfern. Schnelle Kompression vorn auf 60, hinten auf 40. Schneller Rücklauf vorn auf 140, hinten auf 85. Rücklauf hinten 20. Federweg hinten auf 80. Das Auto behält einen Teil seiner Federung bei, also achte darauf, wie du auf den Kerbs das Gas einsetzt.

series24_event6=Für Monza benötigst du nur minimalen aerodynamischen Widerstand. Starte mit dem Standardsetup und ändere die Front-/Heckflügel auf 0-2. Medium-Reifen auf 28-21 Front/Heck. Stabilisator hinten auf 0. Sei wie immer vorsichtig beim Bremsen, um Flachstellen zu vermeiden. Wenn du etwas mehr riskieren möchtest, kannst du den Heckflügel auf 1 einstellen und zum Ausgleich vorn den Stabilisator hochsetzen.

series24_event7=Spa Francorchamps ist das letzte Rennen der Saison. Wir empfehlen das Grundsetup für die Nürburgring GP-Strecke mit -3.8 Radsturz von und -3 hinten. Fahre eine längere Übersetzung im 6. Gang von 25/31.

series24_name=BMW M3 GT2 Series
series25=Du fährst für das BMW GT2-Werksteam!</br></br> Das ist ein großer Erfolg für jeden professionellen Rennfahrer. Das Auto ist inzwischen in die Jahre gekommen, doch es kann immer noch mithalten und das Team erwartet vollen Einsatz von dir.</br></br> Eine starke Leistung mit mindestens <strong>60 Punkten </strong>wird genug sein.

series25_event1=Unser Renningenieur will die Saison über das Auto allmählich verbessern, statt spezifische Setups für die einzelnen Strecken zu entwickeln. Ein erfahrener Rennfahrer wie du sollte die Handlingprobleme bewältigen und nach jedem Rennen Feedback zu unseren Fortschritten mit dem Auto geben können.  Wir starten auf der Nürburgring GP-Strecke mit Medium-Reifen mit einem Druck von 21, einer im letzten Gang um 1 Klick kürzeren Übersetzung Standardflügeln und dem Stabilisator hinten auf 2. Denk daran, dass der Motor oberhalb von 7000 rpm nur noch wenig Leistung bringt. Wechsle den Gang, wenn die LEDs es dir anzeigen.

series25_event2=Das Nürburgring-Setup war gut, es fehlte ihm jedoch an etwas Traktion. Wir nehmen es als Ausgangspunkt und verbessern den Grip für Vallelunga. Lade das Setup für die Nürburgring GP-Strecke und senke den Stabilisator hinten auf 0. Radsturz vorn auf -3.0, um in Kurven vorn etwas mehr Biss zu haben. Federrate vorn auf 120, um den Grip beim Bremsen zu verbessern. Eine um 1 Klick längere Übersetzung im 6. Gang von 25/24.

series25_event3=Silverstone sollte unserem Wagen sehr gut liegen, denn es geht um fließende Manöver und Geschwindigkeit in den Kurven. Fangen wir mit dem Vallelunga-Setup an. Übersetzung im 5. Gang von 23/26. Federrate hinten auf 110. Höhe vorn auf 6, Höhe hinten auf 2. Stoßdämpfer hinten auf 30, schneller Rücklauf hinten auf 97. Dadurch sollte der Wagen auf den Kerbs stabiler sein. Wenn das Setup gut funktioniert, werden wir es auch in Mugello einsetzen.

series25_event4=Das Auto läuft recht gut. Für Mugello gehen wir wie immer vom Setup für Silverstone aus. Wir verbessern die Front in den langen Kurven, indem wir den Federweg vorn leicht verlängern. Zahlenwert 40. Federrate hinten auf 105. Das sollte reichen. Vielleicht überhitzen die Mediums hier. Du solltest die Temperatur im Griff behalten können, doch falls du Probleme kriegst, müssen wir auf harte Reifen umsteigen.

series25_event5=Unser Mugello-Setup sollte inzwischen gut genug füe Imola sein. Mediums sollten sich hier am besten eignen. Sei vorsichtig in der Tosa-Kurve wenn die Reifen kalt sind. Du könntest Traktionsprobleme kriegen. Wenn diese Probleme andauern, könntest du den Reifendruck hinten um 1 oder 2 Klicks verringern. Wir nähern uns einem Punkt, an dem unser Grundsetup bereits sehr ausgereift ist.

series25_event6=Monza ist eine ganz spezielle Rennstrecke. Wir werden versuchen, möglichst wenig aerodynamischen Widerstand zu erzeugen, ohne die Balance des Fahrzeugs zu beeinträchtigen. Stell Front-/Heckflügel auf 0-2. Das Auto erhält so vorn mehr Abtrieb, weshalb wir den Federweg vorn einschränken. Höhe vor auf 15, Federweg vorn auf 30 und Packerrate vorn auf 150. Stabilisator vorn auf 10. Medium-Reifen auf 26-22. Übersetzung im letzten Gang 10/34, im 6. Gang 27/28. Wenn du weiterhin Probleme mit dem Handling hast, solltest du den Heckflügel auf 3 einstellen.

series25_event7=Für das letzte Rennen der Saison in Spa werden wir unser neuestes, für Imola entwickeltes Setup benutzen. Wir werden nur an der Übersetzung schrauben, um den Wagen besser auf die langen Geraden vorzubereiten. Lade das Imola-Setup und ändere die Übersetzung im letzten Gang auf 10/34. Das sollte gut sein. Das Team möchte dir zudem für deine Mitarbeit an der Entwicklung der Basissetups für die Autos unserer Kunden danken. Gute Arbeit!

series25_name=BMW M3 GT2 Extreme!
series26=Du bist ganz offiziell ein Ferrari 458 GT2-Fahrer!</br></br> Es hat sich schließlich ausgezahlt, dass du an all den kleineren Ferrari Trofeos teilgenommen hast. Ein Berufsfahrer für Ferrari zu sein ist die Erfüllung eines großen Traumes.</br></br> Das Team erwartet mindestens <strong>60 Punkte in der Meisterschaft.</strong>

