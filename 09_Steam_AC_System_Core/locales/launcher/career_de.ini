series1=Willkommen bei der Assetto Corsa Career.<br/><br/> Vielleicht ist es dein Traum, einen Ferrari 458 GT2 zu fahren, doch du musst hart dafür arbeiten, um ein Profifahrer zu werden. Beginne mit deinem netten, kleinen Abarth 500 EsseEsse. Der kleine Abarth mag nicht der Schnellste auf langen Geraden sein, doch er ist in engen Kurven sehr agil. Kannst du ihn am Limit fahren und dir den Frontantrieb zu Nutze machen?<br/><br/> Gewinne mindestens <strong>3 Bronzemedaillen</strong>, um die nächste Rennserie freizuschalten.

series10=Willkommen bei der Formel-Abarth-Meisterschaft.</br></br> Diese Einsitzer-Meisterschaft ist einer der wichtigsten Prüfungen für Fahrer. Ein Fahrer, der in dieser Serie gute Leistungen erbringt, wird ganz sicher von professionellen Teams entdeckt.</br></br> Erziele <strong> 40 Punkte in der Meisterschaft</strong>, um die Profiteams zu beeindrucken.

series10_event1=Die CSAI-Formel-Abarth-Meisterschaft startet in Magione. Dieser sehr enge Kurs mag sich leicht einprägen lassen, doch er ist viel zu holprig für einen Einsitzer-Rennwagen. Du musst das Auto wahrscheinlich anheben und eine weichere Aufhängung wählen müssen, um mit den Unebenheiten, Kurven und Kerbs klarzukommen.

series10_event2=Die Rennstrecke von Vallelunga verfügt über zahlreiche Möglichkeiten zum Überholen, aber leider auch zum überholt werden. Sie birgt zudem in einigen Kurven kleine "Geheimnisse" in Form von unkonventionellen Bremspunkten. Präge dir die Ideallinie ein und vielleicht kannst du pro Runde eine halbe Sekunde gutmachen.

series10_event3=Mugello ist einer der schwierigsten Rennstrecken. In den langen, schnellen Kurven brauchst du Abtrieb, doch auf der sehr langen Geraden willst du Höchstgeschwindigkeit fahren. Du musst den richtigen Kompromiss finden. Halte dich von den Kerbs fern: Sie mögen flach aussehen, doch bei hohen Geschwindigkeiten können sie dein Auto destabilisieren.

series10_event4=Die Nürburgring GP-Strecke ist ebenfalls eine technisch sehr anspruchsvolle Rennstrecke. Von Haarnadelkurven, die bergab im 1. Gang zu fahren sind, bis zu Hochgeschwindigkeitsschikanen im 5. am Berg. Man braucht Präzision und Mut, um überholen und gewinnen zu können.

series10_event5=Imola wird auch der kleine Nürburgring genannt. Um hier schnell zu fahren, musst du durch die Kerbs fliegen, doch das heißt nicht, dass sie flach oder einfach sind. Du kannst riskant fahren, und eine perfekte Runde hinlegen, doch schaffst du das auch über die volle Distanz?

series10_event6=Silverstone hat einfach alles. Von ganz langsamen Haarnadelkurven bis zu Kurven und Schikanen, die im 5. und 6. Gang gefahren werden wollen! Es erfordert viel Können, das richtige Setup und Mut, um in den extrem schnellen Kurven den Fuß auf dem Gaspedal zu lassen.

series10_event7=Eine sehr schnelle Strecke, auf der für einen Sieg ein geringer Abtrieb und das Fahren im Windschatten erforderlich sind. Senke den Wagen ab, damit der Diffusor besser wirkt, doch halte Abstand von den Kerbs, um den Unterboden nicht zu beschädigen.

series10_event8=Das letzte Rennen der CSAI-Formel-Abarth-Meisterschaft, die letzte Chance, die Saison zu gewinnen. Allein die Eau Rouge ist die wohl beeindruckendste, spannendste und gefährlichste Kurve der Welt. Und dann musst du auch noch den 7km langen Rest der Strecke bewältigen.

