series11=Die Ferrari 599XX Trofeo.</br></br> Die 599XX Trofeo ist eine Rennserie speziell für Besitzer eines exklusiven Ferraris der XX-Reihe. Zudem werden auch einige Profifahrer eingeladen und genau beobachtet. Den Besten wird vielleicht ein Platz in einem der Werksteams von GT Ferrari angeboten. </br></br> Erziele <strong> 36 Punkte in der Meisterschaft</strong>, um einen Ferrari GT fahren zu können.

series11_event1=Ein derart starkes Auto durch die engen Kurven von Magione zu lenken ist kein leichtes Unterfangen. Weiche Reifenmischungen und geringerer Reifendruck werden ganz sicher hilfreich sein. Vielleicht musst du auch die Traktionskontrolle aktivieren, um das üppige Drehmoment zu bändigen und genug Haftung zu finden.

series11_event2=Der Ferrari 599XX EVO erreicht die erste extrem schnelle, abschüssig gelegene Schikane von Vallelunga mit über 250km/h ... Das ist schnell! Vielleicht bist du im Stande, oder töricht genug, ein Setup zu finden, mit dem die erste Kurve ohne zu bremsen nehmen kannst, doch dann musst du in den langsameren, längeren Kurven auf viel Traktion verzichten. Geh einen Kompromiss ein und sind ein gutes, ausgewogenes Setup.

series11_event3=Lange, schnelle Kurven. Dafür steht Mugello. Der 599XX EVO ist ein hervorragendes Auto, doch du musst es verstehen und seiner aktiven Aerodynamik vertrauen. Biege sanft in eine Kurve ein und wenn die Nase etwas unruhig wird, dann lenk stärker ein, um die Elektronik wissen zu lassen, dass du mehr Frontgrip brauchst. Das Ergebnis könnte dich überraschen.

series11_event4=Die Nürburgring GP-Strecke vereint Kurven von allen anderen Strecken, die du bisher gefahren bist. Langsame Haarnadelkurven, in denen du um Traktion kämpfst und extrem schnelle Kurven, in denen es auf Frontgrip und Stabilität ankommt. Es wird schwierig, ein ausgewogenes Setup zu finden.

series11_event5=Imola ist keine einfache Strecke für PS-starke Autos. Für eine gute Rundenzeit musst du auf die Kerbs springen, doch bei über 750 PS kann das problematisch werden ... Vielleicht ist es Zeit, am Manettino zu drehen, um eine der zahlreichen Fahrdynamikeinstellungen zu wählen.

series11_event6=Du solltest inzwischen gelernt haben, wie die Elektronik und aktive Aerodynamik des 599XX funktionieren. Wenn dir ihre Funktionsweise zusagt und du sie voll ausnutzen kannst, ist Silverstone eine hervorragende Strecke für dieses Auto. Das Wetter ist kalt, aber der Kurs überhitzt die Reifen, also überlege dir gut, welche Mischung du fährst.

series11_event7=Entfessle 750 PS auf den langen Geraden von Monza und mach dich auf Höchstgeschwindigkeiten über 300km/h gefasst! Doch denke immer daran, dass solche Geschwindigkeiten lange Bremswege mit sich bringen und Monzas Schikanen eng und tückisch sind. Achte auch auf das sehr heiße Wetter und benutze harte Reifen.

series11_event8=Kaltes Wetter, schlechter Grip, einige der genialsten Kurven der Welt. Das ist Spa Francorchamps. Weiche Reifen sollten für guten Grip sorgen, doch halten sie ein ganzes Rennen? Es ist das letzte Rennen der Saison, mach das Beste draus!

series11_name=Ferrari 599XX Evo Trofeo
series12=Ferrari 458 Trofeo Advanced!</br></br> Ein Fahrer deines Niveaus kann nicht immer nur Tagesrennen bestreiten. Es ist Zeit, dich mit anderen Gentleman-Rennfahrern zu messen. Die Ferrari 458 Trofeo Advanced bietet dir die Gelegenheit, an ganzen Rennwochenenden und Langstreckenrennen teilzunehmen.</br></br> Erziele <strong> 30 Punkte in der Meisterschaft</strong>, um die Profiteams zu beeindrucken.

series12_event1=Die Ferrari 458 S3 Trofeo startet in Monza. Dank fast 600 PS, geringem aerodynamischem Widerstand und rasanter Beschleunigung erreicht dieser Sportwagen beeindruckende Höchstgeschwindigkeiten. Behalte immer deinen Bremsweg im Kopf, auch wenn du auf Slicks fährst.

series12_event2=Die sehr geringe Höhe des 458 S3 kann dir in den schnellen, unebenen Kurven von Mugello Schwierigkeiten bereiten. Halte dich von den Kerbs fern, wenn du kein großes Risiko eingehen willst.

series12_event3=Die neue Silverstone-Strecke hat eine absolut glatte Oberfläche und ist wie gemacht für den Ferrari 458 S3. Doch einige Kurven und Schikanen sind extrem schnell, weshalb höchste Konzentration erforderlich ist.

series12_event4=Das berühmte Spa Francorchamps. Versuche einfach nur, in der Eau Rouge nicht aus der Kurve zu fliegen. Die restlichen Kurven sind zwar schwierig, aber nicht unmöglich zu durchfahren.

series12_event5=Imola ist eine sehr technische Rennstrecke. Achte besonders auf den bergab gelegenen Bremsbereich der Rivazza. Vielleicht ist es besser, vor dem abschüssigen Abschnitt in der leichten Rechtskurve vom Gas zu gehen und dann zu bremsen und das Auto per ABS zu stabilisieren.

series12_event6=Die Nürburgring GP-Strecke mag nicht die majestätische Aura der längeren Nordschleife haben, doch sie ist dennoch sehr anspruchsvoll. An den mindestens 3 Stellen für Überholmanöver brauchst du ein beim Bremsen stabiles Auto, um einen Vorteil herauszufahren.

