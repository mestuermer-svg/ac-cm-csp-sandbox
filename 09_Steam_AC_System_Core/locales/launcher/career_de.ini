series22=Gut gemacht! Du bist jetzt ein Fahrer des Mercedes SLS GT3-Teams!</br></br> Der Mercedes SLS GT3 ist eines der leistungsstärksten und beeindruckendsten Autos der Rennserie. In einem Mercedes Rennen zu bestreiten kann Wunder wirken für eine Fahrerkarriere.</br></br> Erziele mindestens <strong>60 Punkte in der Meisterschaft.</strong>

series22_event1=Der Mercedes SLS GT3 ist schon ab Werk ein extrem starker Sportwagen. Wir werden nur ein paar kleine Modifikationen vornehmen, um ihn für die Nürburgring GP-Strecke zu optimieren. Starte mit Medium-Reifen und verkürze die Übersetzung im 6. Gang um 2 Klicks. Aerodynamik auf 1-6 Front-/Heckflügel. Bremsbalance auf 70%. Federrate vorn auf 100. Der Motor hat überall so viel Drehmoment, dass du ohne Traktionskontrolle Probleme kriegen würdest. Nimm daher Stufe 5 oder 6.

series22_event2=Mit so viel Drehmoment im niedrigen Drehzahlbereich müssen wir uns in den langsamen Kurven von Vallelunga auf Traktion konzentrieren. Flügeleinstellung 1-6. Mediums mit einem Druck von 25-24. Differential-Sperrwert im Freilauf 35% und Bremsbalance 70%.  Federrate vorn auf 100 und hinten ebenfalls auf 100. Stabilisator hinten auf 0. Es kann sein, dass du mit diesem Setup leicht untersteuerst, doch die Traktion wird so gut sein, dass du vielleicht die Traktionskontrolle gar nicht brauchst.

series22_event3=Der schnelle Fluss von Silverstone passt nicht perfekt zu unserem Auto. Wir werden versuchen, das Auto in der ersten links-rechts-Kombination "Maggots" sicher zu machen und auf dem Rest der Strecke möglichst wenige Kompromisse eingehen. 1-7 Front-/Heckflügel. Federrate vorn 110, Stabilisator hinten 0. 70% Bremsbalance. Übersetzung im 6. Gang 1 Klick kürzer. Du wirst die Traktionskontrolle für die langsamen Kurven brauchen, weshalb ich Stufe 6 oder 7 empfehle. Fahr ein gutes Ergebnis heraus.

series22_event4=Mugello ist noch ein Kurs mit schnellen Kurvenabfolgen. Doch er hat auch eine sehr lange, ansteigende Gerade. Wir werden versuchen, auf der Geraden anzugreifen und in den Kurven zu verteidigen. 1-5 Front-/Heckflügel. Stabilisator vorn auf 6, Federrate hinten 100. Höhe vorn 2, Höhe hinten 0. Bremsbalance 70%. Harte Reifen sind ein Muss bei heißem Wetter. Lass es in der ersten Runde ruhig angehen und durchfahre die schnellen Kurven sanft.

series22_event5=Imola ist eine Rennstrecke, die unserem Wagen sehr gut liegt, wenn du gut über die Kerbs fährst. Wir probieren ein Setup mit viel Abtrieb aus, um unsere Leistung und unser Drehmoment auszunutzen und den Wagen dicht über der Strecke zu halten, wenn wir über die Kerbs springen. 1-8 Front-/Heckflügel. Mediums mit einem Druck von 21 hinten. Federrate vorn auf 110 und Stabilisator hinten auf 0. Stoßdämpfer hinten auf 7, schnelle Kompression hinten auf 30. Bremsbalance auf 69%. Greif die Kerbs hart an, aber versuche bei der Landung das Lenkrad gerade zu halten.

series22_event6=Es ist Zeit, all unsere Leistung einzusetzen. In Monza zählen Beschleunigung und Höchstgeschwindigkeit. Hier brauchst du harte Reifen mit einem Druck von 29 vorn. 0-2 Front-/Heckflügel. Bremsbalance auf 71%. Federrate vorn 120, Federrate hinten 105, Stabilisator hinten 0. Dank eines guten, ausgewogenen Autos und mehr als 270km/h Spitzengeschwindigkeit, gibt es nicht viele andere Fahrzeuge, die es mit uns aufnehmen können.

series22_event7=Spa ist unsere letzte Chance auf die Meisterschaft! Wir starten mit dem Mugello-Setup und sehen, ob wir es verbessern können. 1-5 Front-/Heckflügel. Stabilisator vorn auf 6, Federrate hinten 100. Höhe vorn 2, Höhe hinten 0. Bremsbalance 70%. Das Wetter ist so kalt, dass wir Mediums riskieren können. Lass es in der ersten Runde ruhig angehen und durchfahre die schnellen Kurven sanft.

