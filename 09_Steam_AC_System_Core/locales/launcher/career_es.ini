series27_name=Extrema Ferrari 458 GT2
series28=¡La cima de la competición automovilística!</br></br> Los increíbles coches Formula del pasado siguen brillando y rugiendo a día de hoy. Gracias a la pasión de sus propietarios, esos coches siguen compitiendo a día de hoy. Eso sí, solo los conducen profesionales capaces de respetar su valor y encontrar sus limitaciones.</br></br> Consigue <strong>3 medallas de bronce, 2 de plata y 1 de oro</strong>.
series28_event1=El equipo clásico de Lotus te ha pedido que pruebes su Lotus Type 49, el cual han cuidado con mucho cariño. Este coche es uno de los mayores logros técnicos de la historia de la F1. Tiene una potencia increíble y se trata de un coche muy ligero. Sorprendentemente, podrás derrapar en las curvas con él; eso sí, ten cuidado con las distancias de frenado. La velocidad punta elevada y la ausencia de ABS te obligarán a empezar a frenar mucho antes de lo que estás acostumbrado.
series28_event2=Conducir el Type 49 del equipo clásico de Lotus es una experiencia capaz de abrirte los ojos. Imagínate lo que debió ser conducir este coche en Monza en el año 1967. El circuito, aunque sigue siendo bastante similar, carecía de chicanas de frenado por aquel entonces. Cierra los ojos y vuelve atrás en el tiempo a una época en la que conducir era peligroso y... bueno, también era seguro.
series28_event3=En 1975, el Ferrari 312T ganó tanto el campeonato de pilotos (con Niki Lauda y Clay Regazzoni) como el de fabricantes (Ferrari). Hoy podrás correr con este coche en Imola y saborear aquellas épicas batallas al volante de una máquina legendaria.
series28_event4=El programa Lotus Exos visita Silverstone para una sesión de prueba. Han pedido a pilotos profesionales que prueben los vehículos antes de permitir a los clientes que se pongan al volante. Lleva al Lotus Exos al límite y asegúrate de impresionar a los clientes potenciales.
series28_event5=Tu última actuación con el Exos 125 en Silverstone convenció al equipo Lotus para invitarte a una carrera con un Lotus Exos 125 S1 tuneado. La carrera se celebrará en el circuito de Mugello y tendrás todo un fin de semana de competición para preparar el vehículo adecuadamente y hacerlo lo mejor posible en la carrera. ¡Buena suerte!
series28_event6=El equipo clásico de Lotus se ha quedado impresionado ante tu última actuación. Creen que darás la talla para conducir un coche de valor incalculable: el Lotus 98T que condujo Ayrton Senna en 1985. Aquella época del turbo nos dejó algunos de los coches de F1 más potentes de la historia, ya que eran capaces de superar los 1000 CV en las rondas de clasificación. Solo los mejores pueden llevar al límite un coche tan difícil. Puede que seas único en tu especie.
series28_name=Formula
series2_event1=Acabas de entrar en el mundo de BMW. Aquí tendrás la oportunidad de conducir algunos de los coches más famosos de esta marca. Entrenaremos en Nürburgring, hogar de los coches alemanes. Para participar en el Desafío BMW, tendrás que conseguir un mínimo de 1200 puntos en la próxima contrarreloj. ¿Estás preparado?
series2_event2=El club BMW está organizando carreras para sus miembros. Como has demostrado tener una gran habilidad, has sido invitado a participar y te han dado un BMW Z4 35is. No es ni por asomo el BMW más rápido de la parrilla, peor se desenvuelve bastante bien en las largas rectas de Monza.
series2_event3=Segunda carrera del club BMW. Tendrás en tus manos el pequeño pero legendario M3 E30, un coche muy ágil pero con poca potencia. El Gran Premio de Nürburgring te ofrecerá rectas muy largas, así que es posible que tengas probabilidades de éxito frente a los coches modernos.
series2_event4=Has conducido al padre de todos los M3, así que ahora tendrás ocasión de ponerte al volante de la última versión. El chasis es fantástico y su motor V8 es increíblemente potente. Hazlo lo mejor que puedas, aunque lo menos que esperamos es que acabes en el podio.
series2_event5=Aunque el M3 es el más famoso, muchos consideran que la serie Coupé 1M, que es más ligera, más pequeña y más ágil, es la auténtica sucesora del M3 original. Tiene menos potencia, pero su par de torsión y su motor turbo pueden permitirle destacar cuando se ponen al límite. ¿Tendrás lo que hay que tener para lograr otro podio?
series2_event6=¡Una actuación impresionante! El departamento de BMW Motorsport te ha estado observando… ¡y te ofrecen la posibilidad de hacer una prueba en un auténtico coche de competición! En esta contrarreloj estarás al volante del glorioso BMW Z4 GT3. ¡A ver qué puedes hacer con él!
series2_name=Serie Novato 2
series3=¡Enhorabuena! Ahora compites en la serie Novato 3. </br>Una pequeña pero muy famosa marca de Austria te ha observado muy de cerca cuando conducías los BMW. KTM, que es famosa por sus motos, también ha creado uno de los vehículos más avanzados e impresionantes que se puedan encontrar hoy en día. El KTM X-Bow R será tuyo para una serie de eventos.</br></br>Consigue <strong>2 medallas de bronce y 1 de plata</strong> para impresionar a los ingenieros de KTM.
series3_event1=¡Te damos la bienvenida al mundo de los coches ultraligeros! El KTM X-Bow R está considerado como uno de los vehículos más intensos de su clase. Ahora tendrás la posibilidad de conocer y apreciar su manejo y rendimiento en uno de los circuitos más difíciles que existen: el Autódromo "Enzo e Dino Ferrari" de Imola.
series3_event2=KTM está organizando una carrera para sus socios. Has sido invitado y te han dado un KTM X-Bow R. ¡Alcanza como mínimo la tercera posición para quedarte el coche y poder unirte al Desafío X-Bow R!
series3_event3=Hace poco has demostrado tu habilidad en el autódromo de Vallelunga, así que ahora tendrás que hacer lo propio en el circuito del GP. El X-Bow R es el vehículo perfecto para este circuito romano. ¡No olvides que en el asfalto de Campagnano hay muchas posibilidades de adelantar!
series3_event4=Tu última oportunidad para conseguir tu propio X-Bow R. El circuito corto de Nürburgring no tiene secretos para ti. ¡No desaproveches esta oportunidad de llevártelo para casa!
series3_event5=Ahora tienes un X-Bow R y puedes desafiar a sus competidores naturales. A menos que tengas miedo, claro…
series3_name=Serie Novato 3
series4=¡Te damos la bienvenida a la serie Novato 4!</br></br>Tu gran actuación con el KTM ha impresionado a muchos. Aunque el X-Bow sigue siendo una gran novedad, no existe ninguna otra marca que tenga más tradición con coches ligeros. <strong>Lotus</strong> necesita tus servicios y tú tienes que mejorar tu técnica al volante de vehículos de gama media.</br></br>Consigue <strong>3 medallas de bronce y 1 de plata</strong> para completar esta serie.
series4_event1=Lotus. Muy pocas marcas pueden superar la legendaria historia de Lotus. Tienes ante ti una ocasión única de probar su coche deportivo ligero para novatos. Si lo haces bien, es posible que te inviten a muchos eventos de Lotus.
series4_event2=¡Lo has hecho de maravilla! Ahora podrás ir a por todas con el Exige 240R, un vehículo con una conducción muy parecida. Pero ten cuidado, ya que aunque su manejo sea similar, ¡va un poco más rápido! La tarea no va a ser nada fácil ya que tus rivales serán experimentados entusiastas de Lotus y algún que otro piloto profesional.
series4_event3=Se va a celebrar una carrera de club en el circuito de Silverstone International. La mayoría de los entusiastas creen que el Evora es un gran turismo, pero debería bastarte con un Lotus Evora S2 ligeramente tuneado para enseñarles un par de trucos.
series4_event4=Los ingenieros de Lotus quieren poner a prueba los límites del Lotus Exige S. Puede que el nombre te resulte familiar, pero tiene un chasis nuevo y un potente V6 en su interior. Tendrás que participar en esta contrarreloj y descubrir de qué es capaz este coche cuando se exprime al máximo.
series4_event5=Tras una gran contrarreloj, te han invitado a participar en una copa Lotus Exige V6. Los pilotos tienen mucha experiencia, así que ten cuidado con sus trucos sucios y con el gran rendimiento que demostrarán.
series4_event6=El trofeo Lotus 2-11 realiza su visita anual al circuito de Magione. Te han pedido que participes, así que más te vale concentrarte. El 2-11 tiene diferencial abierto y eso provoca que la rueda interna del motor gire como loca en las estrechas curvas del circuito italiano. Como no tengas cuidado, esto te ralentizará y consumirá tus neumáticos. Necesitarás la técnica de conducción adecuada.
series4_event7=Los ingenieros de Lotus creen que eres la persona ideal para ayudarlos con la evolución de su GTC. Te han pedido que participes con el nuevo Lotus Evora GTC en una contrarreloj en el complejo circuito de Imola. El día está muy caluroso, así que ten cuidado con el sobrecalentamiento. ¡Cambia la configuración según tus necesidades y ponlo al límite!
series4_name=Serie Novato 4
series5=¡Enhorabuena! Ahora compites en la serie Intermedio 1!</br></br>Como estás conduciendo tan bien para una marca tan importante como Lotus, era lógico que otros fabricantes británicos te estarían siguiendo muy de cerca… Pese a todo, cuando te llaman de McLaren, te cuesta mantener la calma y la compostura.</br></br>Consigue <strong>2 medallas de bronce y 1 de plata</strong> y demuestra que eres capaz de controlar toda esa potencia.
series5_event1=Un club de vehículos superdeportivos está organizando competiciones de aficionados por diferentes circuitos europeos. McLaren necesita un piloto con experiencia en vehículos de calle para poner al límite su nuevo McLaren MP4 12C y dar a conocer las cualidades de este nuevo supercoche. La primera carrera se celebrará en el autódromo de Vallelunga.
series5_event2=La segunda carrera de supercoches se celebrará en Mugello. Este circuito italiano, que es propiedad de Ferrari, es uno de los más exigentes debido a sus curvas largas a gran velocidad, tanto cuesta arriba como cuesta abajo. Es un desafío emocionante estar en el circuito de Ferrari con un McLaren.
series5_event3=La serie superdeportiva se traslada al circuito GP de Nürburgring. Participarán un gran número de fabricantes alemanes con sus habituales coches deportivos, así como también habrá un par de sorpresas.
series5_event4=Silverstone debería ser el hogar de McLaren. Pese a todo, el circuito tiene secuencias muy rápidas de izquierda a derecha que te obligarán a llevar al coche al límite. Los deportivos ligeros británicos pueden ser capaces de mantener los neumáticos frescos y remontar al final de la carrera, así que no los pierdas de vista.
series5_event5=Monza es el reino de la velocidad. Es el circuito de Formula 1 con las rectas más rápidas. Al volante de un McLaren, podrás conseguir impresionantes velocidades máximas; pero recuerda que estás usando neumáticos de calle, así que ten cuidado con las distancias de frenado. Además, se rumorea que podrían aparecer exclusivos coches de Ferrari.
series5_name=Serie Intermedio 1
series6=¡Serie Intermedio 2!</br></br>A partir de ahora, la cosa va a ir mejorando cada vez más. Mercedes Benz te ha ofrecido uno de los coches más famosos de su historia. El AMG SL5 tiene que ser conducido por alguien capaz de llevarlo hasta el límite. ¿Estarás a la altura?</br></br>Consigue <strong>2 medallas de bronce y 1 de plata</strong> para completar la serie de flechas plateadas. 
series6_event1=Mercedes Benz está organizando varias carreras de club para sus clientes. Te ofrecen un nuevo Mercedes SLS AMG y el primer evento será en el GP de Nürburgring.
series6_event2=El circuito de Imola acogerá el segundo evento de club de Mercedes. El SLS AMG es un coche muy competente, pero Imola es un circuito peligroso; presta atención extra para no dar tumbos de una cuenta a otra.
series6_event3=El circuito de Silverstone destaca por su típico clima frío. Asegúrate de mantener los neumáticos calientes, pero evita que se te sobrecalienten en las curvas tan rápidas que tiene este circuito.
series6_event4=Spa Francorchamps es un circuito impresionante. Requiere potencia, conducción predictiva, agilidad y agarre. El Mercedes SLS AMG lo tiene todo, así que ya solo faltan que demuestres toda tu habilidad para hacerlo brillar en este circuito. Eso sí, ten en cuenta que los rivales serán duros de roer. ¡A todo el mundo le gusta competir en Spa!
series6_event5=No hay circuito con rectas más largas que las de Monza. Este es el sitio ideal para que el SLS AMG estire las piernas.
series6_name=Serie Intermedio 2
series7=¡Buen trabajo! ¡Has desbloqueado la serie Intermedio 3!</br></br>¡Ferrari! El fabricante de vehículos más importante del mundo. No suelen participar en eventos sueltos con sus coches y pilotos, pero cuando lo hacen solo eligen a lo mejor de lo mejor… ¡y te han elegido a ti! Es una ocasión única en la vida, así que lúcete.</br></br>Consigue <strong>2 medallas de bronce y 2 de plata.</strong>
series7_event1=Una famosa revista de motor ha estado siguiendo tus progresos y quiere que pruebes varios coches exóticos para ella. Es una gran oportunidad para ti, ya que te permitirá hacerte ver entre los fabricantes de coches exóticos. Se ha organizado una primera prueba con el impresionante Ferrari 458 Italia en el circuito de Imola.
series7_event2=Se ha organizado una prueba colectiva de supercoches en Monza. El excelente manejo del Ferrari 458 te será de gran ayuda en esta carrera, pero hay otros supercoches que tienen la misma potencia o incluso más. Y, como ya sabes, en Monza la potencia importa mucho.
series7_event3=Spa es un circuito que puede sobrecalentar los neumáticos con demasiada facilidad. Por suerte, en general la temperatura ambiente es lo bastante baja como para enfriar los neumáticos. Pese a todo, siempre es un desafío afrontar 4 vueltas con neumáticos de calle en un circuito tan largo.
series7_event4=Este circuito, propiedad de Ferrari, es muy exigente con los neumáticos, con el coche y con el conductor. Algunos equipos del trofeo Ferrari te estarán observando. Hazlo bien aquí y podrías llegar a participar en el trofeo Ferrari 458 S3.
series7_name=Serie Intermedio 3
series8=¡Te damos la bienvenida al trofeo nacional de ligeros de Lotus!</br></br>Competir contra otros amantes de los coches en pequeñas carreras de un día está bien, pero lo bueno empieza cuando participas en un campeonato completo contra otros pilotos con mucho talento y coches similares.</br></br>Consigue <strong>20 puntos en el campeonato</strong> para desbloquear la próxima serie.
series8_event1=La primera parada del trofeo nacional de ligeros de Lotus será Magione. Sus lentas chicanas y curvas cerradas son ideales para el ágil Lotus 2-11, pero ten cuidado con el diferencial abierto trasero. No fuerces demasiado en la salida de las curvas si no quieres quemar los neumáticos traseros.
series8_event2=Monza es otro gran circuito para el Lotus 2-11, puesto que las chicanas son perfectas para la agilidad del coche. Pese a todo, tendrás que hacer uso de una configuración muy baja para el alerón trasero si quieres seguir de cerca a los demás coches para luego adelantarlos en las rectas más largas. La carga de una parte trasera baja puede complicar el control del coche en Ascari y Parabolica.
series8_event3=Uno de los circuitos más exigentes de todo el mundo. Subirse a pianos, frenadas en superficies irregulares, curvas con caída negativa… Este circuito quiere que te estrelles en todas y cada una de sus curvas. Y a tus rivales también les gustaría ver cómo te estrellas... ¡Decepciónalos!
series8_event4=Curvas rápidas y pendientes, el resumen perfecto de Mugello. Un circuito muy rápido que requiere precisión y coraje. ¡Es la última carrera de la serie y tu última posibilidad de acabar en lo más alto de la clasificación!
series8_name=Trofeo de ligeros de Lotus
series9=¡Has desbloqueado el trofeo Ferrari 458!</br></br>Un piloto de tu nivel no puede pasarse toda la vida en carreras de un día. Es hora de participar en una competición de verdad frente a otros conductores. El trofeo Ferrari 458 es uno de los eventos más glamurosos del mundo y son muchos los equipos profesionales que vienen aquí en busca de buenos conductores.</br></br>Consigue <strong>15 puntos en el campeonato</strong> para impresionar a los equipos profesionales.
series9_event1=La primera parada del trofeo Ferrari 458 S3 será Monza. Este coche puede alcanzar velocidades máximas impresionantes gracias a sus casi 600 CV, a su escaso roce aerodinámico y a su gran aceleración. Más te vale controlar la distancia de frenado, incluso con neumáticos lisos. 
series9_event2=El 458 S3 es un vehículo muy bajo, lo cual puede ser problemático en las curvas rápidas e irregulares de Mugello. Más te vale evitar los pianos, ya que el riesgo podría ser importante.
series9_event3=El nuevo circuito de Silverstone tiene una superficie perfectamente lisa y se convierte en el entorno perfecto para el Ferrari 458 S3. Pese a todo, tiene algunas curvas y chicanas muy rápidas que obligarán al conductor a estar bien concentrado.
series9_event4=El famoso Spa Francorchamps. Más te vale no salirte de la pista en la curva Eau Rouge. El resto de las curvas son difíciles, pero no imposibles.
series9_event5=Imola es un circuito muy técnico. Presta mucha atención a la zona de frenada cuesta debajo de la curva Rivazza. Puede que sea mejor levantar el pie del acelerador antes de iniciar la bajada; así, luego podrás frenar y aprovechar el ABS para estabilizar el coche.
series9_event6=Puede que el Gran Premio de Nürburgring no tenga el espíritu del más largo Nordschleife, pero sigue siendo un circuito muy exigente. Con al menos 3 puntos para adelantar, para triunfar en este circuito necesitarás un coche estable al frenar.
series9_name=Trofeo Ferrari 458
