[TEXT]
series1=Te damos la bienvenida al modo Carrera de Assetto Corsa.<br/><br/>Es posible que tu sueño sea conducir un Ferrar 458 GT2, pero te espera un largo camino antes de ser piloto profesional. Tendrás que empezar con el pequeño Abarth 500 EsseEsse, un vehículo que no es excesivamente rápido en las rectas pero que destaca por su gran agilidad en las curvas cerradas. ¿Serás capaz de llevarlo al límite y aprovechar al máximo su configuración de tracción delantera?<br/><br/> Consigue al menos <strong>3 medallas de bronce</strong> para acceder a la siguiente serie.
series10=¡Te damos la bienvenida al campeonato Formula Abarth!</br></br>Este campeonato para monoplazas es una de las pruebas de conducción más importantes que existen. El conductor que lo hace bien en esta serie suele llamar la atención de los equipos profesionales.</br></br>Consigue <strong>40 puntos en el campeonato</strong> para impresionar a los equipos profesionales.
series10_event1=Magione será la primera parada del campeonato Formula Abarth de la CSAI. Se trata de un circuito muy estrecho que parece fácil de recordar, pero que tiene demasiados puntos que recordar para un monoplaza. Para hacer frente a todos los baches, ondulaciones y pianos, seguramente tengas que elevar el coche y usar una suspensión más suave.
series10_event2=El circuito de Vallelunga ofrece numerosas oportunidades para adelantar, pero también para ser adelantado. También tiene "secretos" en un par de curvas, para los que necesitarás una línea de frenado no convencional. Descubre cuál es la línea que has de seguir y podrías recortar hasta medio segundo por vuelta.
series10_event3=Mugello es uno de los circuitos más difíciles. Necesitas carga para afrontar sus largas curvas rápidas, pero necesitar velocidad punta para la recta tan larga que te encontrarás. Deberás alcanzar el equilibrio perfecto. Evita los pianos, ya que parecen bajos pero pueden desestabilizar el coche si vas a mucha velocidad.
series10_event4=El Gran Premio de Nürburgring es otro circuito muy técnico, con curvas cerradas cuesta abajo que se deben tomar en primera y con chicanas cuesta arriba que se deben tomar a toda velocidad en quinta. Necesitarás precisión y valor para poder ir rápido y adelantar a tus rivales.
series10_event5=Imola suele recibir el apodo de "pequeño Nürburgring". Para ser rápido aquí, tendrás que meterte en el piano, pero eso no quiere decir que sean pianos bajos y fáciles de usar. Puede que tengas que arriesgarte un poco para hacer una vuelta perfecta, pero... ¿podrás mantener ese ritmo toda la carrera?
series10_event6=Silverstone lo tiene todo: curvas cerradas muy lentas, curvas a gran velocidad en quinta y sexta, chicanas… Necesitarás habilidad, coraje y una buena configuración para pisar a fondo en esas curvas tan veloces.
series10_event7=Un circuito muy rápido en el, para triunfar, necesitarás una carga baja y seguir una estrategia de pegarte a la estela del rival. Baja la altura del vehículo para que el difusor funcione mejor, pero mantenlo alejado de los pianos para evitar arañar los bajos.
series10_event8=La última carrera del campeonato Formula Abarth de la CSAI. Tu última oportunidad para ganar la temporada. Posiblemente, la Eau Rouge es la curva más impresionante, emocionante y peligrosa del mundo. Y a mayores, tendrás que ocuparte del resto del circuito. 7 largos kilómetros de circuito.
series10_name=Trofeo Formula Abarth
series11=El trofeo Ferrari 599XX.</br></br> El trofeo 599XX es una serie en la que solo pueden participar los propietarios del exclusivo programa XX de Ferrari. También hay conductores que son invitados y observados con detenimiento. A los mejores, es posible que hasta les ofrezcan un puesto en alguno de los equipos GT de Ferrari. </br></br> Consigue <strong>36 puntos en el campeonato</strong> para poder conducir un Ferrari GT.
series11_event1=No es nada sencillo conducir un coche tan potente por las estrechas curvas de Magione. Te será de gran ayuda usar neumáticos blandos y con poca presión. También es posible que tengas que activar el control de tracción para poder controlar el exceso de potencia.
series11_event2=El Ferrari 599XX EVO llega a más de 250 km/h a la primera chicana de Vallelunga, la cual es una pendiente extremadamente rápida. ¡Casi nada! Puede que seas lo bastante hábil y valeroso, o lo bastante idiota, como para llegar a la primera curva a toda velocidad, pero sin duda echarás mucho de menos la tracción en las curvas largas más lentas. Lo mejor será que cedas un poco y busques una configuración equilibrada en general.
series11_event3=Una gran sucesión de curvas largas y rápidas. Eso es Mugello. El 599XX EVO es un coche muy capaz, pero hay que comprender su aerodinámica activa y confiar en ella. Entra con suavidad en una curva y, cuando sientas que el frontal se te va un poco, gira un poco más y que el sistema electrónico sepa que necesitas más agarre delantero. El resultado podría sorprenderte.
series11_event4=El Gran Premio de Nürburgring combina todos los tipos de curva que has visto hasta ahora en otros circuitos. Las curvas cerradas te provocarán muchos problemas de tracción, mientras que las curvas más rápidas priorizarán el agarre frontal y la estabilidad. Que tengas buena suerte encontrando el equilibrio perfecto en la configuración del coche.
series11_event5=Imola no es un circuito sencillo para los coches potentes. Para lograr un buen tiempo de vuelta tendrás que subirte al piano, pero eso puede ser problemático cuando tienes más de 750 CV en los neumáticos traseros… Pude que sea hora de usar el manettino para seleccionar alguno de los diversos niveles de control de la tracción.
series11_event6=A estas alturas, ya sabrás cómo funcionan los elementos electrónicos y la aerodinámica activa del 599XX. Si te gusta su funcionamiento y logras explotarlo al máximo, Silverstone puede ser un buen circuito para este coche. El clima es frío, pero la pista sobrecalienta los neumáticos... así que piénsate dos veces qué neumáticos usar.
series11_event7=¡Libera 750 CV en las largas rectas de Monza y prepárate para alcanzar velocidades máximas que superan los 300 km/h! Eso sí, ten en cuenta que a esas velocidades necesitarás una mayor distancia de frenado y que las chicanas de Monza son muy estrechas y complicadas. Además, debido al clima cálido es recomendable usar neumáticos duros.
series11_event8=Bienvenido a Spa Francorchamps: clima frío, poco agarre y algunas de las curvas más impresionantes que se hayan visto en un circuito. Los neumáticos blandos deberían ofrecerte bastante agarre, pero ¿aguantarán toda la carrera? Es la última carrera de la temporada, así que más te vale hacer un buen papel.
series11_name=Trofeo Ferrari 599XX Evo
series12=¡Trofeo avanzado Ferrari 458!</br></br> Un conductor de tu nivel no puede pasarse la vida con torneos de un día. Es hora de competir de verdad contra otros conductores. El trofeo avanzado Ferrari 458 te ofrece la posibilidad de participar en competiciones de todo el fin de semana y en carreras largas.</br></br> Consigue <strong>30 puntos en el campeonato</strong> para impresionar a los equipos profesionales.
series12_event1=La primera parada del trofeo Ferrari 458 S3 será Monza. Este coche puede alcanzar velocidades máximas impresionantes gracias a sus casi 600 CV, a su escaso roce aerodinámico y a su gran aceleración. Más te vale controlar la distancia de frenado, incluso con neumáticos lisos. 
series12_event2=El 458 S3 es un vehículo muy bajo, lo cual puede ser problemático en las curvas rápidas e irregulares de Mugello. Más te vale evitar los pianos, ya que el riesgo podría ser importante.
series12_event3=El nuevo circuito de Silverstone tiene una superficie perfectamente lisa y se convierte en el entorno perfecto para el Ferrari 458 S3. Pese a todo, tiene algunas curvas y chicanas muy rápidas que obligarán al conductor a estar bien concentrado.
series12_event4=El famoso Spa Francorchamps. Más te vale no salirte de la pista en la curva Eau Rouge. El resto de las curvas son difíciles, pero no imposibles.
series12_event5=Imola es un circuito muy técnico. Presta mucha atención a la zona de frenada cuesta debajo de la curva Rivazza. Puede que sea mejor levantar el pie del acelerador antes de iniciar la bajada; así, luego podrás frenar y aprovechar el ABS para estabilizar el coche.
series12_event6=Puede que el Gran Premio de Nürburgring no tenga el espíritu del más largo Nordschleife, pero sigue siendo un circuito muy exigente. Con al menos 3 puntos para adelantar, para triunfar en este circuito necesitarás un coche estable al frenar.
series12_name=Trofeo avanzado Ferrari 458
series13=¡Te damos la bienvenida al campeonato Formula Abarth!</br></br>Este es el campeonato completo, con eventos que duran todo el fin de semana. Tus rivales son más rápidos y las condiciones del circuito pueden variar a lo largo del fin de semana.</br></br> Consigue <strong>60 puntos en el campeonato</strong> para impresionar a los equipos profesionales.
