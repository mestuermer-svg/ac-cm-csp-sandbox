series26_name=Serie Ferrari 458 GT2
series27=Serie Extrema de Ferrari 458 GT2.</br></br> Al final ha merecido la pena el tener la paciencia y el compromiso para completar todos los trofeos menores de Ferrari. Ser un conductor profesional de Ferrari es un sueño hecho realidad.</br></br> El equipo quiere que consigas, como mínimo, <strong>60 puntos en el campeonato.</strong>
