series21_name=Extrema McLaren MP4 GT3
series22=¡Buen trabajo! ¡Ya eres un conductor oficial del equipo Mercedes SLS GT3!</br></br> El Mercedes SLS GT3 es uno de los coches más potentes e impresionantes de la serie. Competir con un Mercedes es un paso importantísimo para tu carrera.</br></br> Consigue al menos <strong>60 puntos en el campeonato.</strong>
series22_event1=El Mercedes SLS GT3 es un coche muy bueno, recién salido de fábrica. Le haremos unas pequeñas modificaciones para que se desenvuelva todavía mejor en el Gran Premio de Nürburgring. Empieza con neumáticos medios y reduce en 2 clics la relación de la 6.ª marcha. Alerón delantero al 1, trasero al 6. Reparto de frenada al 70%. Rigidez de los muelles delanteros al 100. El motor tiene un par de torsión muy elevado en general, así que vas a tener problemas de tracción si no tienes a nivel 5 o 6 el control de tracción.
series22_event2=Con tanto par de torsión en revoluciones tan bajas del motor, debemos concentrarnos en la tracción para las curvas lentas de Vallelunga. Alerón delantero al 1, trasero al 6. Neumáticos medios con 25 de presión los delanteros y 24 los traseros. Bloqueo del diferencial al 35% y reparto de frenada al 70%. Rigidez de los muelles al 100, tanto para los delanteros como para los traseros. Barra estabilizadora trasera al 0. Podrías tener algún problema de subviraje con esta configuración, pero la tracción será tan buena que es posible que ni siquiera necesites control de tracción.
series22_event3=El ritmo rápido del circuito de Silverstone no es el ideal para las características de nuestro coche. Tendremos que hacerlo más seguro en las rápidas curvas de izquierda a derecha, pero sin comprometerlo demasiado en el resto del circuito. Alerón delantero al 1, trasero al 7. Rigidez de los muelles delanteros al 110 y barra estabilizadora trasera al 0. Reparto de frenada al 70%. 1 clic menos en la relación de la 6.ª marcha. Necesitarás control de tracción para las curvas más lentas; te sugiero un nivel 6 o 7. Consigue un buen resultado.
series22_event4=Mugello es otro circuito con curvas muy rápidas, pero también tiene una larga recta cuesta arriba. Tendremos que atacar en esa recta y defender en las curvas. Alerón delantero al 1, trasero al 5. Barra estabilizadora delantera al 6 y rigidez de los muelles delanteros al 100. Altura delantera 2 y altura trasera 0. Reparto de frenada al 70%. Al ser un clima muy cálido, los neumáticos duros serán imperativos. Tómatelo con calma en las primeras vueltas y afronta con cuidado las curvas rápidas.
series22_event5=Imola es un circuito ideal para nuestro coche si puedes conducirlo bien por los pianos. Probaremos con una configuración de mucha carga; así, aprovecharemos nuestra potencia y nuestro par de torsión para mantener el coche en el suelo al saltar en los pianos. Alerón delantero 1, trasero 8. Neumáticos medios con 21 de presión en la parte delantera. Rigidez de los muelles delanteros al 110 y la barra estabilizadora trasera al 0. Compresión de los amortiguadores traseros al 7 y compresión rápida al 30. Reparto de frenada al 69%. Ve sin miedo a por los pianos, pero asegúrate de tener el volante recto al aterrizar.
series22_event6=Es hora de usar todo ese poder. Monza es sinónimo de aceleración y velocidad máxima. Será fundamental usar neumáticos duros, así que aumenta la presión delantera a 29. Alerón delantero al 0, trasero al 2. Reparto de frenada al 71%. Rigidez de los muelles delanteros al 120, de los traseros al 105. Barra estabilizadora al 0. Con un coche bien equilibrado y más de 270 km/h de velocidad máxima, muy pocos coches podrán hacerte frente.
series22_event7=¡Spa será nuestra última opción de llevarnos el campeonato! Empezaremos con la configuración de Mugello e iremos viendo si podemos mejorarla. Alerón delantero al 1, trasero al 5. Barra estabilizadora delantera al 6 y rigidez de los muelles delanteros al 100. Altura delantera al 2, altura trasera al 0. Reparto de frenada al 70%. El clima es frío, así que nos arriesgaremos con los neumáticos medios. Tómatelo con calma en las primeras vueltas y conduce con cuidado en las curvas rápidas.
series22_name=Serie Mercedes SLS GT3
series23=¡Enhorabuena! ¡Has desbloqueado el Mercedes SLS GT3 Extremo!</br></br> Te espera una temporada de resistencia completa, con prácticas y sesiones de clasificación los fines de semana de carrera. El equipo Mercedes SLS GT3 necesitará toda la ayuda que les puedas prestar.</br></br> Consigue al menos <strong>60 puntos en el campeonato.</strong>
series23_event1=El Mercedes SLS GT3 es un coche muy bueno, recién salido de fábrica. Le haremos unas pequeñas modificaciones para que se desenvuelva todavía mejor en el Gran Premio de Nürburgring. Empieza con neumáticos medios y reduce en 2 clics la relación de la 6.ª marcha. Alerón delantero al 1, trasero al 6. Reparto de frenada al 70%. Rigidez de los muelles delanteros al 100. El motor tiene un par de torsión muy elevado en general, así que vas a tener problemas de tracción si no tienes a nivel 5 o 6 el control de tracción.
