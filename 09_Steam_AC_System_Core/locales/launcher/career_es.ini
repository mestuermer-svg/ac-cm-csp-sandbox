series23_name=Extrema Mercedes SLS GT3
series24=¡Conduces para el equipo BMW GT2 Works!</br></br> Es un gran logro para un conductor profesional. Este coche es ya un poco antiguo, pero todavía sigue siendo competitivo y el equipo espera que hagas un gran papel.</br></br> Se quedarán muy contentos si consigues al menos <strong>60 puntos</strong>.
series24_event1=Como ya sabrás, nuestro coche ha tenido una larga historia de éxitos y tenemos una buena configuración básica que sabemos que funciona bien. Te permitiremos familiarizarte con esta configuración básica en la primera carrera; luego, te propondremos pequeños cambios para adaptarlo a tu estilo de conducción. Pon el alerón delantero al 2, el trasero al 4. La relación de transmisión final a 10/50 y la sexta marcha a 34/31. Neumáticos medios con una presión general de 21.
series24_event2=Empezaremos con la configuración del Gran Premio de Nürburgring, pero para Vallelunga te sugerimos 1 clic más en la barra estabilizadora delantera y 1 clic más en la 6.ª marcha. El coche será predecible en las lentas curvas cerradas de Vallelunga, pero no gires demasiado el volante y maximiza la tracción para conseguir los mejores tiempos de vuelta.
series24_event3=Volveremos a empezar con la configuración del Gran Premio de Nürburgring. Usa una 6.ª ligeramente más larga, 25/31. Si necesitas que los neumáticos te den más, te sugiero una caída delantera de -3,8 y una trasero de -3. Cuidado al frenar, para no aplanar los neumáticos. Además, el coche podría volverse un poco incontrolable en los pianos.
series24_event4=Mugello tiene muchas curvas de gran velocidad que hacen que la suspensión esté al tope durante mucho tiempo. Usaremos la configuración de Silverstone y ajustaremos el índice de rigidez de los topes para hacer que el coche sea más estable en los pianos. Pon el tope delantero a 130 y el trasero a 100. Puede que se te sobrecalienten los neumáticos. Usa menos caída negativa y ajústala a tu estilo de conducción. Si el problema perdura, usa neumáticos duros; pero recuerda que la configuración no ha sido puesta a prueba con dichos neumáticos en este circuito.
series24_event5=La configuración de Mugello debería funcionar bien en Imola, con tan solo un par de modificaciones (sobre todo en los amortiguadores). Compresión rápida de los amortiguadores delanteros al 60, de los traseros al 40. Extensión rápida de los amortiguadores delanteros al 140, de los traseros al 85. Extensión trasera al 20. Recorrido trasero al 80. El coche seguirá saltando un poco, así que ten cuidado con la velocidad con la que tomas los pianos.
series24_event6=En Monza, se necesita que la aerodinámica te retrase lo menos posible. Empieza con la configuración predeterminada y cambia el alerón delantero a 0 y el trasero a 2. Neumáticos medios a 20 delante y 21 detrás. Barra estabilizadora trasera a 0. Como siempre, ten cuidado al frenar para evitar el aplanamiento del neumático. Si quieres arriesgarte un poco más, podrás bajar el alerón trasero a 1 y aumentar la barra estabilizadora delantera para equilibrarlo.
series24_event7=Spa Francorchamps es la última carrera de la temporada. Te sugerimos la configuración básica del Gran Premio de Nürburgring con -3,8 de caída delantera y -3 de caída trasera. Usa una 6.ª marcha más larga con 25/31.
series24_name=Serie BMW M3 GT2
series25=¡Conduces para el equipo BMW GT2 Works!</br></br> Es un gran logro para un conductor profesional. Este coche es ya un poco antiguo, pero todavía sigue siendo competitivo y el equipo espera que hagas un gran papel.</br></br> Se quedarán muy contentos si consigues al menos <strong>60 puntos</strong>.
series25_event1=Nuestro ingeniero estará encantado de mejorar el coche poco a poco durante la temporada, en vez de crear configuraciones específicas para cada pista. Un conductor experimentado como tú debería ser capaz de superar todos los problemas al volante y ofrecer comentarios sobre las mejoras del coche carrera a carrera. Empezaremos en el Gran Premio de Nürburgring con neumáticos medios a 21 de presión, un clic menos de la relación de transmisión final, alerones predeterminados y una barra estabilizadora trasera de 2. Recuerda que el motor no saca más potencia al superar las 7000 rpm, así que cambia cuando las luces te lo indiquen.
series25_event2=La configuración de Nürburgring era buena, pero le faltaba un poco de tracción. Empezaremos desde aquí y mejoraremos la tracción para Vallelunga. Carga la configuración del Gran Premio de Nürburgring y baja la barra estabilizadora trasera a 0. Pon -3,0 de caída negativa delantera para ofrecer un poco más de fuerza a la parte delantera a mitad de la curva. Pon la rigidez de los muelles delanteros al 120 para aumentar el agarre al frenar. 1 clic más largo para la relación de transmisión de 6.ª, valor 25/24.
series25_event3=Silverstone debería ser el circuito ideal para tu coche, ya que se trata de tener un buen ritmo y una gran velocidad de giro. Empecemos con la configuración de Vallelunga. Relación de transmisión de 5.ª a 23/26. Rigidez de los muelles traseros al 110. Altura delantera al 6, altura trasera al 2. Compresión de los amortiguadores traseros al 30, extensión rápida de los amortiguadores traseros al 97. Con esto, el coche debería ser más estable en los pianos. Si esta configuración funciona bien, la usaremos también en Mugello.
series25_event4=El coche está funcionando bastante bien. En Mugello empezaremos como siempre, con la configuración de Silverstone. Añade un poco de recorrido a la parte delantera para que ayude en las curvas largas. Un valor de 40. Rigidez de los muelles traseros al 105. Con eso debería bastar. Los neumáticos medios podrían sobrecalentarse; si esto se vuelve un problema grave, nos veremos obligados a usar neumáticos duros.
series25_event5=Nuestra configuración para Mugello debería de ser lo bastante buena para Imola. Los neumáticos medios deberían funcionar muy bien aquí. Ten cuidado en la curva Tosa cuando los neumáticos estén fríos, ya que podrías tener problemas de tracción. Si dicho problema persiste, reduce en 1 o 2 clics la presión de los neumáticos traseros. Estamos llegando a un punto en el que nuestra configuración básica es muy buena de por sí.
series25_event6=Monza es un circuito muy particular. Intentaremos reducir al máximo el freno aerodinámico, pero sin afectar al equilibrio del coche. Pon el alerón delantero al 0 y el trasero al 2. Ahora el coche tendrá más carga delantera, así que bloquearemos el recorrido delantero para limitar la sensibilidad al cabeceo. 15 de altura delantera, recorrido delantero al 30 y tope delantero al 150. Barra estabilizadora delantera al 10. Neumáticos medios a 26-22. Relación de transmisión final 10/34, 6.ª marcha 27/28. Si aun así te cuesta controlar el coche, pon el alerón trasero a 3.
series25_event7=Para la última carrera de la temporada en Spa, usaremos nuestra última configuración de Imola. Solo cambiaremos las relaciones de transmisión para adaptarlas mejor a las largas rectas del circuito. Carga la configuración de Imola y cambia la relación de transmisión final a 10/34. Debería funcionar. El equipo también quiere agradecerte tus esfuerzos en la creación de una gran configuración básica para nuestros coches. ¡Buen trabajo!
series25_name=Extrema BMW M3 GT2
series26=¡Conductor oficial de Ferrari 458 GT2!</br></br> Al final ha merecido la pena el tener la paciencia y el compromiso para completar todos los trofeos menores de Ferrari. Ser un conductor profesional de Ferrari es un sueño hecho realidad.</br></br> El equipo quiere que consigas, como mínimo, <strong>60 puntos en el campeonato.</strong>
