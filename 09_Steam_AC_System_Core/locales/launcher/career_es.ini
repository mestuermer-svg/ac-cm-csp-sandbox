series16=¡Has desbloqueado los hipercoches de nivel 1!</br></br> Lógicamente, los dueños de hipercoches están muy orgullosos de sus vehículos. Algunos no se limitan a coleccionarlos por su valor, sino que también disfrutan conduciéndolos en la pista. A menudo, piden (solo mediante invitación) a pilotos profesionales que los conduzcan y los lleven hasta al límite. ¡Considérate afortunado!</br></br> Consigue <strong>3 medallas de bronce y 2 de plata</strong> para completar esta temporada.
series16_event1=El Ferrari F40 es un auténtico icono de los supercoches. Hay quien lo considera el último y el mejor supercoche análogo jamás fabricado. Esta versión S3 tiene un motor tuneado de serie para generar más de 600 CV y neumáticos lisos. No tiene ni ABS ni control de tracción. ¿Podrás llevar este coche al límite... o llegarás antes a tu límite? 
series16_event2=El 599XX sale del programa de investigación y desarrollo de Ferrari para convertirse en un coche de laboratorio muy, muy veloz. Con 750 CV y una aerodinámica activa, supone todo un desafío competir con él. El circuito de Mugello, que es propiedad de Ferrari, se convierte en el complemento perfecto para este coche.
series16_event3=La gran potencia, la aerodinámica activa y los neumáticos lisos hicieron del Ferrari 599XX Evo uno de los coches más veloces que hayan pasado por Nordschleife. Aunque nadie está tan loco como para conducir este coche en el gran anillo. El Gran Premio de Nürburgring es un circuito muy desafiante, que atrae a otros amantes de los hipercoches.  
series16_event4=El Pagani Zonda es ya uno de los coches más deseados del mundo. La versión Zonda R coge todo lo que nos gusta de los coches de Pagani y lo exagera al extremo: peso ligero, muchísima potencia, pensado para el circuito. Nunca pensaste que se podría hacer una vuelta tan rápida en Silverstone. Pero ¿podrás hacer frente a otros coches similares?
series16_event5=El Pagani Zonda R recorre tan rápido las subidas y bajadas de Imola que, como no te concentres, te puedes llegar a marear. ¡Imagínate lo que puede ser eso con otros hipercoches compitiéndote la victoria!
series16_event6=Tras el extremo Zonda R, nadie pensaba que Pagani pudiese llegar a crear algo más extremo y que fuese legal en la carretera. Todos nos equivocábamos. El Pagani Huayra puede alcanzar fácilmente más de 300 km/h en las rectas de Monza. ¿Logarán las 4 solapas independientes, que son aerodinámicas activas, detener el coche a tiempo para las chicanas más estrechas?
series16_event7=La leyenda del fabricante de supercoches más famoso sigue viva gracias al hipercoche conocido como LaFerrari. Esta increíble maravilla tecnológica hace uso de una tecnología híbrida para alcanzar los 963 CV, aerodinámicas activas y desarrollos del chasis que podrían hacer que los demás hipercoches pareciesen lentos en comparación. Demuéstralo en esta titánica batalla por las curvas de Spa Francorchamps.
series16_name=Hipercoches
series17=¡Te damos la bienvenida a la serie avanzada GT!</br></br> Tu gran rendimiento con todo tipo de coches te ha convertido en un conductor muy famoso. Son varios los equipos con coches de GT2 y GT3 que buscan conductores como tú para sus vehículos.</br></br> Consigue al menos <strong>3 medallas de bronce y 2 de plata</strong> para impresionar a los equipos de GT.
series17_event1=Tienes ante ti la oportunidad de conducir el BMW Z4 GT3 en el Gran Premio de Nürburgring. Este BMW es uno de los GT3 más potentes, aunque puede ponerse un poco nervioso al frenar. Te recomendamos frenar siempre en rectas y usar la potencia del coche para salir rápido de las curvas.
series17_event2=El equipo del BMW Z4 GT3 te vuelve a ofrecer conducir su vehículo, esta vez en el circuito de Vallelunga. El generoso par de torsión de este BMW es perfecto para acelerar al salir de las curvas cerradas tan lentas de Vallelunga. Si los neumáticos gastados te traen problemas, ajusta el nivel del control de tracción al conducir.
series17_event3=Un equipo de McLaren MP4 GT3 te ofrece su coche para la carrera de Silverstone. El McLaren es un coche muy potente, pero tanto su motor turbo como su manejo tan suave pueden ser muy peligrosos. Lo mejor es usar una configuración segura que, aunque pueda parecer más lenta al principio, acabe siendo más estable cuando se gasten los neumáticos.
series17_event4=Otra carrera con el superveloz McLaren MP4 GT3, esta vez en Mugello. Las curvas largas y rápidas del circuito exigen mucho a los neumáticos, así que ten esto muy en cuenta. Lo mejor es ir sobre seguro y subir un poco más al alerón trasero, en vez de usar un alerón más bajo para ser más rápido y arrepentirse tras un trompo.
series17_event5=El equipo Mercedes SLS GT3 se ha quedado impresionado con tu velocidad y te han ofrecido su coche para la carrera de Imola. Este Mercedes es muy potente, sobre todo en velocidades de motor de corta y media distancia. Los pianos de Imola pueden desestabilizar el coche y hacerte perder tracción, así que te recomendamos que ajustes el control de tracción.
series17_event6=Monza es el circuito perfecto para el potente Mercedes SLS. Aunque hayas tenido problemas en las carreras anteriores, esta es la oportunidad perfecta para vengarte y sumar puntos muy valiosos. ¡Ve a por la victoria!
series17_event7=La escudería Glickenhaus solo contrata a conductores expertos, pero están dispuestos a hacer una excepción contigo. Spa Francorchamps es un circuito muy técnico. El P4/5 Competizione tiene un gran agarre, pero le falta velocidad máxima. La victoria es casi imposible, pero ¿conseguirás terminar en una buena posición?
series17_name=Serie avanzada GT
series18=¡Te damos la bienvenida a la serie BMW GT3!</br></br> BMW te da la bienvenida a su equipo de resistencia GT3. Con el apoyo de la marca, vas a conducir un Z4 GT3 durante toda la temporada.</br></br> El equipo cree que deberías conseguir <strong>60 puntos en el campeonato</strong>.
series18_event1=El BMW Z4 GT3 es, sin duda, un coche ganador. Es muy sensible a los cambios de configuración, así que en esta primera carrera nos centraremos en los cambios que nos permitirán un manejo seguro en futuras carreras. Alerón delantero 1, trasero 6. Reparto de frenada al 74% delante. Rigidez de los muelles delanteros al 200, barra estabilizadora delantera al 8. Altura inferior frontal a 7 y trasera a 30. Bloqueo del diferencial al 60%. Con esto, el coche debería ser lo bastante rápido y estable para afrontar esta primera carrera.
series18_event2=Vallelunga es un circuito relativamente seguro, así que aquí podremos experimentar con configuraciones más arriesgadas de cara a conseguir velocidad máxima y en las curvas. Pon el alerón delantero al 0 y el trasero al 4. Reparto de frenada al 74%, ya que el coche se descontrola un poco al frenar. Pon la rigidez de los muelles delanteros a 200 y la barra estabilizadora delantera a 6. Puede que todavía tengas problemas al salir de las curvas, así que juega con el control de tracción entre los niveles 5-7.
series18_event3=Silverstone es un circuito muy difícil, así que será mejor no arriesgarnos demasiado. Te sugiero el alerón delantero al 1, el trasero al 6, la barra estabilizadora frontal al 8 y reparto de frenada al 74% delante. El clima es frío, así que deberías poder afrontar la carrera con neumáticos medios (aunque siempre hay un cierto riesgo de sobrecalentamiento). Si ves que tienes problemas, cambia a neumáticos duros y baja la presión en 3 clics.
series18_event4=En Mugello es importante controlar la parte trasera del coche y, al mismo tiempo, lograr una buena velocidad en mitad de las curvas. Empecemos con el alerón delantero a 1 y el trasero a 6. Usaremos una configuración muy dura para cargar mejor los neumáticos. Recorrido delantero al 40. Barra estabilizadora delantera al 10, altura delantera al 8. Carrera trasera al 70. Rigidez de los muelles delanteros al 90, altura trasera al 20. Barra estabilizadora trasera al 6. Usa neumáticos duros, 24 delante y 25 detrás. Tómatelo con calma en la primera vuelta para que los neumáticos se calienten bien. Luego podrás empezar a correr.
series18_event5=Como suele ser habitual en Imola, tenemos mucho que ajustar para esos pianos. Pon el alerón delantero al 1 y el trasero al 6. Recorrido trasero al 70. La barra estabilizadora delantera al 6 y la trasera al 0. La compresión del amortiguador trasero al 25 y la compresión rápida al 34. La extensión rápida trasera al 25. Reparto de frenada al 74% delante. Neumáticos medios a 23 delante y 22 detrás. Un nivel 7 de control de tracción sería lo ideal.
series18_event6=El BMW tiene un motor fantástico, así que vamos a limitarnos a optimizar la aerodinámica con un alerón trasero lo más bajo posible. Pon el alerón delantero a 0 y el trasero a 3. Los neumáticos duros serán obligatorios, con una presión de 29 delante y 25 detrás. Reparto de frenada al 79% delante para estabilizar el coche tanto como sea posible al frenar. Pon la barra estabilizadora delantera al 5 y la rigidez de los muelles delanteros al 190. Altura delantera 10, altura trasera 28 y barra estabilizadora trasera al 0. Relación de transmisión final de 10-47. Control de tracción a nivel 8.
series18_event7=La última carrera en Spa Francorchamps. Será mejor conseguir un buen resultado, así que tal vez debamos arriesgar un poco con la configuración. Mantén los neumáticos medios y pon el alerón delantero a 0 y el trasero a 4. Un valor de 7 en el control de tracción te ayudará con la salida lenta de las curvas. Pon la rigidez de los muelles delanteros a 200 para girar bien y tener una mayor estabilidad al frenar. Pon la altura delantera a 6 y la trasera a 26 para que el difusor haga bien su trabajo. Por último, pon el equilibrio de los frenos delanteros al 74%. No será un coche fácil de controlar, pero será rápido. ¡A por ellos!
series18_name=Serie GT BMW Z4 GT3
series19=¡Te damos la bienvenida a la serie extrema BMW GT3!</br></br> BMW te da la bienvenida a su equipo de resistencia de GT3. Con ayuda de la marca, vas a conducir un Z4 GT3 durante toda la temporada. Además, serás el encargado de afrontar las prácticas y las sesiones clasificatorias durante el fin de semana de carrera.</br></br> El equipo cree que deberías conseguir <strong>60 puntos en el campeonato</strong>.
series19_event1=El BMW Z4 GT3 es, sin duda, un coche ganador. Es muy sensible a los cambios de configuración, así que en esta primera carrera nos centraremos en los cambios que nos permitirán un manejo seguro en futuras carreras. Alerón delantero 1, trasero 6. Reparto de frenada al 74% delante. Rigidez de los muelles delanteros al 200, barra estabilizadora delantera al 8. Altura inferior frontal a 7 y trasera a 30. Bloqueo del diferencial al 60%. Con esto, el coche debería ser lo bastante rápido y estable para afrontar esta primera carrera.
series19_event2=Vallelunga es un circuito relativamente seguro, así que aquí podremos experimentar con configuraciones más arriesgadas de cara a conseguir velocidad máxima y en las curvas. Pon el alerón delantero al 0 y el trasero al 4. Reparto de frenada al 74%, ya que el coche se descontrola un poco al frenar. Pon la rigidez de los muelles delanteros a 200 y la barra estabilizadora delantera a 6. Puede que todavía tengas problemas al salir de las curvas, así que juega con el control de tracción entre los niveles 5-7.
series19_event3=Silverstone es un circuito muy difícil, así que será mejor no arriesgarnos demasiado. Te sugiero el alerón delantero al 1, el trasero al 6, la barra estabilizadora frontal al 8 y reparto de frenada al 74% delante. El clima es frío, así que deberías poder afrontar la carrera con neumáticos medios (aunque siempre hay un cierto riesgo de sobrecalentamiento). Si ves que tienes problemas, cambia a neumáticos duros y baja la presión en 3 clics.
series19_event4=En Mugello es importante controlar la parte trasera del coche y, al mismo tiempo, lograr una buena velocidad en mitad de las curvas. Empecemos con el alerón delantero a 1 y el trasero a 6. Usaremos una configuración muy dura para cargar mejor los neumáticos. Recorrido delantero al 40. Barra estabilizadora delantera al 10, altura delantera al 8. Carrera trasera al 70. Rigidez de los muelles delanteros al 90, altura trasera al 20. Barra estabilizadora trasera al 6. Usa neumáticos duros, 24 delante y 25 detrás. Tómatelo con calma en la primera vuelta para que los neumáticos se calienten bien. Luego podrás empezar a correr.
series19_event5=Como suele ser habitual en Imola, tenemos mucho que ajustar para esos pianos. Pon el alerón delantero al 1 y el trasero al 6. Recorrido trasero al 70. La barra estabilizadora delantera al 6 y la trasera al 0. La compresión del amortiguador trasero al 25 y la compresión rápida al 34. La extensión rápida trasera al 25. Reparto de frenada al 74% delante. Neumáticos medios a 23 delante y 22 detrás. Un nivel 7 de control de tracción sería lo ideal.
series19_event6=El BMW tiene un motor fantástico, así que vamos a limitarnos a optimizar la aerodinámica con un alerón trasero lo más bajo posible. Pon el alerón delantero a 0 y el trasero a 3. Los neumáticos duros serán obligatorios, con una presión de 29 delante y 25 detrás. Reparto de frenada al 79% delante para estabilizar el coche tanto como sea posible al frenar. Pon la barra estabilizadora delantera al 5 y la rigidez de los muelles delanteros al 190. Altura delantera 10, altura trasera 28 y barra estabilizadora trasera al 0. Relación de transmisión final de 10-47. Control de tracción a nivel 8.
series19_event7=La última carrera en Spa Francorchamps. Será mejor conseguir un buen resultado, así que tal vez debamos arriesgar un poco con la configuración. Mantén los neumáticos medios y pon el alerón delantero a 0 y el trasero a 4. Un valor de 7 en el control de tracción te ayudará con la salida lenta de las curvas. Pon la rigidez de los muelles delanteros a 200 para girar bien y tener una mayor estabilidad al frenar. Pon la altura delantera a 6 y la trasera a 26 para que el difusor haga bien su trabajo. Por último, pon el equilibrio de los frenos delanteros al 74%. No será un coche fácil de controlar, pero será rápido. ¡A por ellos!
series19_name=Serie extrema BMW Z4 GT3
series1_event1=El Abarth 500 EsseEsse es un coche de inicio, con un manejo seguro y divertido. Entrena en la contrarreloj del autódromo de Vallelunga y prepárate para la primera carrera.
series1_event2=El club local de Abarth está organizando una pequeña carrera individual. Demuestra tu habilidad en este frenético enfrentamiento a 3 vueltas.
series1_event3=Los demás amantes de los coches están empezando a confiar en ti. Un amigo te ha ofrecido su Alfa Romeo Giulietta QV para afrontar la contrarreloj del circuito de Magione. ¡Demuestra que eres digno de su confianza!
series1_event4=Has hecho un gran trabajo y, gracias a ello, tendrás la oportunidad de competir con el Alfa Romeo Giulietta QV en una carrera en Magione. Ten cuidado con los competidores de la zona, ya que han preparado sus Abarth con mejores neumáticos, mejor suspensión y mejoras en el motor. Demuéstrales de lo que eres capaz en una carrera a 5 vueltas.
series1_event5=Una de las características más destacables del circuito de Magione es que siempre está polvoriento. Tendrás ocasión de probar un BMW M3 E30 tuneado en una superficie polvorienta con mucho menos agarre. Ten cuidado con los puntos de frenado y con los volantazos.
series1_name=Serie Novato 1
series2=¡Buen trabajo! ¡Has desbloqueado la serie Novato 2! </br></br>Lo has hecho de maravilla en la primera serie, así que ahora tendrás que demostrar tu valía con coches de tracción trasera. BMW fabrica algunos de los mejores coches deportivos del mundo, vehículos que, además de rápidos y fascinantes, te permiten mejorar tu técnica al volante gracias a lo fácil que es conducirlos al límite.</br></br> Consigue <strong>2 medallas de bronce y 1 de plata</strong> para completar esta serie.
series20=¡Te damos la bienvenida al equipo McLaren GT3!</br></br>El programa de resistencia McLaren GT3 asciende a los mejores pilotos novatos para que participen en una temporada completa de resistencia.</br></br>El equipo espera que consigas, como mínimo, <strong>60 puntos en el campeonato.</strong>
series20_event1=El campeonato de resistencia comenzará en el Gran Premio de Nürburgring. El ingeniero te sugiere que, para la primera carrera, uses una configuración segura en tu McLaren MP4 12C GT3. Usa neumáticos medios y baja 2 clics la presión de los cuatro. Usa una configuración de alerón trasero de 6 y una relación de transmisión final un poco más baja. Intenta que el coche salga lo mejor parado posible, ya que el campeonato es largo y podremos atacar cuando te hayas acostumbrado al coche.
series20_event2=Vallelunga es un circuito de mucho frenar y acelerar. Intentemos una configuración un poco más agresiva: alerón delantero al 1; alerón trasero al 5; baja 2 clics la presión de los neumáticos delanteros y 1 clic la presión de los neumáticos traseros; 1 clic más en la barra estabilizadora trasera y, si quieres, 1 clic más en los frenos traseros para el reparto de frenada. Prueba las cosas una a una y ve experimentando. Si tienes problemas al salir de las curvas lentas, usa 6 o 7 de control de tracción.
series20_event3=Silverstone tiene unas curvas muy complicadas y quema mucho los neumáticos. Mantén la presión predeterminada de los neumáticos medios. Como la velocidad máxima no es tan importante como el agarre a alta velocidad, te sugiero que mantengas la configuración aerodinámica predeterminada. Si acaso, 2 clics más en la barra estabilizadora delantera para estabilizar el coche. Si aun así tienes problemas al frenar en las curvas, aumenta en 2 clics el reparto de frenada en los frenos delanteros. De nuevo, usa un clic menos en la relación de transmisión final.
series20_event4=Mugello es un circuito que exige mucho a los neumáticos, al conductor y a la configuración. Si la temperatura es demasiado elevada, tendrás que usar neumáticos duros. Pon el alerón delantero a 0 y el trasero a 4 para optimizar la velocidad máxima en la recta larga. Reduce un par de clics la rigidez de los muelles delanteros y reduce 4 clics la de los traseros, para así bajar el vehículo y hacer que el difusor funcione mejor. Usa una potencia de diferencial del 20% para hacer que el coche sea más rápido y más fácil de controlar en las curvas largas. Reparto de frenada al 73% para estabilizar el coche al frenar. 1 clic menos en la sexta marcha.
series20_event5=Imola es un circuito muy complicado. Tendrás que ajustar mucho los amortiguadores para poder saltar en los pianos con una buena estabilidad. Reduce la presión de los neumáticos medios en 2 clics. Pon la extensión de los amortiguadores delanteros al 12 y la compresión al 15. Pon la compresión de los amortiguadores traseros al 5 y la compresión rápida al 30. Pon el recorrido trasero al 70. Barra estabilizadora trasera al 0. Potencia del diferencial al 40%. 1 clic menos en la relación de transmisión final.
series20_event6=En Monza, lo más importante es la velocidad máxima y la agilidad en las chicanas lentas. Empecemos con el alerón delantero al 0 y el trasero al 1. Altura de la suspensión, 24 delante y 21 detrás. Usa neumáticos duros, con una presión de 29 delante y 27 detrás. Ten cuidado con el sobrecalentamiento. Barra estabilizadora delantera al 7. Barra estabilizadora trasera al 0. Eleva el reparto de frenada al 71% delante para girar con una mayor estabilidad. Ten cuidado al empezar la carrera, ya que es fácil que se produzcan incidentes en la primera chicana.
series20_event7=Spa es un circuito muy completo, con curvas lentas y rápidas. Es parecido a Silverstone, pero con el añadido de contar con más colinas y de necesitar más velocidad máxima en las rectas. Empieza con el alerón delantero a 0 y el trasero a 4. Barra estabilizadora delantera al 7, para recuperar estabilidad. Es posible que tengas que usar neumáticos duros; de ser así, reduce la presión en 3 clics. 1 clic menos en la relación de la 6.ª marcha. Reparto de frenada al 72% delante.
series20_name=Serie McLaren MP4 GT3
series21=¡Te damos la bienvenida al equipo de fábrica McLaren GT3!</br></br> El programa Extremo de McLaren GT3 requiere una dedicación total durante toda una temporada de resistencia. Los fines de semana de carrera no solo tendrás que participar en la carrera, sino también en las prácticas y en las sesiones clasificatorias.</br></br> El equipo espera que consigas, como mínimo, <strong>60 puntos en el campeonato.</strong>
